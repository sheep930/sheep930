    // ============================================================
    // 仪表板、图库、切换标签
    // ============================================================
    function renderDashboard() {
        const totalMaterials = materials.length;
        const canMakeCount = recipes.filter(r => r.ingredients.every(ing => {
            const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
            return totalAvail >= ing.quantity;
        })).length;
        document.getElementById('dashboardStats').innerHTML = `
            <div class="stat-card" onclick="switchTab('materials')">
                <span class="stat-icon">📦</span>
                <span class="stat-label">库存</span>
                <div class="stat-info"><div class="stat-value">${totalMaterials}</div><div class="stat-desc">库存种类材料</div></div>
            </div>
            <div class="stat-card" onclick="switchTab('recipes'); document.getElementById('recipeFilter').value='can-make'; renderRecipes();">
                <span class="stat-icon">🍰</span>
                <span class="stat-label">可做</span>
                <div class="stat-info"><div class="stat-value">${canMakeCount}</div><div class="stat-desc">可制作配方</div></div>
            </div>`;
        const availableRecipes = recipes.filter(r => r.ingredients.every(ing => {
            const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
            return totalAvail >= ing.quantity;
        }));
        const tableWrap = document.getElementById('availableRecipesTableWrap');
        const tbody = document.getElementById('availableRecipesTableBody');
        const emptyEl = document.getElementById('availableRecipesEmpty');
        if (availableRecipes.length === 0) { tableWrap.style.display = 'none'; emptyEl.style.display = 'block'; }
        else {
            tableWrap.style.display = 'block'; emptyEl.style.display = 'none';
            tbody.innerHTML = availableRecipes.map((r) => {
                return `<tr onclick="viewRecipeDetail('${r.id}')">
                    <td><span class="avail-emoji">${escapeHtml(r.emoji||'📖')}</span><span class="avail-name">${escapeHtml(r.name)}</span><span class="avail-meta">（${r.ingredients.length}种材料）</span></td>
                    <td style="text-align:right;"><button class="avail-action" onclick="event.stopPropagation(); showFullscreenStepsById('${r.id}');">制作</button></td>
                </tr>`;
            }).join('');
        }
    }

    function renderGallery() {
        const container = document.getElementById('galleryContainer');
        const groups = {};
        recipes.forEach(r => { if (r.finalImages && r.finalImages.length > 0) groups[r.id] = { name: r.name, emoji: r.emoji || '📖', images: r.finalImages }; });
        if (Object.keys(groups).length === 0) { container.innerHTML = '<div class="gallery-empty"><span class="empty-icon">🖼️</span><p>暂无成品图</p></div>'; return; }
        const maxDisplay = 8;
        let html = '';
        for (const id in groups) {
            const g = groups[id];
            const total = g.images.length;
            const showMore = total > maxDisplay;
            const displayImages = showMore ? g.images.slice(0, maxDisplay) : g.images;
            html += `<div class="gallery-group" style="margin-bottom:24px;"><div class="gallery-group-title" style="font-weight:700;color:var(--primary-dark);margin-bottom:8px;">${escapeHtml(g.emoji)} ${escapeHtml(g.name)} (${total}张)</div><div class="gallery-grid" id="gallery-grid-${id}">`;
            const renderCount = showMore ? maxDisplay : g.images.length;
            for (let origIdx = 0; origIdx < renderCount; origIdx++) {
                const imgId = g.images[origIdx];
                const counter = total > 1 ? `${origIdx+1}/${total}` : '';
                const isLastAndMore = showMore && origIdx === maxDisplay - 1;
                const moreBadge = isLastAndMore ? `<span class="gallery-more-badge">+${total - maxDisplay}</span>` : '';
                html += `<div class="gallery-item" data-img-id="${imgId}" onclick="previewFullImageByRecipe('${id}', ${origIdx}, false)" style="position:relative;">
                    <div class="gallery-img-wrap" style="position:relative;">
                        <img src="" loading="lazy" style="display:none;">
                        <span style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">加载中</span>
                        ${counter ? `<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;padding:0 8px;border-radius:12px;font-size:0.6rem;font-weight:600;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);line-height:1.6;z-index:5;">${counter}</span>` : ''}
                        ${moreBadge}
                    </div>
                </div>`;
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;
        container.querySelectorAll('.gallery-item[data-img-id]').forEach(el => {
            const id = el.dataset.imgId;
            getImage(id).then(url => {
                if (url) {
                    const wrap = el.querySelector('.gallery-img-wrap');
                    const img = wrap.querySelector('img');
                    const placeholder = wrap.querySelector('span');
                    if (img) { img.src = url; img.style.display = 'block'; }
                    if (placeholder) placeholder.style.display = 'none';
                }
            }).catch(() => { const wrap = el.querySelector('.gallery-img-wrap'); if (wrap) wrap.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--danger);">加载失败</span>'; });
        });
    }

    window.switchTab = function(tabName) {
        closeAllModals();
        window.scrollTo(0, 0);
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        const tabMap = { 'dashboard': 'panel-dashboard', 'materials': 'panel-materials', 'recipes': 'panel-recipes', 'gallery': 'panel-gallery', 'logs': 'panel-logs' };
        const panelId = tabMap[tabName];
        if (!panelId) return;
        const tabBtn = document.querySelector('.nav-tab[data-panel="' + tabName + '"]');
        if (tabBtn) tabBtn.classList.add('active');
        const panel = document.getElementById(panelId);
        if (panel) panel.classList.add('active');
        if (tabName === 'dashboard') renderDashboard();
        else if (tabName === 'materials') renderMaterials();
        else if (tabName === 'recipes') renderRecipes();
        else if (tabName === 'gallery') renderGallery();
        else if (tabName === 'logs') renderLogs();
        const panelEl = document.getElementById(panelId);
        if (panelEl) panelEl.scrollTop = 0;
    };

    function renderAll() {
        renderDashboard();
        renderMaterials();
        renderRecipes();
        renderGallery();
        renderLogs();
    }

    // 初始化和事件绑定
    var clearFrom = document.getElementById('clearLogDateFrom');
    if (clearFrom) clearFrom.addEventListener('click', () => { document.getElementById('logDateFrom').value = ''; document.getElementById('logDateFrom_date').value = ''; applyLogFilters(); });
    var clearTo = document.getElementById('clearLogDateTo');
    if (clearTo) clearTo.addEventListener('click', () => { document.getElementById('logDateTo').value = ''; document.getElementById('logDateTo_date').value = ''; applyLogFilters(); });

    openDB().then(() => {
        console.log('IndexedDB 已就绪');
        applyLoginState();
        renderAll();
        bindMaterialDragEvents();
        bindRecipeDragEvents();
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() { switchTab(this.dataset.panel); });
        });
        // 启动后尝试从云端拉取最新数据（仅首次/较新数据时覆盖，编辑中不联网）
        syncOnStartup();
    }).catch(err => { console.error('IndexedDB 初始化失败', err); showToast('⚠️ 存储初始化失败，请重新加载页面', 'error'); });

    // 暴露全局函数
    window.escapeHtml = escapeHtml;
    window.showToast = showToast;
    window.showConfirm = showConfirm;
    window.closeModal = closeModal;
    window.closeAllModals = closeAllModals;
    window.renderAll = renderAll;
    window.renderMaterials = renderMaterials;
    window.renderRecipes = renderRecipes;
    window.renderDashboard = renderDashboard;
    window.renderLogs = renderLogs;
    window.clearLogs = clearLogs;
    window.exportData = exportData;
    window.importData = importData;
    window.openCloudSettings = openCloudSettings;
    window.saveCloudSettings = saveCloudSettings;
    window.syncNowPull = syncNowPull;
    window.syncNowPush = syncNowPush;
    window.openMaterialDetail = openMaterialDetail;
    window.openMaterialModalWithData = openMaterialModalWithData;
    window.openMaterialModal = openMaterialModal;
    window.saveMaterial = saveMaterial;
    window.deleteMaterial = deleteMaterial;
    window.openCategoryModal = openCategoryModal;
    window.confirmNewCategory = confirmNewCategory;
    window.openCategoryMgmtModal = openCategoryMgmtModal;
    window.openRenameCategoryModal = openRenameCategoryModal;
    window.confirmRenameCategory = confirmRenameCategory;
    window.deleteCategoryEntry = deleteCategoryEntry;
    window.viewCategoryItems = viewCategoryItems;
    window.openRecipeModal = openRecipeModal;
    window.viewRecipeDetail = viewRecipeDetail;
    window.deleteRecipe = deleteRecipe;
    window.showFullscreenStepsById = showFullscreenStepsById;
    window.openFinalImageManager = openFinalImageManager;
    window.closeFinalImageManager = closeFinalImageManager;
    window.addFinalImageFromManager = addFinalImageFromManager;
    window.deleteFinalImageFromManager = deleteFinalImageFromManager;
    window.addIngredientRow = addIngredientRow;
    window.addStep = addStep;
    window.moveStep = moveStep;
    window.removeStep = removeStep;
    window.moveIngredient = moveIngredient;
    window.removeIngredientRow = removeIngredientRow;
    window.onCategoryChange = onCategoryChange;
    window.onQtyChange = onQtyChange;
    window.onUnitChange = onUnitChange;
    window.autoCalcAndFillNutrition = autoCalcAndFillNutrition;
    window.updateNutritionPreview = updateNutritionPreview;
    window.renderStepEditItems = renderStepEditItems;
    window.renderEditFinalImages = renderEditFinalImages;
    window.syncStepTextsFromDOM = syncStepTextsFromDOM;
    window.addCategoryFromRecipe = addCategoryFromRecipe;
    window.confirmNewCategoryFromRecipe = confirmNewCategoryFromRecipe;
    window.cancelNewCategoryFromRecipe = cancelNewCategoryFromRecipe;
    window.toggleStepMaterialCompleted = toggleStepMaterialCompleted;
    window.startStepTimer = startStepTimer;
    window.pauseStepTimer = pauseStepTimer;
    window.resetStepTimer = resetStepTimer;
    window.navPreview = navPreview;
    window.rotatePreview = rotatePreview;
    window.switchTab = switchTab;
    window.openAdjustRemainingModal = openAdjustRemainingModal;
    window.confirmAdjustRemaining = confirmAdjustRemaining;
    window.applyLogFilters = applyLogFilters;
    window.formatDateInput = formatDateInput;
    window.onNativeDateChange = onNativeDateChange;
    window.openCategoryFromMgmt = openCategoryFromMgmt;
    window.openCategoryFromMaterial = openCategoryFromMaterial;
    window.copyMaterial = function(materialId) {
        if (!requireOwner()) return;
        const src = findMaterialById(materialId);
        if (!src) { showToast('商品不存在', 'error'); return; }
        const newItem = JSON.parse(JSON.stringify(src));
        newItem.id = genId('m');
        newItem.totalQuantity = src.totalQuantity;
        newItem.remainingQuantity = newItem.totalQuantity;
        delete newItem._rev;
        materials.push(newItem);
        saveMaterials();
        showToast('✅ 已复制商品「' + src.name + '」', 'success');
        renderAllPreserveScroll();
    };
    window.sheepLogin = function() {
        if (isOwner()) {
            showConfirm('当前已登录（拥有者）。确定退出登录、切换为只读吗？', function() { logout(); }, function() {});
            return;
        }
        const cfg = getCloudConfig();
        const repoHint = cfg.repo
            ? '<div style="font-size:0.8rem;color:var(--text);margin:0 0 12px;">同步仓库：<b>' + escapeHtml(cfg.repo) + '</b></div>'
            : '<div style="font-size:0.8rem;color:var(--danger);margin:0 0 12px;">尚未配置仓库地址，登录后请先在「云同步」中填写</div>';
        const html = `<button class="close-btn" onclick="closeModal()">✕</button>
            <h2>🐑 小绵羊登录</h2>
            <p style="font-size:0.82rem;color:var(--text-muted);margin:0 0 14px;">输入你的 GitHub 访问令牌即可解锁编辑。令牌只保存在本机浏览器，绝不写入网页代码，访客无法获取。</p>
            ${repoHint}
            <div class="form-group"><label>访问令牌（ghp_ 或 github_pat_ 开头）</label><input type="password" id="loginToken" placeholder="粘贴你的 GitHub 令牌" autocomplete="off"></div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="confirmLogin()">🔓 登录</button>
            </div>`;
        openModal(html, false, 'sheepLogin');
    };
    window.confirmLogin = function() {
        const token = document.getElementById('loginToken').value.trim();
        if (!token) { showToast('请输入访问令牌', 'error'); return; }
        if (!/^(ghp_|github_pat_|gho_|ghs_|ghu_)/.test(token)) {
            showToast('令牌格式不对，应为 ghp_ 或 github_pat_ 开头', 'error');
            return;
        }
        const cfg = getCloudConfig();
        saveCloudConfig({ repo: cfg.repo, branch: cfg.branch, path: cfg.path, token: token });
        applyLoginState();
        closeModal();
        showToast('🔓 已登录，现在可以编辑了', 'success');
        renderAllPreserveScroll();
    };

    // 回收站 - 清空按钮移到标题左侧
    window.openRecycleBin = function() {
        const itemsHTML = recycleBin.length === 0 ? '<p style="text-align:center;color:var(--text-muted);padding:20px;">回收站为空</p>' :
        recycleBin.map((item, index) => {
            let title = '', icon = '';
            if (item.type === 'material') { title = item.data.name; icon = '📦'; }
            else if (item.type === 'recipe') { title = item.data.name; icon = '🍰'; }
            else if (item.type === 'category') { title = item.data.name; icon = '🏷️'; }
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface-alt);border:1px solid var(--border-light);border-radius:var(--radius-sm);margin-bottom:6px;">
                <span>${icon} ${escapeHtml(title)}</span>
                <button class="btn btn-xs btn-outline" onclick="restoreRecycleItem(${index})">还原</button>
            </div>`;
        }).join('');
        const html = `<button class="close-btn" onclick="closeModal()">✕</button>
            <div style="display:flex;justify-content:flex-start;align-items:center;margin-bottom:12px;gap:12px;">
                <h2 style="margin:0;">回收站</h2>
                <button class="btn btn-danger btn-sm" onclick="clearRecycleBin()" style="min-height:32px;padding:4px 14px;font-size:0.8rem;">清空回收站</button>
            </div>
            <div style="max-height:400px;overflow-y:auto;">${itemsHTML}</div>`;
        openModal(html, false, 'recycleBin');
    };
    window.restoreRecycleItem = function(index) {
        if (!requireOwner()) return;
        const item = recycleBin[index];
        if (!item) return;
        if (item.type === 'material') {
            const existing = materials.find(m => m.id === item.data.id);
            if (existing) { showToast('⚠️ 商品已存在，无法重复还原', 'error'); }
            else { materials.push(item.data); saveMaterials(); showToast('✅ 商品已还原', 'success'); }
        } else if (item.type === 'recipe') {
            const existing = recipes.find(r => r.id === item.data.id);
            if (existing) { showToast('⚠️ 配方已存在，无法重复还原', 'error'); }
            else { recipes.push(item.data); saveRecipes(); showToast('✅ 配方已还原', 'success'); }
        } else if (item.type === 'category') {
            if (!CATEGORIES.includes(item.data.name)) { CATEGORIES.push(item.data.name); saveCategories(); showToast('✅ 分类已还原', 'success'); }
            else { showToast('⚠️ 分类已存在', 'error'); }
        }
        recycleBin.splice(index, 1);
        saveRecycleBin();
        renderAllPreserveScroll();
        openRecycleBin();
    };
    window.clearRecycleBin = function() {
        if (!requireOwner()) return;
        showConfirm('确定清空回收站？所有已删除项目将永久删除。', () => {
            recycleBin.forEach(item => {
                if (item.type === 'recipe') {
                    const imageIds = [
                        ...(item.data.finalImages || []),
                        ...(item.data.steps || []).flatMap(s => s.images || [])
                    ];
                    for (const id of imageIds) deleteImage(id);
                }
            });
            recycleBin = [];
            saveRecycleBin();
            showToast('✅ 回收站已清空');
            const emptyHTML = `<button class="close-btn" onclick="closeModal()">✕</button>
            <div style="display:flex;justify-content:flex-start;align-items:center;margin-bottom:12px;gap:12px;">
                <h2 style="margin:0;">回收站</h2>
                <button class="btn btn-danger btn-sm" onclick="clearRecycleBin()" style="min-height:32px;padding:4px 14px;font-size:0.8rem;">清空回收站</button>
            </div>
            <div style="max-height:400px;overflow-y:auto;"><p style="text-align:center;color:var(--text-muted);padding:20px;">回收站为空</p></div>`;
            replaceModalContent(emptyHTML, 0);
            renderAllPreserveScroll();
        }, () => {});
    };

    function bindMaterialDragEvents() {
        const tbody = document.getElementById('materialTableBody');
        if (!tbody) return;
        let dragId = null;
        tbody.addEventListener('dragstart', (e) => {
            const tr = e.target.closest('tr[draggable="true"]');
            if (!tr) return;
            dragId = tr.dataset.id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragId);
            tr.style.opacity = '0.5';
        });
        tbody.addEventListener('dragend', (e) => {
            const tr = e.target.closest('tr');
            if (tr) tr.style.opacity = '';
            dragId = null;
        });
        tbody.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        tbody.addEventListener('drop', (e) => {
            e.preventDefault();
            const targetTr = e.target.closest('tr[draggable="true"]');
            if (!targetTr || !dragId) return;
            const targetId = targetTr.dataset.id;
            if (dragId === targetId) return;
            const dragIndex = materials.findIndex(m => m.id === dragId);
            const targetIndex = materials.findIndex(m => m.id === targetId);
            if (dragIndex === -1 || targetIndex === -1) return;
            const [moved] = materials.splice(dragIndex, 1);
            materials.splice(targetIndex, 0, moved);
            currentSort = { key: null, direction: 'none' };
            updateSortIndicators();
            saveMaterials();
            renderMaterials();
        });
    }

    function bindRecipeDragEvents() {
        const grid = document.getElementById('recipesGrid');
        if (!grid) return;
        let dragId = null;
        grid.addEventListener('dragstart', (e) => {
            const card = e.target.closest('.recipe-card[draggable="true"]');
            if (!card) return;
            dragId = card.dataset.id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragId);
            card.style.opacity = '0.5';
        });
        grid.addEventListener('dragend', (e) => {
            const card = e.target.closest('.recipe-card');
            if (card) card.style.opacity = '';
            dragId = null;
        });
        grid.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        grid.addEventListener('drop', (e) => {
            e.preventDefault();
            const targetCard = e.target.closest('.recipe-card[draggable="true"]');
            if (!targetCard || !dragId) return;
            const targetId = targetCard.dataset.id;
            if (dragId === targetId) return;
            const dragIndex = recipes.findIndex(r => r.id === dragId);
            const targetIndex = recipes.findIndex(r => r.id === targetId);
            if (dragIndex === -1 || targetIndex === -1) return;
            const [moved] = recipes.splice(dragIndex, 1);
            recipes.splice(targetIndex, 0, moved);
            recipes.forEach((recipe, index) => { recipe.order = index; });
            saveRecipes();
            renderRecipes();
        });
    }

    console.log('🥐 烘焙工作台 v9.0 已就绪');
})();
    </script>
