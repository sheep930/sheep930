                    <div class="timer-controls">
                        <span class="timer-display step-timer-display-${recipeId}-${i}">00:00</span>
                        <button class="btn btn-primary btn-xs step-timer-start-${recipeId}-${i}" onclick="startStepTimer('${recipeId}', ${i})">开始</button>
                        <button class="btn btn-xs step-timer-pause-${recipeId}-${i}" onclick="pauseStepTimer('${recipeId}', ${i})" disabled>暂停</button>
                        <button class="btn btn-xs step-timer-reset-${recipeId}-${i}" onclick="resetStepTimer('${recipeId}', ${i})">重置</button>
                    </div>
                </div>
            ` : '';
            const stepNum = toChineseNumber(i + 1);
            return `<div class="step-card" data-step-index="${i}"><div class="step-header"><span class="step-num-icon">${i + 1}</span><span class="step-num-text">步骤${stepNum}</span></div><div class="step-text">${escapeHtml(s.text)}</div>${matsHTML}${timerDisplay}<div id="${listId}" style="width:100%;"></div></div>`;
        }).join('');

        const finalImageIds = recipe.finalImages || [];
        let imagesHTML = '';
        if (finalImageIds.length > 0) {
            const imgs = await Promise.all(finalImageIds.map(id => getImage(id)));
            const valid = imgs.filter(d => d);
            if (valid.length > 0) {
                imagesHTML = valid.map((url, i) => {
                    const label = valid.length > 1 ? `${i+1}/${valid.length}` : '';
                    return `<div class="detail-thumb-item" onclick="previewFullImageByRecipe('${recipe.id}', ${i}, true)"><img src="${url}" alt="成品图 ${i+1}" loading="lazy">${label ? `<span class="thumb-counter">${label}</span>` : ''}<div class="thumb-overlay"><span>🔍</span></div></div>`;
                }).join('');
            } else {
                imagesHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
            }
        } else {
            imagesHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
        }

        const per100 = calcRecipeNutritionPer100g(recipe);
        let nutHTML = '';
        if (per100) {
            const rows = [
                ['能量', 'kJ', 'calories', per100.calories],
                ['蛋白质', 'g', 'protein', per100.protein],
                ['脂肪', 'g', 'fat', per100.fat],
                ['碳水化合物', 'g', 'carbs', per100.carbs],
                ['钠', 'mg', 'sodium', per100.sodium],
                ['钙', 'mg', 'calcium', per100.calcium]
            ];
            const totalGrams = totalWeight || 100;
            const portionGrams = totalGrams / (_detailServings || 1);
            const factor = portionGrams / 100;
            nutHTML = `<div style="margin-top:12px;"><div style="font-weight:700;color:var(--text);margin-bottom:4px;">📊 营养成分表</div>
                <table class="detail-nutrition-table" style="table-layout:fixed;">
                    <thead><tr><th style="width:34%;">成分</th><th style="width:33%;">每100g</th><th style="width:33%;">每份</th></tr></thead>
                    <tbody>${rows.map(row => {
                        const v100 = row[3];
                        const vPortion = (v100 != null) ? (v100 * factor) : null;
                        return `<tr><td>${row[0]}</td><td>${v100!=null ? v100+row[1] : '—'}</td><td>${vPortion!=null ? vPortion.toFixed(1)+row[1] : '—'}</td></tr>`;
                    }).join('')}</tbody>
                </table></div>`;
        }

        const nameHTML = `<span class="detail-emoji">${escapeHtml(recipe.emoji||'📖')}</span> ${escapeHtml(recipe.name)}`;
        return `
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="detail-recipe-name">${nameHTML}</div>
            <div class="detail-recipe-desc">${escapeHtml(recipe.description||'暂无描述')}</div>
            <span class="detail-status-badge ${statusCls}">${status}</span>
            <div class="detail-section-title"><span>📦 用料</span><div class="servings-control"><label>份数</label><div class="servings-stepper"><input type="number" id="servingsInput" value="${_detailServings}" min="0.5" step="0.5" oninput="updateServings(this.value)" onchange="updateServings(this.value)"><div class="servings-step-btns"><button type="button" class="servings-step-btn" onclick="adjustServings(0.5)">▲</button><button type="button" class="servings-step-btn" onclick="adjustServings(-0.5)">▼</button></div></div></div></div>
            <div id="detailIngredientsList">${ingredientsHTML}</div>
            <div class="detail-ingredients-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                <span class="total-weight">${totalWeightText}</span>
                <button class="btn btn-primary btn-sm edit-only" onclick="useAllMaterialsByCategory('${recipe.id}')">全部使用</button>
            </div>
            ${nutHTML}
            <div class="detail-steps-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;">📋 制作步骤</div><div id="detailStepsContainer">${stepsCardsHTML}</div></div>
            <div class="detail-final-images-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span>🖼️ 成品图 (${finalImageIds.length}张)</span><button class="btn btn-outline btn-sm edit-only" onclick="openFinalImageManager('${recipe.id}')">管理成品图</button></div><div class="detail-thumb-grid">${imagesHTML}</div></div>
            <div class="detail-actions">
                <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
                <button class="btn btn-outline edit-only" onclick="closeModal(); setTimeout(function(){ openRecipeModal('${recipe.id}', true); }, 50);">编辑</button>
                <button class="btn btn-primary" onclick="showFullscreenStepsById('${recipe.id}')">👩‍🍳 制作此配方</button>
            </div>`;
    }

    // 更新视图：如果当前是同一个配方的详情页，则更新内容
    async function updateRecipeDetailIfCurrent(recipeId) {
        const modal = document.querySelector('#modalOverlay .modal');
        if (!modal) return false;
        const currentRecipeId = modal.dataset.recipeId;
        if (currentRecipeId === recipeId) {
            const html = await generateRecipeDetailHTML(recipeId);
            replaceModalContent(html, modal.scrollTop);
            // 重新绑定事件
            setTimeout(() => {
                const servingsInput = document.getElementById('servingsInput');
                if (servingsInput) {
                    servingsInput.value = _detailServings;
                }
            }, 50);
            return true;
        }
        return false;
    }

    window.viewRecipeDetail = async function(recipeId, keepPosition) {
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        
        // 如果当前已经是该配方的详情页，直接更新内容
        const updated = await updateRecipeDetailIfCurrent(recipeId);
        if (updated) {
            _detailRecipeId = recipeId;
            return;
        }

        // 否则打开新的详情页
        if (keepPosition) {
            const oldModal = document.querySelector('#modalOverlay .modal');
            if (oldModal) _detailModalScrollTop = oldModal.scrollTop;
        }
        _detailRecipeId = recipeId;
        _detailServings = keepPosition ? _detailServings : 1;
        
        const html = await generateRecipeDetailHTML(recipeId);
        openModal(html, false, 'recipeDetail_' + recipeId);
        
        if (keepPosition && _detailModalScrollTop) {
            setTimeout(() => {
                const modal = document.querySelector('#modalOverlay .modal');
                if (modal) modal.scrollTop = _detailModalScrollTop;
            }, 60);
        }
        setTimeout(() => {
            recipe.steps.forEach((s, i) => {
                const containers = document.querySelectorAll(`#detailStepsContainer .step-card[data-step-index="${i}"] [id^="stepList_${i}_"]`);
                if (containers.length > 0) {
                    const container = containers[containers.length - 1];
                    if (container && s.images && s.images.length > 0) renderStepImagesList(s.images, container.id, i);
                }
                const key = recipeId + '_' + i;
                if (!stepTimers[key]) {
                    const totalSec = (s.timerMinutes || 0) * 60;
                    stepTimers[key] = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
                }
                updateStepTimerDisplay(recipeId, i);
            });
        }, 100);
    };

    window.adjustServings = function(delta) {
        const input = document.getElementById('servingsInput');
        if (!input) return;
        let val = parseFloat(input.value) || 1;
        val = Math.max(0.5, Math.round((val + delta) * 2) / 2);
        input.value = val;
        updateServings(val);
    };
    window.updateServings = function(val) {
        const num = parseFloat(val) || 1;
        if (num < 0.1) return;
        _detailServings = num;
        if (_detailRecipeId) {
            const recipe = recipes.find(r => r.id === _detailRecipeId);
            if (!recipe) return;
            recipe.ingredients.forEach((ing, i) => {
                const displayAmount = ing.quantity * _detailServings;
                const amountEl = document.querySelectorAll('.detail-ingredient-item .ing-amount')[i];
                if (amountEl) amountEl.textContent = displayAmount;
            });
            let totalWeight = 0;
            recipe.ingredients.forEach(ing => {
                const qty = ing.quantity * _detailServings;
                if (ing.unit === 'g') totalWeight += qty;
                else if (ing.unit === 'kg') totalWeight += qty * 1000;
                else if (ing.unit === 'ml') totalWeight += qty * getDensityForCategory(ing.category);
                else if (ing.unit === 'L') totalWeight += qty * getDensityForCategory(ing.category) * 1000;
            });
            const weightEl = document.querySelector('.total-weight');
            if (weightEl) weightEl.textContent = totalWeight > 0 ? `总重量：约 ${totalWeight} g` : '';
            recipe.steps.forEach((s, i) => {
                if (s.materials && s.materials.length > 0) {
                    const stepCard = document.querySelectorAll('#detailStepsContainer .step-card')[i];
                    if (stepCard) {
                        const matsContainer = stepCard.querySelector('.step-materials-display')?.parentElement;
                        if (matsContainer) {
                            const matsHTML = renderStepMaterials(s.materials, recipe);
                            if (matsHTML) {
                                const oldSpans = matsContainer.querySelectorAll('.step-materials-display');
                                const completedStates = Array.from(oldSpans).map(sp => sp.classList.contains('completed'));
                                matsContainer.innerHTML = ' 材料：' + matsHTML;
                                const newSpans = matsContainer.querySelectorAll('.step-materials-display');
                                newSpans.forEach((sp, idx) => { if (completedStates[idx]) sp.classList.add('completed'); });
                            }
                        }
                    }
                }
            });
        }
    };

    // 使用材料逻辑（多选）
    let _multiSelectState = null;
    window.useMaterialByCategory = function(recipeId, category, quantity, unit, servings) {
        if (!requireOwner()) return;
        const need = quantity * servings;
        const items = materials.filter(m => m.category === category);
        const available = items.filter(item => getItemRemaining(item) > 0);
        if (available.length === 0) { showToast('⚠️ 没有「' + category + '」类库存', 'error'); return; }
        if (available.length === 1) {
            const item = available[0];
            const remaining = getItemRemaining(item);
            const remainingInTarget = convertToUnit(remaining, item.unit, unit, item.name);
            if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
            const actualUse = Math.min(need, remainingInTarget);
            const actualUseOriginal = convertToUnit(actualUse, unit, item.unit, item.name);
            const recipe = recipes.find(r => r.id === recipeId);
            const recipeName = recipe ? recipe.name : '直接使用';
            addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, recipeId);
            const msg = actualUse < need ? '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」（库存不足，已全部使用）' : '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」';
            showToast(msg, 'success');
            renderAllPreserveScroll();
            if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
            return;
        }
        _multiSelectState = { category, remainingNeed: need, unit, recipeId, excludeIds: [], recipeName: '', batchId: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
        showMultiSelectForRemaining(true);
    };

    function showMultiSelectForRemaining(isFirst) {
        if (!_multiSelectState) return;
        const s = _multiSelectState;
        const need = s.remainingNeed;
        if (need <= 0) {
            showToast('✅「' + s.category + '」已使用完毕', 'success');
            _multiSelectState = null; closeModal(); renderAllPreserveScroll();
            if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
            return;
        }
        const items = materials.filter(m => m.category === s.category);
        const available = items.filter(item => getItemRemaining(item) > 0 && !s.excludeIds.includes(item.id));
        if (available.length === 0) {
            showToast('⚠️「' + s.category + '」已无可选商品，还差 ' + need + s.unit, 'error');
            _multiSelectState = null; closeModal(); renderAllPreserveScroll();
            if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
            return;
        }
        if (available.length === 1) {
            const item = available[0];
            const remaining = getItemRemaining(item);
            const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
            if (remainingInTarget <= 0) { s.excludeIds.push(item.id); showMultiSelectForRemaining(false); return; }
            const actualUse = Math.min(s.remainingNeed, remainingInTarget);
            const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
            const recipe = recipes.find(r => r.id === s.recipeId);
            const recipeName = recipe ? recipe.name : '直接使用';
            addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId, s.batchId);
            s.remainingNeed -= actualUse;
            s.excludeIds.push(item.id);
            if (s.remainingNeed > 0 && remainingInTarget <= actualUse) {
                showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
                showMultiSelectForRemaining(false);
            } else {
                const msg = s.remainingNeed > 0 ? '✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit : '✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，金额 ¥' + (actualUse * getUnitPrice(item)).toFixed(2);
                showToast(msg, 'success');
                _multiSelectState = null; closeModal(); renderAllPreserveScroll();
                if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
            }
            return;
        }
        let usedText = (s.excludeIds.length > 0) ? `<br><span style="color:var(--text-muted);font-size:0.9rem;">已选商品扣减后，还需 <strong>${need} ${escapeHtml(s.unit)}</strong></span>` : '';
        let html = `<button class="close-btn" onclick="closeMultiSelectRemaining()">✕</button><h2>选择商品</h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">需要 <strong>${need} ${escapeHtml(s.unit)}</strong> 的 <strong>${escapeHtml(s.category)}</strong>，请选择使用哪个商品：${usedText}</div><div style="max-height:400px;overflow-y:auto;">`;
        available.forEach(item => {
            const rem = getItemRemaining(item);
            const remInTarget = convertToUnit(rem, item.unit, s.unit, item.name);
            const canUse = remInTarget >= need;
            html += `<div class="item-select-card" style="background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:6px 0;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" onclick="selectItemForRemaining('${item.id}')"><div class="item-info"><span class="item-name">${escapeHtml(item.name)} ${item.brand ? '· '+escapeHtml(item.brand) : ''}</span><span class="item-detail">${escapeHtml(item.specification || '')} ${item.price ? '· ¥'+item.price : ''} ${item.openingDate ? '· 开封 '+escapeHtml(item.openingDate) : ''}</span></div><div class="item-stock">剩余 ${rem} ${item.unit} (约 ${remInTarget.toFixed(1)} ${s.unit})</div>${canUse ? '<span class="item-badge" style="background:var(--success);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">可用</span>' : '<span class="item-badge" style="background:#b87820;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">部分</span>'}</div>`;
        });
        html += `</div><div class="modal-actions"><button class="btn btn-ghost" onclick="finishMultiSelectRemaining()">完成选择</button></div>`;
        if (isFirst) {
            openModal(html, false, 'multiSelectRemaining');
        } else {
            replaceModalContent(html, 0);
        }
    }

    window.selectItemForRemaining = function(itemId) {
        if (!_multiSelectState) return;
        const s = _multiSelectState;
        const item = findMaterialById(itemId);
        if (!item) { showToast('商品不存在', 'error'); return; }
        const remaining = getItemRemaining(item);
        if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
        const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
        if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
        const actualUse = Math.min(s.remainingNeed, remainingInTarget);
        const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
        const recipe = recipes.find(r => r.id === s.recipeId);
        const recipeName = recipe ? recipe.name : '直接使用';
        addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId, s.batchId);
        s.remainingNeed -= actualUse;
        s.excludeIds.push(item.id);
        if (s.remainingNeed <= 0) {
            showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，需求已满足', 'success');
            _multiSelectState = null;
            // 关闭选择界面并刷新详情
            closeModal();
            if (_detailRecipeId) {
                setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 50);
            }
            renderAllPreserveScroll();
        } else {
            showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
            showMultiSelectForRemaining(false);
        }
    };
    window.closeMultiSelectRemaining = function() {
        if (_multiSelectState && _multiSelectState.remainingNeed > 0) showToast('⚠️ 已取消选择，还差 ' + _multiSelectState.remainingNeed + _multiSelectState.unit + '未使用', 'error');
        _multiSelectState = null;
        closeModal(); // 关闭选择界面，恢复商品详情
        renderAllPreserveScroll();
        // 不需要再次调用 viewRecipeDetail，因为 closeModal 会恢复栈中的详情页
    };
    window.finishMultiSelectRemaining = function() {
        if (_multiSelectState && _multiSelectState.remainingNeed > 0) showToast('⚠️ 完成选择，还差 ' + _multiSelectState.remainingNeed + _multiSelectState.unit + '未使用', 'error');
        _multiSelectState = null;
        closeModal(); // 关闭选择界面，恢复商品详情
        renderAllPreserveScroll();
        if (_detailRecipeId) {
            setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 50);
        }
    };

    // 全部使用（多商品选择）
    let _allUseQueue = [], _allUseResults = [], _allUseSkipped = [], _allUseRecipeId = null, _allUseRecipeName = '';
    let _allUseModalOpen = false;
    let _allUseLogsStartIndex = 0;
    let _allUseBatchId = '';
    function saveAndRestoreDetailScroll() {
        const modal = document.querySelector('#modalOverlay .modal');
        if (modal) _detailModalScrollTop = modal.scrollTop;
    }
    window.useAllMaterialsByCategory = function(recipeId) {
        if (!requireOwner()) return;
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        saveAndRestoreDetailScroll();
        const servings = _detailServings || 1;
        _allUseQueue = []; _allUseResults = []; _allUseSkipped = []; _allUseRecipeId = recipeId; _allUseRecipeName = recipe.name;
        _allUseModalOpen = false;
        _allUseLogsStartIndex = usageLogs.length;
        _allUseBatchId = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        for (const ing of recipe.ingredients) {
            const items = materials.filter(m => m.category === ing.category);
            const available = items.filter(item => getItemRemaining(item) > 0);
            if (available.length === 0) { _allUseSkipped.push(ing.category); continue; }
            let totalAvail = 0;
            for (const item of available) totalAvail += convertToUnit(getItemRemaining(item), item.unit, ing.unit, item.name);
            if (totalAvail <= 0) { _allUseSkipped.push(ing.category); continue; }
            if (available.length === 1) {
                const item = available[0];
                const need = ing.quantity * servings;
                const rem = getItemRemaining(item);
                const remInTarget = convertToUnit(rem, item.unit, ing.unit, item.name);
                const actualUse = Math.min(need, remInTarget);
                const actualUseOriginal = convertToUnit(actualUse, ing.unit, item.unit, item.name);
                const unitPrice = getUnitPrice(item);
            addUsageLog(item.id, actualUseOriginal, item.unit, recipe.name, recipeId, _allUseBatchId);
            _allUseResults.push({ materialId: item.id, usedOriginal: actualUseOriginal, name: item.name, used: actualUse, need, unit: ing.unit, amt: actualUse * unitPrice });
            } else {
                const need = ing.quantity * servings;
                _allUseQueue.push({ category: ing.category, available, need, unit: ing.unit });
            }
        }
        if (_allUseQueue.length === 0) { finishAllUse(); return; }
        showNextMultiSelect(true);
    };
    function showNextMultiSelect(isFirst) {
        if (_allUseQueue.length === 0) { finishAllUse(); return; }
        const task = _allUseQueue[0];
        const available = task.available.filter(it => getItemRemaining(it) > 0 && !(task.excludeIds || []).includes(it.id));
        if (available.length === 0) { if (task.need > 0) _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); showNextMultiSelect(false); return; }
        task.available = available;
        const remaining = _allUseQueue.length;
        const usedCount = _allUseResults.filter(r => r !== null).length;
        let headerMsg = `需要 <strong>${task.need} ${escapeHtml(task.unit)}</strong> 的 <strong>${escapeHtml(task.category)}</strong>，请选择使用哪个商品`;
        if (task.excludeIds && task.excludeIds.length > 0) headerMsg += `<br><span style="font-size:0.9rem;color:var(--text-muted);">已选商品扣减后，还需 <strong>${task.need} ${escapeHtml(task.unit)}</strong></span>`;
        if (remaining > 1) headerMsg += `<br><span style="font-size:0.9rem;color:var(--text-muted);">（选完本分类后还有 ${remaining - 1} 种材料需要选择）</span>`;
        let html = `<button class="close-btn" onclick="skipMultiSelect()">✕</button><h2>选择商品（${usedCount + 1}/${usedCount + _allUseQueue.length}）</h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">${headerMsg}</div><div style="max-height:400px;overflow-y:auto;">`;
        available.forEach(item => {
            const rem = getItemRemaining(item);
            const remInTarget = convertToUnit(rem, item.unit, task.unit, item.name);
            const canUse = remInTarget >= task.need;

    window.confirmMultiSelectItem = function(itemId) {
        const task = _allUseQueue[0];
        const item = findMaterialById(itemId);
        if (!item) { showToast('商品不存在', 'error'); return; }
        const remaining = getItemRemaining(item);
        if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
        const remInTarget = convertToUnit(remaining, item.unit, task.unit, item.name);
        if (remInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
        const actualUse = Math.min(task.need, remInTarget);
        const actualUseOriginal = convertToUnit(actualUse, task.unit, item.unit, item.name);
        const unitPrice = getUnitPrice(item);
        addUsageLog(item.id, actualUseOriginal, item.unit, _allUseRecipeName, _allUseRecipeId, _allUseBatchId);
        _allUseResults.push({ materialId: item.id, usedOriginal: actualUseOriginal, name: item.name, used: actualUse, need: task.need, unit: task.unit, amt: actualUse * unitPrice });
        task.need -= actualUse;
        if (!task.excludeIds) task.excludeIds = [];
        task.excludeIds.push(item.id);
        if (task.need > 0) {
            const stillAvailable = task.available.filter(it => getItemRemaining(it) > 0 && !task.excludeIds.includes(it.id));
            if (stillAvailable.length === 0) { _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); }
            else { task.available = stillAvailable; showToast('✅ 使用了 ' + actualUse + task.unit + '「' + item.name + '」，还差 ' + task.need + task.unit, 'success'); showNextMultiSelect(false); return; }

    function initMgrDragSort(recipeId) {
        const grid = document.getElementById('mgrGrid');
        if (!grid) return;
        let dragIdx = null;
        grid.querySelectorAll('.mgr-img-card').forEach(card => {
            card.addEventListener('dragstart', function(e) { dragIdx = parseInt(this.dataset.idx); this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
            card.addEventListener('dragend', function() { this.classList.remove('dragging'); grid.querySelectorAll('.mgr-img-card').forEach(c => c.classList.remove('drag-over')); });
            card.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (dragIdx !== null && parseInt(this.dataset.idx) !== dragIdx) this.classList.add('drag-over'); });
            card.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
            card.addEventListener('drop', function(e) {
                e.preventDefault(); this.classList.remove('drag-over');
                const dropIdx = parseInt(this.dataset.idx);
                if (dragIdx === null || dragIdx === dropIdx) return;
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe || !recipe.finalImages) return;
                const ids = recipe.finalImages;
                const [moved] = ids.splice(dragIdx, 1);

                saveRecipes();
                renderMgrGrid(recipeId);
                dragIdx = null;

    async function addMgrFinalImagesFromFiles(recipeId, fileList) {
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        const files = Array.from(fileList || []);
        if (files.length === 0) return;
        if (!recipe.finalImages) recipe.finalImages = [];

        const progressEl = document.getElementById('uploadProgress'), progressText = document.getElementById('uploadProgressText');

        let processed = 0, failed = 0;
        for (const file of files) {
            if (progressText) progressText.textContent = `正在处理 ${processed + failed + 1}/${files.length} · ${formatFileSize(file.size)}`;
            try {
                const dataUrl = await compressImage(file);
                const id = await saveImage(dataUrl);
                recipe.finalImages.push(id);
                processed++;
            } catch (err) { console.error(err); failed++; }
        }
        if (progressEl) progressEl.classList.remove('show');
        saveRecipes();
        if (processed > 0) showToast('✅ 已添加 ' + processed + ' 张成品图' + (failed > 0 ? '，' + failed + ' 张失败' : ''), 'success');

    // 图片预览
    let _galleryEl = null;
    let _slideWidth = 0;
    const _galleryGap = 20;
    let _galleryOffset = 0;
    let _galleryStartOffset = 0;

    function setGalleryPosition(index, animate) {
        if (!_galleryEl) return;
        _slideWidth = _galleryEl.clientWidth || window.innerWidth;

    }
    function setPreviewIndex(index) {

        if (counter) counter.textContent = `${_previewIndex+1}/${_previewImages.length}`;
        const prevBtn = document.querySelector('.fullscreen-preview-nav .nav-btn:first-child');
        const nextBtn = document.querySelector('.fullscreen-preview-nav .nav-btn:last-child');

    function renderPreviewModal() {
        if (!_previewImages || _previewImages.length === 0) return;
        const total = _previewImages.length;
        const counter = total > 1 ? `${_previewIndex+1}/${total}` : '';
        _rotateDeg = 0;

            <div class="preview-gallery" id="previewGallery">${slidesHTML}</div>
            <div class="fullscreen-preview-nav">
                <button class="nav-btn" onclick="navPreview(-1)" ${_previewIndex===0?'disabled':''}>‹</button>
                <button class="nav-btn" onclick="navPreview(1)" ${_previewIndex===_previewImages.length-1?'disabled':''}>›</button>
            </div>

        if (_galleryEl) {
            requestAnimationFrame(() => setGalleryPosition(_previewIndex, false));

    let previewTouches = []; let initialDistance = 0; let initialScale = 1; let initialPanX = 0, initialPanY = 0;
    let _dragStartX = 0, _dragStartY = 0, _dragState = null;
    function handlePreviewTouchStart(e) {
        if (e.touches.length === 2) {
            previewTouches = Array.from(e.touches);
            initialDistance = Math.hypot(previewTouches[1].pageX - previewTouches[0].pageX, previewTouches[1].pageY - previewTouches[0].pageY);
            initialScale = _scale; initialPanX = _panX; initialPanY = _panY;
            _dragState = null;
            e.preventDefault();
        } else if (e.touches.length === 1 && _scale > 1) {
            previewTouches = [e.touches[0]];
            initialPanX = _panX - e.touches[0].pageX; initialPanY = _panY - e.touches[0].pageY;
            _dragState = null;
        } else if (e.touches.length === 1) {
            _dragStartX = e.touches[0].clientX;
            _dragStartY = e.touches[0].clientY;
            _dragState = 'pending';
            previewTouches = [e.touches[0]];
            _galleryStartOffset = _galleryOffset;
            if (_galleryEl) _galleryEl.style.transition = 'none';
        }
    }
    function handlePreviewTouchMove(e) {
        if (!_galleryEl) return;
        if (e.touches.length === 2 && previewTouches.length === 2) {
            const dist = Math.hypot(e.touches[1].pageX - e.touches[0].pageX, e.touches[1].pageY - e.touches[0].pageY);
            let newScale = initialScale * (dist / initialDistance);
            newScale = Math.min(5, Math.max(1, newScale));
            _scale = newScale;
            if (_imgEl) _imgEl.style.transform = `rotate(${_rotateDeg}deg) scale(${_scale}) translate(${_panX}px, ${_panY}px)`;
            e.preventDefault();
        } else if (e.touches.length === 1 && _scale > 1) {
            const touch = e.touches[0];
            const prevTouch = previewTouches[0];
            if (prevTouch) {
                const dx = (touch.pageX - prevTouch.pageX) * 0.3;
                const dy = (touch.pageY - prevTouch.pageY) * 0.3;
                _panX += dx; _panY += dy;
                previewTouches = [touch];
                if (_imgEl) _imgEl.style.transform = `rotate(${_rotateDeg}deg) scale(${_scale}) translate(${_panX}px, ${_panY}px)`;
            }
            e.preventDefault();
        } else if (e.touches.length === 1 && _dragState) {
            const touch = e.touches[0];
            const dx = touch.clientX - _dragStartX;
            const dy = touch.clientY - _dragStartY;
            if (_dragState === 'pending' && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                _dragState = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
            }
            if (_dragState === 'horizontal') {
                _galleryOffset = _galleryStartOffset + dx;
                _galleryEl.style.transform = `translateX(${_galleryOffset}px)`;
            } else if (_dragState === 'vertical') {
                _galleryEl.style.transform = `translateX(${_galleryStartOffset}px) translateY(${dy}px)`;
            }
            e.preventDefault();
        }
    }
    function handlePreviewTouchEnd(e) {
        previewTouches = [];
        if (_dragState === 'horizontal') {
            const touch = e.changedTouches[0];
            const dx = touch.clientX - _dragStartX;
            let targetIndex = _previewIndex;
            if (Math.abs(dx) > _slideWidth * 0.2) {
                targetIndex = dx < 0 ? _previewIndex + 1 : _previewIndex - 1;
            }
            targetIndex = Math.max(0, Math.min(_previewImages.length - 1, targetIndex));
            if (targetIndex !== _previewIndex) {
                setPreviewIndex(targetIndex);
            } else {
                setGalleryPosition(_previewIndex, true);
            }
            _dragState = null;
        } else if (_dragState === 'vertical') {
            const touch = e.changedTouches[0];
            const dy = touch.clientY - _dragStartY;
            if (Math.abs(dy) > 120) {
                _dragState = null;
                closeModal();
                return;
            }
            setGalleryPosition(_previewIndex, true);
            _dragState = null;
        } else {
            _dragState = null;
            if (_scale <= 1) { _panX = 0; _panY = 0; if (_imgEl) _imgEl.style.transform = `rotate(${_rotateDeg}deg) scale(1)`; }
        }
    }

    function renderLogs() {
        const container = document.getElementById('logsList');
        if (!container) return;
        let filtered = [...usageLogs];
        if (logFilters.material) {
            const searchTerm = logFilters.material;
            filtered = filtered.filter(u => {
                if (u.materialName.toLowerCase().includes(searchTerm)) return true;
                const mat = findMaterialById(u.materialId);
                if (mat && mat.category && mat.category.toLowerCase().includes(searchTerm)) return true;
                return false;
            });
        }
        if (logFilters.recipe) filtered = filtered.filter(u => u.recipeName.toLowerCase().includes(logFilters.recipe));
        if (logFilters.dateFrom) { const from = new Date(logFilters.dateFrom); from.setHours(0,0,0,0); filtered = filtered.filter(u => new Date(u.timestamp) >= from); }
        if (logFilters.dateTo) { const to = new Date(logFilters.dateTo); to.setHours(23,59,59,999); filtered = filtered.filter(u => new Date(u.timestamp) <= to); }
        filtered.sort((a, b) => b.timestamp - a.timestamp);
        let totalAmount = 0;
        const recipeMap = {};
        filtered.forEach(u => { const amt = u.amountUsed || 0; totalAmount += amt; const key = u.recipeName || '直接使用'; recipeMap[key] = (recipeMap[key] || 0) + amt; });
        document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);
        const recipeSummaryEl = document.getElementById('recipeSummary');
        const recipeKeys = Object.keys(recipeMap);
        if (recipeKeys.length === 0) recipeSummaryEl.innerHTML = '<span style="color:var(--text-muted);">暂无数据</span>';
        else recipeSummaryEl.innerHTML = recipeKeys.map(k => `<span class="rs-item">${escapeHtml(k)}: ¥${recipeMap[k].toFixed(2)}</span>`).join('');
        if (filtered.length === 0) container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暂无匹配记录</p></div>';
        else {
            // 按配方名分组，再按 6 小时时间窗口拆批：同一配方 6 小时内归为同一批次
            const recipeGroups = new Map();
            filtered.forEach(log => {
                const rn = log.recipeName || '直接使用';
                if (!recipeGroups.has(rn)) recipeGroups.set(rn, []);
                recipeGroups.get(rn).push(log);
            });
            const SIX_HOURS = 6 * 3600 * 1000;
            const batches = [];
            for (const [rn, logs] of recipeGroups) {
                logs.sort((a, b) => b.timestamp - a.timestamp);
                let currentBatch = null;
                for (const log of logs) {
                    if (!currentBatch || (currentBatch.timestamp - log.timestamp) > SIX_HOURS) {
                        currentBatch = { recipeName: rn, timestamp: log.timestamp, logs: [], totalAmount: 0 };
                        batches.push(currentBatch);
                    }
                    currentBatch.logs.push(log);
                    currentBatch.totalAmount += (log.amountUsed || 0);
                }
            }
            const groups = batches;
            groups.sort((a, b) => b.timestamp - a.timestamp);
            container.innerHTML = groups.map(g => {
                const itemsHTML = g.logs.map(log => {
                    return `<div class="log-item"><div class="log-left"><span class="log-name">${escapeHtml(log.materialName)}</span><span class="log-detail">${log.quantity} ${escapeHtml(log.unit)}</span><span class="log-amount">¥${(log.amountUsed||0).toFixed(2)}</span></div><span class="log-time">${new Date(log.timestamp).toLocaleTimeString('zh-CN')}</span><button class="btn btn-xs btn-use edit-only" onclick="restoreUsageLog('${log.id}')" style="margin-left:6px;" title="把本次用量还原回库存">还原</button></div>`;
                }).join('');
                const dateStr = new Date(g.timestamp).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                return `<div class="log-group"><div class="log-group-title"><span class="log-group-emoji">🍰</span><span>${escapeHtml(g.recipeName)}</span><span class="log-group-meta">${dateStr} · ${g.logs.length}项 · ¥${g.totalAmount.toFixed(2)}</span></div><div class="log-group-body">${itemsHTML}</div></div>`;
            }).join('');
        }
    }

    window.restoreUsageLog = function(logId) {

    // ============================================================
    // 云端同步（GitHub 作为数据库，保存后才联网）
    // ============================================================
    // 设计要点：
    // 1) 编辑过程（输入、上传图片）只写本地，绝不联网；
    // 2) 仅在「保存」动作后，通过防抖调度 scheduleCloudPush() 联网推送；
    // 3) 分离式存储：图片独立存 images/ 目录（raw 直链访问），data.json 只存文字 +
    //    图片文件名引用；改文字只上传几 KB 的 data.json，新增图片才上传对应那一张，
    //    彻底避免"图片多导致 data.json 过大 / 每次全量重传"的问题；
    // 4) 访客无需令牌即可「拉取」公开仓库数据；只有持有令牌的拥有者才能「推送」，
    //    从而实现"大家可看、只有你可改"。
    function getCloudConfig() {
        let cfg = null;
        try { cfg = JSON.parse(localStorage.getItem(STORAGE_CLOUD)) || null; } catch (e) { cfg = null; }
        // 合并公开默认仓库地址 + 本机 token/覆盖配置：访客无任何配置也能拿到仓库地址拉取数据
        const base = { repo: DEFAULT_CLOUD_REPO, branch: DEFAULT_CLOUD_BRANCH || 'main', path: DEFAULT_CLOUD_PATH || 'data.json', token: '' };
        if (!cfg) return base;
        return {
            repo: cfg.repo || base.repo,
            branch: cfg.branch || base.branch,
            path: cfg.path || base.path,
            token: cfg.token || ''
        };
    }
    function saveCloudConfig(cfg) { try { localStorage.setItem(STORAGE_CLOUD, JSON.stringify(cfg)); } catch (e) {} }
    function getLastSyncTime() { try { return Number(localStorage.getItem(STORAGE_LAST_SYNC) || 0); } catch (e) { return 0; } }

    // —— 登录态：拥有者 = 本机持有 token ——
    function isOwner() { const cfg = getCloudConfig(); return !!(cfg && cfg.token); }
    // 写操作守卫：未登录时提示并弹出登录框
    function requireOwner() {
        if (isOwner()) return true;
        showToast('🔒 请先登录后才能编辑', 'error');
        if (typeof window.sheepLogin === 'function') window.sheepLogin();
        return false;
    }
    // 退出登录：只清除 token，保留仓库地址等配置
    function logout() {
        const cfg = getCloudConfig();
        saveCloudConfig({ repo: cfg.repo, branch: cfg.branch, path: cfg.path, token: '' });
        applyLoginState();
        showToast('已退出登录，当前为只读模式', 'success');
    }
    // 根据登录态刷新界面（切换 body class，CSS 据此隐藏/显示编辑入口）
    function applyLoginState() {
        const logged = isOwner();
        document.body.classList.toggle('not-logged-in', !logged);
        document.body.classList.toggle('is-logged-in', logged);
        const btn = document.getElementById('sheepLoginBtn');
        if (btn) btn.textContent = logged ? '退出登录' : '小绵羊登录';
    }

    function parseRepo(repoStr) {
        const m = String(repoStr || '').trim().match(/^([^\/\s]+)\/([^\/\s]+)$/);
        return m ? { owner: m[1], repo: m[2] } : null;
    }
    function cloudApiUrl(cfg) {
        const pr = parseRepo(cfg.repo);
        const path = (cfg.path || 'data.json').split('/').map(encodeURIComponent).join('/');
        return 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/' + path;
    }
    // fetch 包装：加超时控制（默认 30s），并把浏览器层"Failed to fetch"
    // 转成可识别的错误信息（断网/代理/拦截器多表现为这个）
    function fetchWithTimeout(url, options, timeoutMs) {
        const ms = timeoutMs || 30000;
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, ms);
        const opts = Object.assign({}, options || {});
        opts.signal = controller.signal;
        // 把 URL 主机部分摘出来，错误信息里带上更易读（去 query/auth）
        let hostHint = '';
        try {
            const u = new URL(url);
            hostHint = u.host;
            if (u.pathname.length > 60) hostHint += u.pathname.slice(0, 60) + '…';
            else hostHint += u.pathname;
        } catch (_) { /* 非完整 URL 时忽略 */ }
        return fetch(url, opts).then(function(resp) {
            clearTimeout(timer);
            return resp;
        }).catch(function(err) {
            clearTimeout(timer);
            if (err && err.name === 'AbortError') {
                throw new Error('请求超时（>30s）' + (hostHint ? ' @ ' + hostHint : '') + '：可能网络不通或被代理拦截');
            }
            throw new Error('网络异常 @ ' + (hostHint || 'fetch') + '：' + (err && err.message ? err.message : 'Failed to fetch'));
        });
    }
    function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
    }

    async function fetchCloudFile(cfg, bust) {
        const pr = parseRepo(cfg.repo);
        if (!pr) throw new Error('仓库格式应为 owner/repo');
        const path = (cfg.path || 'data.json').split('/').map(encodeURIComponent).join('/');
        let url = 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/' + path + '?ref=' + encodeURIComponent(cfg.branch || 'main');
        // 强制绕过缓存：GitHub API 对 GET 有约 60s 缓存，若拿到旧 sha 会导致 PUT 409。
        // 用随机 query 参数 _bust 确保读到的 sha 是当前最新值。
        // 注意：不要手写 Cache-Control / Pragma 头，也不要设 cache:'no-store' ——
        // 这两个头不在 CORS 安全名单里，会让浏览器发起 OPTIONS 预检，而 GitHub
        // 的预检响应不批准它们，导致浏览器直接抛 "Failed to fetch"（curl 能通、浏览器不通）。
        if (bust) url += '&_bust=' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const headers = {
            'Accept': 'application/vnd.github+json'
        };
        if (cfg.token) headers['Authorization'] = 'Bearer ' + cfg.token;
        const resp = await fetchWithTimeout(url, { headers });
        if (resp.status === 404) return null;
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const meta = await resp.json();
        let data = null;
        try {
            const bin = atob(String(meta.content || '').replace(/\n/g, ''));
            const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
            data = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        } catch (e) { data = null; }
        return { sha: meta.sha, data: data };
    }

    // 收集所有被配方实际引用的图片 id（finalImages + steps[].images）
    function collectReferencedImageIds() {
        const ids = new Set();
        for (const r of recipes) {
            if (Array.isArray(r.finalImages)) for (const id of r.finalImages) if (id) ids.add(String(id));
            if (Array.isArray(r.steps)) for (const s of r.steps) {
                if (s && Array.isArray(s.images)) for (const id of s.images) if (id) ids.add(String(id));
            }
        }
        return ids;
    }

    async function buildCloudPayload() {
        // 分离式：data.json 只存「被配方引用」的图片文件名引用，图片实体独立存 images/ 目录；
        // 这样"改文字"只上传几 KB 的 data.json，孤儿图片也不会反复写回 images 清单。
        const imageRefs = {};
        try {
            for (const id of collectReferencedImageIds()) imageRefs[id] = imageFilePath(id);
        } catch (e) {}
        return {
            version: 5,
            updatedAt: Date.now(),
            materials, recipes, usageLogs,
            categories: CATEGORIES,
            recycleBin,
            images: imageRefs
        };
    }

    // 把图片 id 转成仓库里的相对文件路径
    function imageFilePath(id) { return 'images/' + String(id) + '.jpg'; }
    // raw 直链（公开仓库免令牌，不吃 API 速率限制）
    function rawImageUrl(cfg, id) {
        const pr = parseRepo(cfg.repo);
        return 'https://raw.githubusercontent.com/' + pr.owner + '/' + pr.repo + '/' + encodeURIComponent(cfg.branch || 'main') + '/' + imageFilePath(id);
    }
    function apiImageUrl(cfg, id) {
        const pr = parseRepo(cfg.repo);
        return 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/' + imageFilePath(id) + '?ref=' + encodeURIComponent(cfg.branch || 'main');
    }
    // dataUrl -> 纯 base64（去掉 data:image/...;base64, 前缀）
    function dataUrlToBase64(dataUrl) {
        const m = String(dataUrl || '').match(/^data:[^;]*;base64,(.*)$/s);
        if (m) return m[2];
        return String(dataUrl).replace(/\s+/g, '');
    }
    // 二进制 -> 强制 image/jpeg 的 dataUrl（raw 直链返回 text/plain，需纠正 MIME）
    function bytesToJpegDataUrl(bytes) {
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return 'data:image/jpeg;base64,' + btoa(binary);
    }
    // 列出云端 images/ 目录已存在的文件名 -> sha 映射（用于增量上传，跳过已存在的图）
    async function listRemoteImages(cfg) {
        const pr = parseRepo(cfg.repo);
        const url = 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/images?ref=' + encodeURIComponent(cfg.branch || 'main') + '&_bust=' + Date.now();
        const headers = { 'Accept': 'application/vnd.github+json' };
        if (cfg.token) headers['Authorization'] = 'Bearer ' + cfg.token;
        const resp = await fetchWithTimeout(url, { headers });
        if (resp.status === 404) return {}; // 目录尚未创建
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const arr = await resp.json();
        const map = {};
        // 只收「文件」类型，跳过子目录项；避免目录被误当成图片文件处理
        if (Array.isArray(arr)) for (const it of arr) if (it && it.name && it.type === 'file') map[it.name] = it.sha || '';
        return map;
    }
    // 上传单张图片到 images/ 目录（只在上传/替换时调用，编辑中不联网）
    async function uploadImageFile(cfg, id, dataUrl) {
        const pr = parseRepo(cfg.repo);
        const content = dataUrlToBase64(dataUrl);
        if (!content) throw new Error('图片内容为空，跳过（id=' + id + '）');
        const url = 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/' + imageFilePath(id);
        const body = {
            message: 'Upload image ' + id,
            content: content,
            branch: cfg.branch || 'main'
        };
        const resp = await fetchWithTimeout(url, {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + cfg.token,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify(body)
        });
        if (!resp.ok) {
            let detail = '';
            try { detail = (await resp.json()).message || ''; } catch (e) {}
            throw new Error('HTTP ' + resp.status + (detail ? ' ' + detail : ''));
        }
    }
    // 确保某张图片在本地存在：缺失则从云端下载（旧 base64 格式自动兼容）
    async function ensureImageLocal(cfg, id, ref) {
        if (!id) return false;
        if (await getImage(id)) return true; // 本地已有
        // 旧格式兼容：ref 本身是 base64 dataUrl
        if (ref && String(ref).startsWith('data:image')) {
            await saveImageWithId(id, ref);
            return true;
        }
        // 新格式：从 raw 直链下载（公开仓库免令牌）
        try {
            const resp = await fetchWithTimeout(rawImageUrl(cfg, id));
            if (resp.ok) {
                const buf = new Uint8Array(await resp.arrayBuffer());
                await saveImageWithId(id, bytesToJpegDataUrl(buf));
                return true;
            }
        } catch (e) {}
        // raw 失败且持有令牌时，回退走 api（兼容私有仓库）
        if (cfg.token) {
            try {
                const resp = await fetchWithTimeout(apiImageUrl(cfg, id), { headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' } });
                if (resp.ok) {
                    const meta = await resp.json();
                    await saveImageWithId(id, 'data:image/jpeg;base64,' + String(meta.content || '').replace(/\n/g, ''));
                    return true;
                }
            } catch (e) {}
        }
        return false;
    }

    var _cloudPushTimer = null;
    var _applyingCloud = false;
    var _pushing = false; // 单页推送互斥锁：防止两次推送并发导致 sha 冲突
    // 防抖调度：保存后 2 秒内只联网一次，编辑中不触发
    function scheduleCloudPush() {
        if (_applyingCloud) return;
        const cfg = getCloudConfig();
        if (!cfg || !cfg.repo || !cfg.token) return; // 只有拥有者（有令牌）才推送
        if (_cloudPushTimer) clearTimeout(_cloudPushTimer);
        _cloudPushTimer = setTimeout(function() { pushToCloud(true); }, 2000);
    }

    async function pushToCloud(showMsg) {
        const cfg = getCloudConfig();
        if (!cfg || !cfg.repo) { if (showMsg) showToast('⚠️ 请先在「云同步」中填写仓库地址', 'error'); return false; }
        if (!cfg.token) { if (showMsg) showToast('⚠️ 上传需要访问令牌（仅拥有者可写）', 'error'); return false; }
        if (_pushing) { if (showMsg) showToast('⏳ 正在同步中，请稍候…', ''); return false; }
        if (hasRemotePusher()) { if (showMsg) showToast('⏳ 其他标签页正在同步，请稍候…', ''); return false; }
        _pushing = true;
        announcePusher(true);
        try {
            // 1) 增量上传图片：只上传「被配方引用」且「云端还没有」的图片。
            //    先图后 data.json，保证任何时刻 data.json 里的引用都指向已存在的图。
            let uploadedCount = 0, imageFailed = 0, skippedEmpty = 0;
            try {
                // 云端已有图片清单（用于跳过已存在、避免重复上传）。
                // 读清单失败（网络抖动 / 目录未建）时降级为「全部尝试上传」，绝不整体放弃上传。
                let remote = {};
                try {
                    remote = await listRemoteImages(cfg);
                } catch (e) {
                    console.warn('读取云端图片清单失败，将尝试上传所有被引用图片', e);
                }
                // 只遍历「被配方引用」的图片 id，而非本地全部图片：
                // 1) 不误传未被引用的孤儿图；2) 精准增量，只补云端缺失的那几张。
                const refIds = collectReferencedImageIds();
                for (const id of refIds) {
                    const fname = id + '.jpg';
                    if (remote[fname]) continue; // 云端已有，跳过（未变化的部分不动）
                    const data = await getImage(id);
                    if (!data) continue; // 本地已无此图（可能已删），跳过
                    if (!dataUrlToBase64(data)) { skippedEmpty++; continue; } // 空图跳过，避免 422
                    // 单张图最多重试 2 次，临时网络抖动可自愈
                    let ok = false, lastErr = null;
                    for (let t = 0; t < 3; t++) {
                        try { await uploadImageFile(cfg, id, data); ok = true; break; }
                        catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 500 * (t + 1))); }
                    }
                    if (ok) uploadedCount++; else { imageFailed++; console.warn('图片 ' + fname + ' 上传失败：', lastErr); }
                }
                if (skippedEmpty > 0) console.warn('跳过 ' + skippedEmpty + ' 张空图（无图片内容）');
                if (imageFailed > 0 && showMsg) showToast('⚠️ ' + imageFailed + ' 张图片上传失败，但数据仍会同步（下次推送会重试）', 'error');
            } catch (e) {
                console.warn('图片上传阶段出错', e);
                if (showMsg) showToast('⚠️ 图片上传阶段失败，但数据仍会同步：' + e.message, 'error');
            }
            // 2) 更新 data.json（只含文字 + 图片文件名引用，体积极小，改文字不重传图）
            const payload = await buildCloudPayload();
            // 带重试写入：遇 409（sha 不匹配）说明云端在本次读取后被更新过，
            // 重新拉取最新 sha 再写；网络错误（Failed to fetch / 超时）也自动重试，
            // 最多 5 次，从根本上规避「does not match」与临时网络抖动。
            let dataOk = false, lastErr = null;
            // 8 次重试 + 指数退避（最长 ~10s）；首轮重试用 600ms 起步。
            // 多设备/多标签页同时推送可能让 sha 持续变动，给足时间让对方先落盘。
            for (let attempt = 0; attempt < 8 && !dataOk; attempt++) {
                try {
                    const existing = await fetchCloudFile(cfg, true);
                    const sha = existing ? existing.sha : undefined;
                    const body = {
                        message: 'Update baking data ' + new Date().toLocaleString('zh-CN'),
                        content: utf8ToBase64(JSON.stringify(payload)),
                        branch: cfg.branch || 'main'
                    };
                    if (sha) body.sha = sha;
                    const resp = await fetchWithTimeout(cloudApiUrl(cfg), {
                        method: 'PUT',
                        headers: {
                            'Authorization': 'Bearer ' + cfg.token,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github+json'
                        },
                        body: JSON.stringify(body)
                    });
                    if (resp.ok) { dataOk = true; break; }
                    if (resp.status === 409 && attempt < 7) {
                        // sha 冲突：指数退避 600/1200/2400/4800/6400/6400/6400 ms，
                        // 等其他设备/标签页先落盘后再读最新 sha 重试
                        await new Promise(r => setTimeout(r, Math.min(6400, 600 * Math.pow(2, attempt))));
                        continue;
                    }
                    let detail = '';
                    try { detail = (await resp.json()).message || ''; } catch (e) {}
                    throw new Error('HTTP ' + resp.status + (detail ? ' ' + detail : ''));
                } catch (e) {
                    lastErr = e;
                    // 网络/超时/5xx：退避重试
                    const retriable = !e.message || !e.message.startsWith('HTTP 4');
                    if (retriable && attempt < 4) {
                        await new Promise(r => setTimeout(r, 600 * (attempt + 1)));
                        continue;
                    }
                    throw e;
                }
            }
            if (!dataOk && lastErr) throw lastErr;
            localStorage.setItem(STORAGE_LAST_SYNC, String(payload.updatedAt));
            if (showMsg) showToast(uploadedCount > 0 ? ('☁️ 已同步（新增 ' + uploadedCount + ' 张图）') : '☁️ 已同步到云端', 'success');
            return true;
        } catch (e) {
            console.warn('云端推送失败', e);
            let msg = e.message || '未知错误';
            if (msg.indexOf('409') !== -1 && msg.indexOf('does not match') !== -1) {
                msg = '并发冲突（多设备/多标签页同时推送）。建议：关闭其他工作台标签页，稍候再试。';
            } else if (msg.indexOf('401') !== -1) {
                msg = '令牌无效或已过期，请重新生成 GitHub Token。';
            } else if (msg.indexOf('403') !== -1) {
                msg = '权限不足或 API 速率受限（同一 IP 1 小时最多 5000 次）。';
            }
            if (showMsg) showToast('⚠️ 云端同步失败：' + msg, 'error');
            return false;
        } finally {
            _pushing = false;
            announcePusher(false);
        }
    }

    async function applyCloudData(cloud, cfg) {
        if (!cloud || typeof cloud !== 'object') return;
        const _cfg = cfg || getCloudConfig();
        _applyingCloud = true;
        try {
            if (Array.isArray(cloud.materials)) { materials = cloud.materials; saveMaterials(); }
            if (Array.isArray(cloud.recipes)) { recipes = cloud.recipes; saveRecipes(); }
            if (Array.isArray(cloud.usageLogs)) { usageLogs = cloud.usageLogs; saveUsageLogs(); }
            if (Array.isArray(cloud.categories) && cloud.categories.length > 0) { CATEGORIES = cloud.categories; saveCategories(); }
            if (Array.isArray(cloud.recycleBin)) { recycleBin = cloud.recycleBin; saveRecycleBin(); }
            // 分离式：图片缺失才逐张下载（旧 base64 格式由 ensureImageLocal 兼容）
            if (cloud.images && typeof cloud.images === 'object') {
                for (const id in cloud.images) {
                    try { await ensureImageLocal(_cfg, id, cloud.images[id]); } catch (e) {}
                }
            }
        } finally {
            _applyingCloud = false;
        }
        if (cloud.updatedAt) localStorage.setItem(STORAGE_LAST_SYNC, String(cloud.updatedAt));
        renderAll();
    }

    async function pullFromCloud(showMsg) {
        const cfg = getCloudConfig();
        if (!cfg || !cfg.repo) { if (showMsg) showToast('⚠️ 请先填写仓库地址', 'error'); return false; }
        try {
            const cloud = await fetchCloudFile(cfg);
            if (!cloud || !cloud.data) { if (showMsg) showToast('⚠️ 云端暂无数据（data.json 不存在或为空）', 'error'); return false; }
            await applyCloudData(cloud.data, cfg);
            if (showMsg) showToast('☁️ 已从云端拉取最新数据', 'success');
            return true;
        } catch (e) {
            console.warn('云端拉取失败', e);
            if (showMsg) showToast('⚠️ 拉取失败：' + e.message, 'error');
            return false;
        }
    }

    // 启动时自动拉取：本地为空，或云端更新时间晚于本机上次同步时间时，才应用云端数据
    async function syncOnStartup() {
        const cfg = getCloudConfig();
        if (!cfg || !cfg.repo) return;
        try {
            const cloud = await fetchCloudFile(cfg);
            if (!cloud || !cloud.data) return;
            const cloudTime = cloud.data.updatedAt || 0;
            const localTime = getLastSyncTime();
            const localHasData = materials.length > 0 || recipes.length > 0 || usageLogs.length > 0;
            if (!localHasData || cloudTime > localTime) {
                await applyCloudData(cloud.data, cfg);
                showToast('☁️ 已同步云端数据', 'success');
            }
        } catch (e) { console.warn('启动同步跳过（可能离线）', e); }
    }

    // 清理云端 images/ 目录中不再被任何配方引用的图片（孤儿图片）
    async function cleanupOrphanImages() {
        const cfg = getCloudConfig();
        if (!cfg || !cfg.repo) { showToast('⚠️ 请先在「云同步」中填写仓库地址', 'error'); return; }
        if (!cfg.token) { showToast('⚠️ 清理需要访问令牌（仅拥有者可操作）', 'error'); return; }
        let remoteFiles = {};
        try {
            remoteFiles = await listRemoteImages(cfg);
        } catch (e) {
            showToast('⚠️ 读取云端图片列表失败：' + e.message, 'error');
            return;
        }
        const refIds = collectReferencedImageIds();
        // 只清理本应用生成的 .jpg 图片文件；images/ 目录里的其他文件（txt、png、子目录等）一律跳过，避免误删
        const orphanNames = Object.keys(remoteFiles).filter(name => {
            const m = String(name).match(/^(.+)\.jpg$/i);
            if (!m) return false; // 非 .jpg 文件不纳入清理范围
            return !refIds.has(m[1]);
        });
        if (orphanNames.length === 0) {
            showToast('✅ 云端没有未引用的图片', 'success');
            return;
        }
        const preview = orphanNames.slice(0, 5).map(n => '· ' + n).join('<br>');
        const more = orphanNames.length > 5 ? '<br>… 等共 ' + orphanNames.length + ' 个文件' : '';
        showConfirm(
            '将删除云端 <b>' + orphanNames.length + '</b> 张未被引用的图片文件：<br>' + preview + more + '<br><br>此操作不可撤销，确认继续？',
            async function() {
                let done = 0, failed = 0;
                for (const name of orphanNames) {
                    try {
                        const sha = remoteFiles[name];
                        const pr = parseRepo(cfg.repo);
                        const url = 'https://api.github.com/repos/' + pr.owner + '/' + pr.repo + '/contents/images/' + encodeURIComponent(name);
                        const resp = await fetchWithTimeout(url, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: 'Delete orphan image ' + name, sha: sha, branch: cfg.branch || 'main' })
                        });
                        if (resp.ok) done++; else failed++;
                    } catch (e) { failed++; }
                }
                showToast(failed === 0 ? ('🧹 已清理 ' + done + ' 张未引用图片') : ('⚠️ 清理完成：成功 ' + done + '，失败 ' + failed), failed === 0 ? 'success' : 'error');
            },
            function() {}
        );
    }
