<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>🥐 烘焙工作台 · 配方 & 库存</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg: #f5f0eb; --surface: #fff; --surface-alt: #faf7f4;
            --primary: #c8753d; --primary-light: #e8a87c; --primary-dark: #8b4f2a;
            --accent: #f0a05a; --text: #2d1f14; --text-light: #6b4d3a; --text-muted: #9b8a7a;
            --border: #e8ddd0; --border-light: #f0e8e0; --success: #6b9e5a; --success-bg: #edf7e7;
            --danger: #c8553d; --danger-bg: #fdf0ed; --shadow-sm: 0 1px 3px rgba(60,30,10,0.06);
            --shadow: 0 3px 12px rgba(60,30,10,0.08); --shadow-lg: 0 8px 30px rgba(60,30,10,0.12);
            --radius-sm: 8px; --radius: 14px; --radius-lg: 20px; --radius-xl: 24px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-heading: 'Georgia','Noto Serif SC','STSong',serif;
            --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            --safe-top: env(safe-area-inset-top,0px); --safe-bottom: env(safe-area-inset-bottom,0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:var(--font-body); background:linear-gradient(160deg,#fdf6ee 0%,#fef9f3 30%,#fff7ef 60%,#fdf5ec 100%);
            background-attachment:fixed; color:var(--text); min-height:100vh; min-height:100dvh; line-height:1.6;
            -webkit-font-smoothing:antialiased; padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
            padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); position:relative; overflow-x:hidden;
        }
        body.modal-open { position:fixed; width:100%; top:0; left:0; }
        .img-drag-over { outline:2px dashed var(--primary); outline-offset:2px; }
        .app-container { max-width:1200px; margin:0 auto; padding:16px 16px 40px; position:relative; z-index:1; }
        .app-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; text-align:center; padding:12px 12px 6px; position:relative; gap:6px; }
        .app-header .header-left { display:flex; align-items:center; gap:6px; flex:1 1 auto; justify-content:center; }
        .app-header .logo-icon { font-size:32px; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 4px 8px rgba(180,100,40,0.15)); flex-shrink:0; }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
        .app-header .header-title { display:flex; flex-direction:column; align-items:flex-start; }
        .app-header h1 { font-family:var(--font-heading); font-size:1.6rem; color:var(--primary-dark); letter-spacing:0.03em; font-weight:700; line-height:1.2; }
        .app-header .subtitle { font-size:0.7rem; color:var(--text-muted); line-height:1.3; }
        .nav-tabs {
            display:flex; gap:0; justify-content:space-around; margin:6px 0 14px; background:var(--surface); border-radius:40px;
            padding:4px; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); position:sticky; top:8px; top:calc(8px + var(--safe-top));
            z-index:100; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); background:rgba(255,255,255,0.92);
            overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
        }
        .nav-tabs::-webkit-scrollbar { display:none; }
        .nav-tab {
            flex:1; padding:8px 4px; border-radius:30px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600;
            background:transparent; color:var(--text-light); transition:var(--transition); white-space:nowrap; letter-spacing:0.02em;
            font-family:var(--font-body); text-align:center; touch-action:manipulation; min-height:36px; -webkit-touch-callout:none;
        }
        .nav-tab:hover { background:#fef6ee; color:var(--primary); }
        .nav-tab.active { background:var(--primary); color:#fff; box-shadow:0 3px 14px rgba(200,117,61,0.3); }
        .panel { display:none; animation:fadeSlideIn 0.3s ease; }
        .panel.active { display:block; }
        @keyframes fadeSlideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .card { background:var(--surface); border-radius:var(--radius-lg); padding:18px 18px; box-shadow:var(--shadow); border:1px solid var(--border-light); transition:var(--transition); position:relative; }
        .card:hover { box-shadow:var(--shadow-lg); transform:translateY(-1px); }
        .card-header { display:flex; align-items:center; justify-content:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
        .card-title { font-family:var(--font-heading); font-size:1.1rem; color:var(--primary-dark); font-weight:700; letter-spacing:0.02em; text-align:center; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:16px; }
        .stat-card { background:var(--surface); border-radius:var(--radius-lg); padding:12px 16px; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); display:flex; align-items:center; gap:10px; transition:var(--transition); cursor:pointer; justify-content:flex-start; }
        .stat-card:hover { box-shadow:var(--shadow); transform:translateY(-2px); }
        .stat-icon { font-size:2.2rem; line-height:1; flex-shrink:0; text-align:center; }
        .stat-card .stat-label { font-size:2.0rem; font-weight:700; color:var(--primary-dark); line-height:1.2; letter-spacing:0.02em; flex-shrink:0; }
        .stat-card .stat-info { display:flex; flex-direction:column; align-items:center; min-width:0; flex:1; }
        .stat-card .stat-value { font-size:1.8rem; font-weight:800; color:var(--text); line-height:1.2; }
        .stat-card .stat-desc { font-size:0.7rem; color:var(--text-muted); font-weight:500; margin-top:1px; text-align:center; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 32px; border-radius:30px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600; letter-spacing:0.02em; transition:var(--transition); font-family:var(--font-body); white-space:nowrap; text-decoration:none; touch-action:manipulation; min-height:42px; min-width:100px; }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(200,117,61,0.25); }
        .btn-primary:hover { background:var(--primary-dark); box-shadow:0 4px 16px rgba(200,117,61,0.35); transform:translateY(-1px); }
        .btn-outline { background:#fff; color:var(--primary); border:2px solid var(--primary-light); }
        .btn-outline:hover { background:#fef6ee; border-color:var(--primary); }
        .btn-sm { padding:6px 18px; font-size:0.8rem; border-radius:22px; min-height:38px; min-width:70px; }
        .btn-xs { padding:4px 10px; font-size:0.65rem; border-radius:14px; min-height:28px; min-width:44px; }
        .btn-success { background:var(--success); color:#fff; box-shadow:0 2px 8px rgba(107,158,90,0.25); }
        .btn-success:hover { background:#558a45; box-shadow:0 4px 16px rgba(107,158,90,0.35); transform:translateY(-1px); }
        .btn-ghost { background:transparent; color:var(--text-muted); padding:4px 8px; font-size:0.8rem; font-weight:500; min-height:36px; min-width:auto; }
        .btn-ghost:hover { background:#f5ece4; color:var(--text); }
        .btn-delete { color:var(--danger); font-weight:600; background:transparent; border:1px solid var(--danger); }
        .btn-delete:hover { color:#a8432f; background:var(--danger-bg); }
        .btn-outline-danger { background:#fff; color:var(--danger); border:2px solid var(--danger); font-weight:600; }
        .btn-outline-danger:hover { background:var(--danger-bg); }
        .btn-danger { background:var(--danger); color:#fff; box-shadow:0 2px 8px rgba(200,85,61,0.25); }
        .btn-danger:hover { background:#a8432f; box-shadow:0 4px 16px rgba(200,85,61,0.35); transform:translateY(-1px); }
        .btn-use { background:var(--success-bg); color:var(--success); border:1px solid var(--success); padding:3px 10px; font-size:0.7rem; border-radius:14px; cursor:pointer; transition:var(--transition); font-weight:600; min-height:30px; }
        .btn-use:hover { background:var(--success); color:#fff; }
        .btn-use:disabled { opacity:0.4; cursor:not-allowed; background:#e0d6cc; color:#999; border-color:#ccc; }
        .material-table-wrap { overflow-x:auto; border-radius:var(--radius-lg); box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--border-light); -webkit-overflow-scrolling:touch; }
        .material-table { width:100%; border-collapse:collapse; min-width:600px; font-size:0.9rem; table-layout:auto; }
        .material-table th, .material-table td { padding:8px 10px; border-bottom:1px solid var(--border-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.5; }
        .material-table th { background:#fef9f3; font-weight:700; font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; position:sticky; top:0; z-index:2; }
        .material-table tbody tr:hover { background:#fefaf6; }
        .material-table .drag-handle { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; font-size:1rem; color:var(--text-muted); padding:2px 4px; display:inline-block; width:20px; text-align:center; transition:color 0.2s; }
        .material-table .drag-handle:active { cursor:grabbing; }
        .material-table .drag-handle:hover { color:var(--primary); }
        .material-table .col-drag { width:28px; text-align:center; }
        .material-table .col-name { width:auto; min-width:160px; }
        .material-table .col-cat { width:90px; text-align:center; }
        .material-table .col-stock { width:90px; text-align:center; }
        .material-table .col-edit { width:50px; text-align:center; }
        .material-table .col-copy { width:50px; text-align:center; }
        .material-table .col-del { width:50px; text-align:center; }
        .material-table .col-edit .btn, .material-table .col-copy .btn,.material-table .col-del .btn { min-width:36px; padding:2px 6px; font-size:0.6rem; min-height:24px; }
        .category-badge { display:inline-block; padding:2px 8px; border-radius:14px; font-size:0.65rem; font-weight:600; background:#f3e6d8; color:#6b4d3a; letter-spacing:0.03em; white-space:nowrap; }
        .material-name-click { cursor:pointer; color:var(--primary-dark); font-weight:600; transition:color 0.15s; }
        .material-name-click:hover { color:var(--primary); text-decoration:underline; }
        .brand-text { font-weight:400; color:var(--primary); font-size:inherit; }
        .recipes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
        .recipe-card { background:var(--surface); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow); border:1px solid var(--border-light); transition:var(--transition); display:flex; flex-direction:column; gap:8px; position:relative; cursor:pointer; }
        .recipe-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-3px); }
        .recipe-card .recipe-emoji { display:inline-block; margin-right:6px; font-size:1.4rem; vertical-align:middle; cursor:pointer; }
        .recipe-card h3 { font-family:Arial, 'Helvetica Neue', sans-serif; font-size:1.4rem; color:var(--primary-dark); letter-spacing:0.02em; cursor:pointer; display:flex; align-items:center; }
        .recipe-card .recipe-desc { font-size:0.82rem; color:var(--text-muted); line-height:1.5; flex-grow:1; }
        .recipe-card .recipe-meta { font-size:0.75rem; color:var(--text-light); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .recipe-card .recipe-actions { display:flex; gap:4px; flex-wrap:nowrap; margin-top:4px; justify-content:space-between; align-items:center; }
        .recipe-card .recipe-actions .btn { flex:1 1 0; min-width:0; justify-content:center; padding:6px 4px; font-size:0.75rem; border-radius:22px; white-space:nowrap; text-align:center; min-height:34px; }
        .recipe-card .recipe-nutrition { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; background:var(--border-light); border-radius:var(--radius-sm); overflow:hidden; padding:1px; margin-top:2px; }
        .recipe-card .nutrition-item { background:var(--surface); text-align:center; padding:4px 2px; font-size:0.6rem; line-height:1.3; }
        .recipe-card .nutrition-item .nut-val { font-weight:700; color:var(--primary-dark); font-size:0.72rem; }
        .recipe-card .nutrition-item .nut-label { color:var(--text-muted); font-size:0.55rem; }
        .recipe-status-badge { display:inline-block; padding:3px 10px; border-radius:16px; font-size:0.7rem; font-weight:600; letter-spacing:0.02em; }
        .recipe-status-badge.can-make { background:var(--success-bg); color:#4a7a3a; }
        .recipe-status-badge.partial { background:#fef6ed; color:#b87820; }
        .recipe-status-badge.cannot-make { background:var(--danger-bg); color:#a84030; }
        .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
        .filter-bar input, .filter-bar select { padding:10px 14px; border-radius:30px; border:2px solid var(--border); font-size:0.9rem; font-family:var(--font-body); background:var(--surface); color:var(--text); transition:var(--transition); min-width:120px; outline:none; -webkit-appearance:none; appearance:none; }
        .filter-bar input:focus, .filter-bar select:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.08); }
        .filter-bar input { flex:1; min-width:160px; max-width:280px; }
        .filter-bar .btn { flex-shrink:0; }
        .filter-bar .btn-sm { min-height:44px; padding:0 16px; height:44px; display:inline-flex; align-items:center; justify-content:center; font-size:0.9rem; }
        .recipe-filter-bar { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:6px; padding-bottom:4px; }
        .recipe-filter-bar input { flex:2; min-width:100px; max-width:none; font-size:0.9rem; }
        .recipe-filter-bar select { flex:1; min-width:80px; max-width:none; text-align:center; text-align-last:center; -webkit-text-align-last:center; font-size:0.9rem; }
        .recipe-filter-bar .btn { flex:1; min-width:80px; max-width:none; font-size:0.9rem; padding:10px 12px; min-height:41px; height:auto; }
        .panel-bottom-actions { display:flex; justify-content:flex-end; margin-top:14px; gap:10px; flex-wrap:wrap; align-items:center; }
        .log-filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:nowrap; background:var(--surface-alt); padding:10px 14px; border-radius:var(--radius); border:1px solid var(--border-light); overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap; scrollbar-width:thin; min-height:52px; }
        .log-filter-bar input, .log-filter-bar select, .log-filter-bar .btn { height:38px; min-height:38px; padding:6px 12px; border-radius:30px; border:2px solid var(--border); font-size:14px; font-family:var(--font-body); background:var(--surface); color:var(--text); transition:var(--transition); outline:none; flex-shrink:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; line-height:1; }
        .log-filter-bar input:focus, .log-filter-bar select:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.08); }
        .log-filter-bar input { min-width:90px; max-width:150px; text-align:left; justify-content:flex-start; }
        .log-filter-bar .date-range input { width:140px; min-width:110px; }
        .log-filter-bar .btn { padding:0 14px; font-size:0.8rem; border-color:var(--border); background:var(--surface); color:var(--text-light); }
        .log-filter-bar .btn:hover { border-color:var(--primary-light); background:#fef6ee; }
        .log-filter-bar .date-range { display:flex; align-items:center; gap:4px; }
        .log-filter-bar .date-range span { font-size:0.85rem; color:var(--text-muted); }
        .log-summary { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border-light); margin-bottom:12px; font-size:0.9rem; }
        .log-summary .summary-item { display:flex; align-items:center; gap:4px; }
        .log-summary .summary-item .label { color:var(--text-muted); }
        .log-summary .summary-item .value { font-weight:700; color:var(--primary-dark); }
        .log-summary .recipe-summary { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .log-summary .recipe-summary .rs-item { background:var(--surface-alt); padding:2px 10px; border-radius:12px; font-size:0.8rem; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(40,18,5,0.5); z-index:200; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
        .modal-overlay.show { display:flex; }
        .modal-overlay .modal { background:var(--surface); border-radius:var(--radius-xl); padding:22px 20px 18px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(40,18,5,0.2); animation:modalIn 0.3s ease; position:relative; margin:auto; max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; border:1px solid rgba(255,255,255,0.3); }
        .modal-overlay .modal.fullscreen { border-radius:0; max-width:100%; max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; margin:0; padding:20px 18px; padding-top:calc(20px + var(--safe-top)); padding-bottom:calc(20px + var(--safe-bottom)); }
        @keyframes modalIn { from { opacity:0; transform:translateY(30px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .modal h2 { font-family:var(--font-heading); color:var(--primary-dark); font-size:1.25rem; margin-bottom:14px; letter-spacing:0.02em; padding-right:30px; font-weight:700; }
        .modal .form-group { margin-bottom:14px; }
        .modal .form-group label { display:block; font-weight:600; font-size:0.85rem; color:var(--text-light); margin-bottom:4px; letter-spacing:0.02em; }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea { width:100%; padding:8px 12px; border-radius:var(--radius-sm); border:2px solid var(--border); font-size:16px; font-family:var(--font-body); background:#fefcf9; color:var(--text); transition:var(--transition); outline:none; resize:vertical; -webkit-appearance:none; appearance:none; height:40px; }
        .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.07); }
        .modal .form-group input[readonly] { background:#f5f0eb; color:var(--text-muted); }
        .modal .close-btn { position:sticky; top:0; float:right; margin-top:-8px; margin-right:-6px; width:36px; height:36px; border-radius:50%; border:none; background:#f5ece4; cursor:pointer; font-size:1.1rem; color:var(--text-muted); transition:var(--transition); display:flex; align-items:center; justify-content:center; z-index:10; }
        .modal .close-btn:hover { background:#e8d5c4; color:var(--text); }
        .modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
        .modal .form-row { display:flex; flex-wrap:wrap; gap:10px; }
        .modal .form-row .form-group { flex:1 1 calc(50% - 10px); min-width:140px; }
        .modal .form-row.keep-row .form-group { flex:1 1 calc(50% - 10px); min-width:0; }
        .modal .form-row-3 { display:flex; flex-wrap:wrap; gap:10px; }
        .modal .form-row-3 .form-group { flex:1 1 calc(33.33% - 10px); min-width:100px; }
        .date-input-group {
            position:relative; display:flex; align-items:center; gap:4px; width:100%; border:2px solid var(--border);
            border-radius:var(--radius-sm); background:#fefcf9; transition:var(--transition); padding:0 4px; height:40px; box-sizing:border-box;
        }
        .date-input-group:focus-within { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.07); }
        .date-input-group input[type="text"] { flex:1; height:38px; font-size:16px; padding:8px 30px 8px 4px; border:none; background:transparent; outline:none; min-width:0; }
        .date-input-group .date-picker-btn {
            flex-shrink:0; background:transparent; border:none; font-size:18px; color:var(--text-muted); cursor:pointer; padding:0; line-height:1;
            display:inline-flex; align-items:center; justify-content:center; position:relative; min-width:36px; min-height:40px; height:100%; margin:0;
            order:-1; margin-top:10px;
        }
        .date-input-group .date-picker-btn:hover { color:var(--primary); }
        .date-input-group .clear-date-btn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:transparent; border:none; font-size:16px; color:var(--text-muted); cursor:pointer; padding:0 4px; line-height:1; }
        .date-input-group .clear-date-btn:hover { color:var(--danger); }
        .pack-input-wrap { display:flex; align-items:center; border:2px solid var(--border); border-radius:var(--radius-sm); background:#fefcf9; padding:0 8px; height:40px; transition:var(--transition); box-sizing:border-box; position:relative; }
        .pack-input-wrap:focus-within { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.07); }
        .pack-input-wrap input[type="number"] { border:none; background:transparent; padding:4px 2px; font-size:16px; width:100%; min-width:36px; flex:1; outline:none; text-align:left; height:100%; -moz-appearance:textfield; appearance:textfield; }
        .pack-input-wrap input[type="number"]::-webkit-outer-spin-button,

<body class="not-logged-in">
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <span class="logo-icon">🥐</span>
                <div class="header-title">
                    <h1>烘焙工作台</h1>
                    <span class="subtitle">配方 · 库存 · 计时 · 一站式烘焙助手</span>
                </div>
            </div>
        </header>

        <nav class="nav-tabs" id="navTabs">
            <button class="nav-tab active" data-panel="dashboard">工作台</button>
            <button class="nav-tab" data-panel="materials">材料库存</button>
            <button class="nav-tab" data-panel="recipes">配方</button>
            <button class="nav-tab" data-panel="gallery">成品图</button>
            <button class="nav-tab" data-panel="logs">使用日志</button>
        </nav>

        <section class="panel active" id="panel-dashboard">
            <div class="stats-grid" id="dashboardStats"></div>
            <div style="display:grid;grid-template-columns:1fr;gap:16px;">
                <div class="card">
                    <div class="card-header" style="justify-content:flex-start;"><span class="card-title">✅ 可立即制作的配方</span></div>
                    <div class="avail-table-wrap" id="availableRecipesTableWrap" style="display:none;">
                        <table class="avail-table">
                            <tbody id="availableRecipesTableBody"></tbody>
                        </table>
                    </div>
                    <div id="availableRecipesEmpty" style="display:none;color:var(--text-muted);text-align:center;padding:20px;">暂无可制作的配方</div>
                </div>
            </div>
            <div style="margin-top:16px; display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn btn-outline btn-sm" onclick="exportData()">导出数据</button>
                <button class="btn btn-outline btn-sm edit-only" onclick="importData()">导入数据</button>
                <button class="btn btn-outline btn-sm edit-only" onclick="openCloudSettings()">云同步</button>
            </div>
        </section>

        <section class="panel" id="panel-materials">
            <div class="filter-bar material-filter-bar">
                <input type="text" id="materialSearch" placeholder="搜索商品或分类..." oninput="renderMaterials()">
                <button class="btn btn-outline btn-sm edit-only" onclick="openCategoryMgmtModal()" style="height:44px;min-height:44px;">分类管理</button>
            </div>
            <div class="material-table-wrap">
                <table class="material-table">
                    <thead>
                        <tr>
                            <th class="col-drag">☰</th>
                            <th class="col-name" id="th-name" onclick="sortMaterials('name')" style="cursor:pointer;">商品名 <span id="sortIcon-name"></span></th>
                            <th class="col-cat" id="th-category" onclick="sortMaterials('category')" style="cursor:pointer;">分类 <span id="sortIcon-category"></span></th>
                            <th class="col-stock" id="th-stock" onclick="sortMaterials('stock')" style="cursor:pointer;">库存 <span id="sortIcon-stock"></span></th>
                            <th class="col-edit edit-only">编辑</th>
                            <th class="col-copy edit-only">复制</th>
                            <th class="col-del edit-only">删除</th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody"></tbody>
                </table>
            </div>
            <div class="panel-bottom-actions">
                <button class="btn btn-primary edit-only" onclick="openMaterialModal()">+ 添加商品</button>
                <button class="btn btn-outline edit-only" onclick="openCategoryModal()">+ 新增分类</button>
            </div>
            <div class="empty-state" id="materialEmpty" style="display:none;">
                <span class="empty-icon">📭</span>
                <p>还没有添加商品</p>
                <button class="btn btn-primary btn-sm edit-only" onclick="openMaterialModal()">+ 添加第一种商品</button>
            </div>
        </section>

        <section class="panel" id="panel-recipes">
            <div class="filter-bar recipe-filter-bar">
                <input type="text" id="recipeSearch" placeholder="搜索配方..." oninput="renderRecipes()">
                <select id="recipeFilter" onchange="renderRecipes()">
                    <option value="all">全部配方</option>
                    <option value="can-make">✅ 可制作</option>
                </select>
                <button class="btn btn-primary edit-only" onclick="openRecipeModal()">添加配方</button>
            </div>
            <div class="recipes-grid" id="recipesGrid"></div>
            <div class="empty-state" id="recipeEmpty" style="display:none;">
                <span class="empty-icon">📖</span>
                <p>还没有配方</p>
                <button class="btn btn-primary btn-sm edit-only" onclick="openRecipeModal()">添加第一个配方</button>
            </div>
        </section>

        <section class="panel" id="panel-gallery">
            <div class="card">
                <div class="card-header"><span class="card-title">🖼️ 成品图总览</span></div>
                <div id="galleryContainer"></div>
            </div>
        </section>

        <section class="panel" id="panel-logs">
            <div class="card">
                <div class="card-header"><span class="card-title">📋 使用日志</span></div>
                <div class="log-filter-bar">
                    <input type="text" id="logSearchMaterial" placeholder="商品或分类" oninput="applyLogFilters()">
                    <input type="text" id="logSearchRecipe" placeholder="配方" oninput="applyLogFilters()">
                    <div class="date-range">
                        <span>从</span>
                        <div class="date-input-group" style="width:180px;">
                            <label class="date-picker-btn" for="logDateFrom_date" title="选择日期" style="transform: none; margin-top:0; pointer-events:auto;">📅</label>
                            <input type="date" id="logDateFrom_date" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:none;background:transparent;" onchange="onNativeDateChange('logDateFrom', this.value); applyLogFilters();">
                            <input type="text" id="logDateFrom" placeholder="开始日期" style="flex:1;height:38px; position:relative; z-index:2;" onblur="formatDateInput('logDateFrom'); applyLogFilters();">
                            <button type="button" class="clear-date-btn" id="clearLogDateFrom" title="清除" style="z-index:3;">✕</button>
                        </div>
                        <span>至</span>
                        <div class="date-input-group" style="width:180px;">
                            <label class="date-picker-btn" for="logDateTo_date" title="选择日期" style="transform: none; margin-top:0; pointer-events:auto;">📅</label>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMessage">确定执行此操作？</p>
            <div class="confirm-actions">
                <button class="btn btn-outline" id="confirmCancelBtn">取消</button>
                <button class="btn btn-primary" id="confirmOkBtn">确定</button>

    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
    <div id="toastContainer" class="toast-wrap"></div>
        <script>
(function() {
    'use strict';

    // ============================================================
    // 模态框栈管理
    // ============================================================
    let modalStack = [];
    let _detailModalScrollTop = 0;
    let stepTimers = {};
    let _materialDetailScrollTop = 0;
    let _mgmtModalScrollTop = 0;
    let _mgrModalScrollTop = 0;
    let _rotateDeg = 0;
    let _imgEl = null, _scale = 1, _panX = 0, _panY = 0;
    let _previewImages = [], _previewIndex = 0;
    let _fullscreenScrollPositions = {};

    function openModal(htmlContent, isFullscreen, modalKey) {
        const overlay = document.getElementById('modalOverlay');
        const modal = overlay.querySelector('.modal');
        if (modalKey) {
            for (let i = modalStack.length - 1; i >= 0; i--) {
                if (modalStack[i].key === modalKey) {
                    modalStack = modalStack.slice(0, i);
                    break;
                }
            }
        }
        if (overlay.classList.contains('show') && modal) {
            modalStack.push({
                html: modal.innerHTML,
                scrollTop: modal.scrollTop,
                fullscreen: modal.classList.contains('fullscreen'),
                key: modalKey || null
            });
        }
        const wasOpen = overlay.classList.contains('show');
        modal.innerHTML = htmlContent;
        overlay.classList.add('show');
        if (isFullscreen) {
            modal.classList.add('fullscreen');
        } else {
            modal.classList.remove('fullscreen');
        }
        // 为配方详情页设置 data-recipe-id
        if (modalKey && modalKey.startsWith('recipeDetail_')) {
            const recipeId = modalKey.replace('recipeDetail_', '');
            modal.dataset.recipeId = recipeId;
        }
        // 仅首次打开弹窗时锁定页面滚动并记录滚动位置，避免子弹窗把 beforeScroll 覆盖成 0
        if (!wasOpen) {
            const scrollY = window.scrollY;
            document.body.style.top = '-' + scrollY + 'px';
            document.body.classList.add('modal-open');
            overlay.dataset.beforeScroll = scrollY;
        }
        modal.scrollTop = 0;
        modal.querySelectorAll('form button:not([type])').forEach(btn => btn.setAttribute('type', 'button'));
    }

    function replaceModalContent(html, scrollTop = 0) {
        const modal = document.querySelector('#modalOverlay .modal');
        if (modal) {
            modal.innerHTML = html;
            modal.scrollTop = scrollTop;
        }
    }

    function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        const modal = overlay.querySelector('.modal');
        if (modalStack.length > 0) {
            const state = modalStack.pop();
            modal.innerHTML = state.html;
            modal.style.padding = '';
            modal.style.overflow = '';
            if (state.fullscreen) {
                modal.classList.add('fullscreen');
            } else {
                modal.classList.remove('fullscreen');
            }
            overlay.classList.add('show');
            document.body.classList.add('modal-open');
            setTimeout(() => { modal.scrollTop = state.scrollTop; }, 10);
            return;
        }
        const scrollY = parseInt(overlay.dataset.beforeScroll) || 0;
        overlay.classList.remove('show');
        document.body.classList.remove('modal-open');
        document.body.style.top = '';
        pauseAllStepTimers();
        window.scrollTo(0, scrollY);
        modalStack = [];
        delete modal.dataset.recipeId;
        modal.style.padding = '';
        modal.style.overflow = '';
        if (window._needRefreshAfterClose) {
            window._needRefreshAfterClose = false;
            setTimeout(() => renderAllPreserveScroll(scrollY), 50);
        }
    }

    function closeAllModals() {
        const overlay = document.getElementById('modalOverlay');
        if (overlay.classList.contains('show')) {
            const scrollY = parseInt(overlay.dataset.beforeScroll) || 0;
            overlay.classList.remove('show');
            document.body.classList.remove('modal-open');
            document.body.style.top = '';
            pauseAllStepTimers();
            window.scrollTo(0, scrollY);
        }
        modalStack = [];
        const modal = document.getElementById('modalContent');
        if (modal) { delete modal.dataset.recipeId; }
        modal.innerHTML = '';
    }

    function pauseAllStepTimers() {
        Object.values(stepTimers).forEach(timer => {
            if (timer.state === 'running') {
                const elapsed = Math.floor((Date.now() - timer.startTime) / 1000);
                timer.remain = Math.max(0, timer.totalSeconds - elapsed);
                timer.state = 'paused';
                if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
            }
        });
    }

    // ============================================================
    // IndexedDB 图片存储
    // ============================================================
    const DB_NAME = 'BakingAppDB';
    const STORE_NAME = 'images';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            if (db && db.name === DB_NAME) { resolve(db); return; }
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const d = e.target.result;
                if (!d.objectStoreNames.contains(STORE_NAME)) {
                    d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = (e) => { db = e.target.result; resolve(db); };
            request.onerror = (e) => reject(e.target.error);
        });
    }

    async function saveImage(dataUrl) {
        const d = await openDB();
        const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.put({ id, data: dataUrl });
            req.onsuccess = () => resolve(id);
            req.onerror = () => reject(req.error);
        });
    }

    async function saveImageWithId(id, dataUrl) {
        const d = await openDB();
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.put({ id, data: dataUrl });
            req.onsuccess = () => resolve(id);
            req.onerror = () => reject(req.error);
        });
    }

    async function getImage(id) {
        if (!id) return null;
        const d = await openDB();
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result ? req.result.data : null);
            req.onerror = () => reject(req.error);
        });
    }

    async function deleteImage(id) {
        if (!id) return;
        const d = await openDB();
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }

    // 列出 IndexedDB 中全部图片（用于云端同步时整体打包）
    async function listAllImages() {
        const d = await openDB();
        return new Promise((resolve, reject) => {
            const tx = d.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    }

    // ============================================================
    // 存储工具
    // ============================================================
    const STORAGE_MATERIALS = 'baking_materials_v16';
    const STORAGE_RECIPES = 'baking_recipes_v16';
    const STORAGE_USAGE = 'baking_usage_logs_v16';
    const STORAGE_CATEGORIES = 'baking_categories_v3';
    const STORAGE_LAST_CATEGORY = 'baking_last_category_v1';
    const STORAGE_RECYCLE = 'baking_recycle_bin_v1';
    const STORAGE_DRAFT = 'baking_drafts_v1';
    const STORAGE_CLOUD = 'baking_cloud_config_v1';
    const STORAGE_LAST_SYNC = 'baking_last_sync_v1';
    // 跨标签页/窗口推送锁：用 BroadcastChannel 广播「正在推送」状态，
    // 避免多个标签页同时抢写导致 sha 冲突（GitHub 返回 409）。
    // BroadcastChannel 在不支持的浏览器自动降级为「仅单页锁」。
    var _pushChannel = null;
    var _remotePushers = {};
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            _pushChannel = new BroadcastChannel('baking_cloud_push_v1');
            _pushChannel.onmessage = function(ev) {
                const d = ev.data;
                if (!d || !d.id) return;
                if (d.type === 'active') _remotePushers[d.id] = Date.now();
                else if (d.type === 'done') delete _remotePushers[d.id];
            };
        }
    } catch (e) {}
    var _pusherId = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    function hasRemotePusher() {
        // 清理超过 15 秒没续约的远程推送者（视为已死）
        const now = Date.now();
        for (const id in _remotePushers) {
            if (now - _remotePushers[id] > 15000) delete _remotePushers[id];
        }
        return Object.keys(_remotePushers).length > 0;
    }
    function announcePusher(active) {
        try { if (_pushChannel) _pushChannel.postMessage({ type: active ? 'active' : 'done', id: _pusherId }); } catch (e) {}
    }
    // ============================================================
    // 云端公开仓库地址（公开信息，访客无需登录即可用它拉取数据）
    // ★ 部署前请把 DEFAULT_CLOUD_REPO 改成你的「用户名/仓库名」，
    //   例如 'myname/baking-data'，这样别人打开网址就能自动看到你的数据。
    //   访问令牌（token）绝不写在这里，只在登录时存本机浏览器。
    // ============================================================
    const DEFAULT_CLOUD_REPO = 'sheep930/sheep930';
    const DEFAULT_CLOUD_BRANCH = 'main';
    const DEFAULT_CLOUD_PATH = 'data.json';
    const DEFAULT_CATEGORIES = ['低筋面粉','高筋面粉','白砂糖','全脂牛奶','鸡蛋','黄油','酵母','盐','水'];
    const UNITS = ['g','kg','ml','L','个'];

    function loadCategories() {
        try { const raw = localStorage.getItem(STORAGE_CATEGORIES); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d) && d.length) return d; } } catch(e) {}
        return [...DEFAULT_CATEGORIES];
    }
    let CATEGORIES = loadCategories();
    function saveCategories() { try { localStorage.setItem(STORAGE_CATEGORIES, JSON.stringify(CATEGORIES)); } catch(e) {} scheduleCloudPush(); }
    function getLastSelectedCategory() { try { return localStorage.getItem(STORAGE_LAST_CATEGORY) || null; } catch(e) { return null; } }
    function setLastSelectedCategory(catName) { try { localStorage.setItem(STORAGE_LAST_CATEGORY, catName); } catch(e) {} }

    function loadMaterials() {
        try { const raw = localStorage.getItem(STORAGE_MATERIALS); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) return d; } } catch(e) {}
        return [];
    }
    function saveMaterials() { try { localStorage.setItem(STORAGE_MATERIALS, JSON.stringify(materials)); } catch(e) { showToast('⚠️ 商品库存保存失败', 'error'); } scheduleCloudPush(); }

    function loadRecipes() {
        try { const raw = localStorage.getItem(STORAGE_RECIPES); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) return d; } } catch(e) {}
        return [];
    }
    function saveRecipes() { try { localStorage.setItem(STORAGE_RECIPES, JSON.stringify(recipes)); } catch(e) { showToast('⚠️ 配方保存失败', 'error'); } scheduleCloudPush(); }

    function loadUsageLogs() {
        try { const raw = localStorage.getItem(STORAGE_USAGE); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) return d; } } catch(e) {}
        return [];
    }
    function saveUsageLogs() { try { localStorage.setItem(STORAGE_USAGE, JSON.stringify(usageLogs)); } catch(e) { showToast('⚠️ 日志保存失败', 'error'); } scheduleCloudPush(); }

    function loadRecycleBin() {
        try { const raw = localStorage.getItem(STORAGE_RECYCLE); if (raw) { const d = JSON.parse(raw); if (Array.isArray(d)) return d; } } catch(e) {}
        return [];
    }
    function saveRecycleBin() { try { localStorage.setItem(STORAGE_RECYCLE, JSON.stringify(recycleBin)); } catch(e) {} scheduleCloudPush(); }

    // 草稿（自动保存，防止意外关闭丢失编辑内容）
    function getDraftStore() {
        try { const raw = localStorage.getItem(STORAGE_DRAFT); return raw ? JSON.parse(raw) : {}; } catch(e) { return {}; }
    }
    function saveDraft(key, data) {
        const store = getDraftStore();
        if (data === null || data === undefined) { delete store[key]; }
        else store[key] = { data: data, savedAt: Date.now() };
        try { localStorage.setItem(STORAGE_DRAFT, JSON.stringify(store)); } catch(e) {}
    }
    function loadDraft(key) {
        const store = getDraftStore();
        const d = store[key];
        return d ? d.data : null;
    }
    function clearDraft(key) { saveDraft(key, null); }
    function debounce(fn, ms) {
        let timer = null;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), ms);
        };
    }

    let materials = loadMaterials();
    let recipes = loadRecipes();
    let usageLogs = loadUsageLogs();
    // 兼容旧数据：为历史使用记录补齐唯一 id（还原功能依赖）
    (function() {
        let needSave = false;
        usageLogs.forEach(u => { if (!u.id) { u.id = genId('u'); needSave = true; } });
        if (needSave) { try { localStorage.setItem(STORAGE_USAGE, JSON.stringify(usageLogs)); } catch(e) {} }
    })();
    let recycleBin = loadRecycleBin();

    // ============================================================
    // 工具函数
    // ============================================================
    function genId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
    // HTML 转义，防止用户输入中的 < > & " ' 破坏页面结构或注入脚本（XSS）
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, function(ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
    }
    // 用于内联 onclick 等「JS 字符串参数」的安全转义：先转义 JS 特殊字符，
    // 再做 HTML 属性转义，防止分类名/配方名里含引号、反斜杠时破坏脚本或注入。
    function escAttrForJs(str) {
        if (str === null || str === undefined) return '';
        return escapeHtml(String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
    }
    function renderAllPreserveScroll(preferredScrollY) { const scrollY = (preferredScrollY !== undefined) ? preferredScrollY : window.scrollY; renderAll(); window.scrollTo(0, scrollY); }
    function findMaterialById(id) { return materials.find(m => m.id === id); }
    function getItemRemaining(item) {
        if (!item) return 0;
        if (item.remainingQuantity !== undefined && item.remainingQuantity !== null) return Math.max(0, item.remainingQuantity);
        const total = item.totalQuantity || 0;
        const used = usageLogs.filter(u => u.materialId === item.id).reduce((s,u) => s + u.quantity, 0);
        const rem = Math.max(0, total - used);
        item.remainingQuantity = rem;
        return rem;
    }
    function getUnitPrice(item) {
        if (!item) return 0;
        const price = item.price || 0;
        if (!item.specification) return price;
        const match = item.specification.match(/^([\d.]+)/);
        if (match) { const n = parseFloat(match[1]); if (n > 0) return price / n; }
        return price;
    }

    const liquidDensities = { '水':1.0, '牛奶':1.0, '鸡蛋':1.03, '奶油':1.01, '油':0.92, '橄榄油':0.92, '蜂蜜':1.42, '酱油':1.15, '醋':1.0 };
    function getDensityForCategory(category) {
        if (!category) return 1.0;
        const name = category.toLowerCase();
        for (const key in liquidDensities) {
            if (name.includes(key.toLowerCase())) return liquidDensities[key];
        }
        return 1.0;
    }

    function convertToUnit(quantity, fromUnit, toUnit, materialName) {
        if (fromUnit === toUnit) return quantity;
        const massUnits = ['g', 'kg'];
        if (massUnits.includes(fromUnit) && massUnits.includes(toUnit)) {
            if (fromUnit === 'kg' && toUnit === 'g') return quantity * 1000;
            if (fromUnit === 'g' && toUnit === 'kg') return quantity / 1000;
        }
        const volUnits = ['ml', 'L'];
        if (volUnits.includes(fromUnit) && volUnits.includes(toUnit)) {
            if (fromUnit === 'L' && toUnit === 'ml') return quantity * 1000;
            if (fromUnit === 'ml' && toUnit === 'L') return quantity / 1000;
        }
        const name = materialName || '';
        let density = null;
        for (const key in liquidDensities) {
            if (name.includes(key)) { density = liquidDensities[key]; break; }
        }
        if (density) {
            if (fromUnit === 'ml' && toUnit === 'g') return quantity * density;
            if (fromUnit === 'g' && toUnit === 'ml') return quantity / density;
            if (fromUnit === 'L' && toUnit === 'kg') return quantity * density;
            if (fromUnit === 'kg' && toUnit === 'L') return quantity / density;
            if (fromUnit === 'ml' && toUnit === 'kg') return quantity * density / 1000;
            if (fromUnit === 'g' && toUnit === 'L') return quantity / density / 1000;
            if (fromUnit === 'L' && toUnit === 'g') return quantity * density * 1000;
            if (fromUnit === 'kg' && toUnit === 'ml') return quantity / density * 1000;
        }
        console.warn('[convertToUnit] 无法换算单位：', quantity, fromUnit, '→', toUnit, materialName);
        return 0;
    }

    function addUsageLog(mid, qty, unit, rName, rId, batchId) {
        const item = findMaterialById(mid); if (!item) return;
        const displayName = item.name + (item.brand ? ' ' + item.brand : '');
        const unitPrice = getUnitPrice(item);
        const amountUsed = qty * unitPrice;
        usageLogs.push({ id: genId('u'), materialId: mid, materialName: displayName, quantity: qty, unit: unit, recipeName: rName || '直接使用', recipeId: rId || '', timestamp: Date.now(), amountUsed: amountUsed, priceAtUse: unitPrice, batchId: batchId || null });
        saveUsageLogs();
        if (item.remainingQuantity !== undefined && item.remainingQuantity !== null) {
            item.remainingQuantity = Math.max(0, item.remainingQuantity - qty);
            saveMaterials();
        } else {
            const used = usageLogs.filter(u => u.materialId === item.id).reduce((s,u) => s + u.quantity, 0);
            item.remainingQuantity = Math.max(0, (item.totalQuantity || 0) - used);
            saveMaterials();
        }
    }

    // Toast 提示
    function showToast(message, type = '', persistent = false, action = null) {
        const container = document.getElementById('toastContainer');
        const toasts = container.querySelectorAll('.toast:not(.persistent)');
        if (!persistent && toasts.length >= 3) toasts[0].remove();
        const toast = document.createElement('div');
        toast.className = 'toast ' + type + (persistent ? ' persistent' : '');
        const textSpan = document.createElement('span');
        textSpan.className = 'toast-text';
        textSpan.textContent = message;
        const closeBtn = document.createElement('span');
        closeBtn.className = 'toast-close';
        closeBtn.textContent = '✕';
        toast.appendChild(textSpan);
        toast.appendChild(closeBtn);
        function dismiss() {
            toast.style.opacity = '0';
            toast.style.transition = '0.3s';
            setTimeout(() => toast.remove(), 300);
        }
        closeBtn.addEventListener('click', (e) => { e.stopPropagation(); dismiss(); });
        toast.addEventListener('click', (e) => { if (e.target === toast || e.target === textSpan) dismiss(); });
        if (action && action.label) {
            const actionBtn = document.createElement('span');
            actionBtn.className = 'toast-action';
            actionBtn.textContent = action.label;
            actionBtn.style.cssText = 'margin-left:8px;color:#fff;background:rgba(255,255,255,0.25);padding:2px 10px;border-radius:12px;cursor:pointer;font-weight:600;flex-shrink:0;';
            actionBtn.addEventListener('click', (e) => { e.stopPropagation(); dismiss(); if (typeof action.callback === 'function') action.callback(); });
            toast.appendChild(actionBtn);
        }
        container.appendChild(toast);
        if (!persistent) {
            let autoTimer = setTimeout(() => { dismiss(); }, 3200);
            toast.addEventListener('mouseenter', () => { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } });
            toast.addEventListener('mouseleave', () => { if (!autoTimer) { autoTimer = setTimeout(() => { dismiss(); }, 2000); } });
        }
    }

    // 确认对话框
    let _confirmCallback = null;
    let _confirmCancelCallback = null;
    function showConfirm(message, onConfirm, onCancel) {
        const overlay = document.getElementById('confirmOverlay');
        document.getElementById('confirmMessage').textContent = message;
        overlay.classList.add('show');
        _confirmCallback = onConfirm || null;
        _confirmCancelCallback = onCancel || null;
        const okBtn = document.getElementById('confirmOkBtn');
        const cancelBtn = document.getElementById('confirmCancelBtn');
        const newOk = okBtn.cloneNode(true);
        const newCancel = cancelBtn.cloneNode(true);
        okBtn.parentNode.replaceChild(newOk, okBtn);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
        const cleanup = () => {
            overlay.classList.remove('show');
            _confirmCallback = null;
            _confirmCancelCallback = null;
        };

    // 图片压缩
    const IMAGE_CONFIG = { maxWidth: 2048, maxHeight: 2048, quality: 0.8, maxFileSize: 200 * 1024 * 1024 };
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            if (!file.type.startsWith('image/')) { reject(new Error('非图片文件')); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > IMAGE_CONFIG.maxWidth || height > IMAGE_CONFIG.maxHeight) {
                        const ratio = Math.min(IMAGE_CONFIG.maxWidth / width, IMAGE_CONFIG.maxHeight / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', IMAGE_CONFIG.quality);
                    resolve(dataUrl);
                };
                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = ev.target.result;
            };
            reader.onerror = () => reject(new Error('文件读取失败'));
            reader.readAsDataURL(file);
        });
    }
    function formatFileSize(bytes) { if (bytes < 1024) return bytes + 'B'; if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB'; return (bytes / 1024 / 1024).toFixed(1) + 'MB'; }

    function bindCategoryDragEvents() {
        const tbody = document.getElementById('categoryMgmtTbody');
        if (!tbody) return;
        let dragItem = null;
        const dragStart = (e) => {
            const tr = e.target.closest('tr');
            if (!tr) return;
            dragItem = tr;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
            tr.style.opacity = '0.5';
        };
        const dragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        const drop = (e) => {
            e.preventDefault();
            if (!dragItem) return;
            const target = e.target.closest('tr');
            if (!target || target === dragItem) { dragItem = null; return; }
            const children = Array.from(tbody.children);
            const dragIdx = children.indexOf(dragItem);
            const targetIdx = children.indexOf(target);
            if (dragIdx < targetIdx) tbody.insertBefore(dragItem, target.nextSibling);
            else tbody.insertBefore(dragItem, target);
            CATEGORIES = Array.from(tbody.children).map(tr => tr.dataset.cat);
            saveCategories();
            dragItem.style.opacity = '';
            dragItem = null;
        };
        const dragEnd = () => { if (dragItem) { dragItem.style.opacity = ''; dragItem = null; } };
        tbody.addEventListener('dragstart', dragStart);
        tbody.addEventListener('dragover', dragOver);
        tbody.addEventListener('drop', drop);
        tbody.addEventListener('dragend', dragEnd);
    }

    function parseDateInput(val) {
        if (!val) return null;
        let str = val.trim().replace(/\s/g, '');
        if (!str) return null;
        let d = new Date(str);
        if (!isNaN(d.getTime()) && /^\d{4}-\d{1,2}-\d{1,2}$/.test(str)) return d;
        let parts = str.split(/[\.\/\-]/);
        if (parts.length === 1 && /^\d+$/.test(str)) {
            const num = str;
            if (num.length === 4) {
                const y = parseInt(num);
                if (y >= 1900 && y <= 2100) return new Date(y, 0, 1);
                const month = parseInt(num.slice(0, 1));
                const day = parseInt(num.slice(1));
                if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                    const now = new Date();
                    return new Date(now.getFullYear(), month - 1, day);
                }
            } else if (num.length === 6) {
                const y = parseInt(num.slice(0, 2));
                const m = parseInt(num.slice(2, 4));
                const day = parseInt(num.slice(4, 6));
                if (y >= 1 && y <= 99 && m >= 1 && m <= 12 && day >= 1 && day <= 31) {
                    const fullYear = 2000 + y;
                    return new Date(fullYear, m - 1, day);
                }
            } else if (num.length === 8) {
                const y = parseInt(num.slice(0, 4));
                const m = parseInt(num.slice(4, 6));
                const day = parseInt(num.slice(6, 8));
                if (y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && day >= 1 && day <= 31) {
                    return new Date(y, m - 1, day);
                }
            }
            return null;
        }
        let numbers = parts.map(p => parseInt(p)).filter(n => !isNaN(n));
        if (numbers.length === 0) return null;
        const now = new Date();
        const currentYear = now.getFullYear();
        if (numbers.length === 1) {
            const num = numbers[0];
            if (num > 12) {
                if (num < 100) return new Date(2000 + num, 0, 1);
                return new Date(num, 0, 1);
            } else {
                return new Date(currentYear, num - 1, 1);
            }
        } else if (numbers.length === 2) {
            let a = numbers[0], b = numbers[1];
            if (a > 12) {
                if (a < 100) a = 2000 + a;
                if (b >= 1 && b <= 12) return new Date(a, b - 1, 1);
                return null;
            } else {
                if (a >= 1 && a <= 12 && b >= 1 && b <= 31) return new Date(currentYear, a - 1, b);
                if (a >= 1 && a <= 12 && b > 31) {
                    if (b < 100) b = 2000 + b;
                    return new Date(b, a - 1, 1);
                }
                return null;
            }
        } else if (numbers.length === 3) {
            let y = numbers[0], m = numbers[1], day = numbers[2];
            if (y > 12) {
                if (y < 100) y = 2000 + y;
                if (y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && day >= 1 && day <= 31) return new Date(y, m - 1, day);
            } else {
                if (m >= 1 && m <= 31 && day < 100) {
                    const fullYear = 2000 + day;
                    if (fullYear >= 1900 && fullYear <= 2100 && y >= 1 && y <= 12 && m >= 1 && m <= 31) return new Date(fullYear, y - 1, m);
                }
                if (day > 1000 && y >= 1 && y <= 12 && m >= 1 && m <= 31) return new Date(day, y - 1, m);
                if (y >= 1 && y <= 12 && m >= 1 && m <= 31) return new Date(currentYear, y - 1, m);
            }
            return null;
        }
        return null;
    }

    window.formatPrice = function(el) { let val = parseFloat(el.value); if (!isNaN(val)) el.value = val.toFixed(2); };
    window.updateMatTotal = function() {
        const packEl = document.getElementById('matPackCount');
        const specEl = document.getElementById('matSpec');
        const totalEl = document.getElementById('matTotalQuantity');
        const unitEl = document.getElementById('matUnit');
        if (!packEl || !totalEl || !unitEl) return;
        const packCount = parseInt(packEl.value) || 1;
        const spec = (specEl && specEl.value) || '';
        const numMatch = spec.match(/^([\d.]+)/);
        const specNum = numMatch ? parseFloat(numMatch[1]) : 1;
        const total = packCount * specNum;
        const unit = unitEl.value || '';
        totalEl.value = total + ' ' + unit;
        calcAmount();
    };
    window.calcAmount = function() {
        const price = parseFloat(document.getElementById('matPrice').value) || 0;
        const packCount = parseInt(document.getElementById('matPackCount').value) || 1;
        const amount = price * packCount;
        document.getElementById('matAmount').value = amount.toFixed(2);
    };
    window.adjustPackCount = function(delta) {
        const packEl = document.getElementById('matPackCount');
        if (!packEl) return;
        let val = parseInt(packEl.value) || 1;
        val = Math.max(1, val + delta);
        packEl.value = val;
        updateMatTotal();
        calcAmount();
    };

    window.saveMaterial = function(event, editId) {
        event.preventDefault();
        const name = document.getElementById('matName').value.trim();
        const brand = document.getElementById('matBrand').value.trim();
        const category = document.getElementById('matCategory').value;
        const specification = document.getElementById('matSpec').value.trim();
        const unit = document.getElementById('matUnit').value;
        const price = parseFloat(document.getElementById('matPrice').value) || null;
        const packCount = parseInt(document.getElementById('matPackCount').value) || 1;
        const specStr = (document.getElementById('matSpec').value || '').trim();
        const specMatch = specStr.match(/^([\d.]+)/);
        const specNum = specMatch ? parseFloat(specMatch[1]) : 1;
        const totalNum = packCount * (specNum > 0 ? specNum : 1);
        const amount = price !== null ? price * packCount : null;

        const expiryInput = document.getElementById('matExpiry').value.trim();
        const openingInput = document.getElementById('matOpeningDate').value.trim();
        let expiryDate = '';
        if (expiryInput) {
            const d = parseDateInput(expiryInput);
            if (d) expiryDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            else { showToast('⚠️ 保质期日期格式错误，请重新输入', 'error'); return; }
        }
        let openingDate = '';
        if (openingInput) {
            const d = parseDateInput(openingInput);
            if (d) openingDate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            else { showToast('⚠️ 开封日期格式错误，请重新输入', 'error'); return; }
        }

        const nutrition = {
            calories: parseFloat(document.getElementById('matNutCalories').value) || null,
            protein: parseFloat(document.getElementById('matNutProtein').value) || null,
            fat: parseFloat(document.getElementById('matNutFat').value) || null,
            carbs: parseFloat(document.getElementById('matNutCarbs').value) || null,
            sodium: parseFloat(document.getElementById('matNutSodium').value) || null,
            calcium: parseFloat(document.getElementById('matNutCalcium').value) || null
        };

        if (!name) return showToast('请输入商品名称');

        if (editId) {
            const oldMat = findMaterialById(editId);
            if (oldMat) {
                const oldRemaining = getItemRemaining(oldMat);
                Object.assign(oldMat, { name, brand, category, specification, unit, price, packCount, totalQuantity: totalNum, amount, expiryDate, openingDate, nutrition });
                oldMat.remainingQuantity = oldRemaining;
                showToast('✅ 商品已更新', 'success');
            }
            setLastSelectedCategory(category);
            saveMaterials();
            clearDraft('material_' + editId);
            closeModal();
            renderAllPreserveScroll();
        } else {
            const newId = genId('m');
            materials.push({ id: newId, name, brand, category, specification, unit, price, packCount, totalQuantity: totalNum, amount, expiryDate, openingDate, nutrition, remainingQuantity: totalNum });
            showToast('✅ 商品已添加', 'success');
            setLastSelectedCategory(category);
            saveMaterials();
            clearDraft('material_new');
            closeModal();
            renderAllPreserveScroll();
        }
    };

    function getExpiryStatus(expiryDate) {
        if (!expiryDate) return { text: '未设置', cls: 'ok' };
        const now = new Date();
        const expiry = new Date(expiryDate);
        if (isNaN(expiry.getTime())) return { text: '无效日期', cls: 'ok' };
        const diff = expiry - now;
        if (diff < 0) {
            const days = Math.abs(Math.ceil(diff / (1000 * 60 * 60 * 24)));
            return { text: `已过期 ${days} 天`, cls: 'danger' };
        }
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        if (days > 365) {
            const years = Math.floor(days / 365);
            return { text: `还剩 ${years} 年`, cls: 'ok' };
        } else if (days > 60) {
            const months = Math.ceil(days / 30);
            return { text: `还剩 ${months} 个月`, cls: 'ok' };
        } else {
            return { text: `还剩 ${days} 天`, cls: days < 7 ? 'danger' : 'ok' };
        }
    }

    window.confirmAdjustRemaining = function(materialId) {
    const item = findMaterialById(materialId);
    if (!item) return;
    const mode = document.getElementById('adjustMode').value;
    const amount = parseFloat(document.getElementById('adjustAmount').value) || 0;
    if (amount < 0) { showToast('数量不能为负数', 'error'); return; }
    const currentRemaining = getItemRemaining(item);
    let newRemaining = currentRemaining;
    if (mode === 'add') newRemaining = currentRemaining + amount;
    else if (mode === 'subtract') newRemaining = currentRemaining - amount;
    else if (mode === 'set') newRemaining = amount;
    if (newRemaining < 0) { showToast('调整后数量不能为负数', 'error'); return; }

    item.remainingQuantity = newRemaining;
    saveMaterials();
    showToast('✅ 剩余数量已调整为 ' + newRemaining + ' ' + item.unit, 'success');

    closeModal();

    window._needRefreshAfterClose = true;

    setTimeout(() => {
        const modal = document.querySelector('#modalOverlay .modal');
        if (!modal) return;

        const fields = modal.querySelectorAll('.detail-field');
        for (const field of fields) {
            const label = field.querySelector('.label');

    window.sortMaterials = function(key) {
        if (currentSort.key === key) {
            if (currentSort.direction === 'asc') currentSort.direction = 'desc';
            else if (currentSort.direction === 'desc') currentSort.direction = 'none';
            else currentSort.direction = 'asc';
        } else {
            currentSort.key = key;
            currentSort.direction = 'asc';
        }
        if (currentSort.direction === 'none') {
            currentSort.key = null;
            currentSort.direction = 'none';
            updateSortIndicators();
            renderMaterials();
            return;
        }
        materials.sort((a, b) => {
            let valA, valB;
            if (key === 'name') { valA = (a.name || '').toLowerCase(); valB = (b.name || '').toLowerCase(); }
            else if (key === 'category') { valA = (a.category || '').toLowerCase(); valB = (b.category || '').toLowerCase(); }
            else if (key === 'stock') { valA = getItemRemaining(a); valB = getItemRemaining(b); }
            if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
            if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
            return 0;
        });
        saveMaterials();
        renderMaterials();
        updateSortIndicators();
    };

    function calcRecipeNutritionFromIngredients(ingredients) {
        let totalGrams = 0;
        let totalCal = 0, totalPro = 0, totalFat = 0, totalCar = 0, totalSod = 0, totalCalc = 0;
        let hasData = false;
        for (const ing of ingredients) {
            if (ing.isNewCategory) continue;
            if (!ing.category || ing.quantity <= 0) continue;
            let qtyInGrams = ing.quantity;
            if (ing.unit === 'kg') qtyInGrams = ing.quantity * 1000;
            else if (ing.unit === 'L') qtyInGrams = ing.quantity * getDensityForCategory(ing.category) * 1000;
            else if (ing.unit === 'ml') qtyInGrams = ing.quantity * getDensityForCategory(ing.category);
            else if (ing.unit !== 'g') continue;
            totalGrams += qtyInGrams;
            const items = materials.filter(m => m.category === ing.category);
            if (items.length === 0) continue;
            let countCal = 0, countPro = 0, countFat = 0, countCar = 0, countSod = 0, countCalc = 0;
            let avgCal = 0, avgPro = 0, avgFat = 0, avgCar = 0, avgSod = 0, avgCalc = 0;
            for (const mat of items) {
                const nut = mat.nutrition || {};
                if (nut.calories != null) { avgCal += nut.calories; countCal++; }
                if (nut.protein != null) { avgPro += nut.protein; countPro++; }
                if (nut.fat != null) { avgFat += nut.fat; countFat++; }
                if (nut.carbs != null) { avgCar += nut.carbs; countCar++; }
                if (nut.sodium != null) { avgSod += nut.sodium; countSod++; }
                if (nut.calcium != null) { avgCalc += nut.calcium; countCalc++; }
            }
            if (countCal + countPro + countFat + countCar + countSod + countCalc === 0) continue;
            if (countCal > 0) avgCal /= countCal;
            if (countPro > 0) avgPro /= countPro;
            if (countFat > 0) avgFat /= countFat;
            if (countCar > 0) avgCar /= countCar;
            if (countSod > 0) avgSod /= countSod;
            if (countCalc > 0) avgCalc /= countCalc;
            const factor = qtyInGrams / 100;
            if (avgCal > 0) { totalCal += avgCal * factor; hasData = true; }
            if (avgPro > 0) { totalPro += avgPro * factor; hasData = true; }
            if (avgFat > 0) { totalFat += avgFat * factor; hasData = true; }
            if (avgCar > 0) { totalCar += avgCar * factor; hasData = true; }
            if (avgSod > 0) { totalSod += avgSod * factor; hasData = true; }
            if (avgCalc > 0) { totalCalc += avgCalc * factor; hasData = true; }
        }
        if (!hasData || totalGrams <= 0) return null;
        return {
            calories: Math.round(totalCal / totalGrams * 100 * 10) / 10,
            protein: Math.round(totalPro / totalGrams * 100 * 10) / 10,
            fat: Math.round(totalFat / totalGrams * 100 * 10) / 10,
            carbs: Math.round(totalCar / totalGrams * 100 * 10) / 10,
            sodium: Math.round(totalSod / totalGrams * 100 * 10) / 10,
            calcium: Math.round(totalCalc / totalGrams * 100 * 10) / 10
        };
    }

    window.saveRecipe = async function(event, editId) {
        event.preventDefault();
        syncStepTextsFromDOM();
        const name = document.getElementById('recipeName').value.trim();
        const description = document.getElementById('recipeDesc').value.trim();
        const emoji = document.getElementById('recipeEmoji').value;
        if (!name) { showToast('请输入配方名称', 'error'); return; }
        const ingredients = _editIngs.filter(ing => !ing.isNewCategory && ing.category && ing.quantity > 0);
        if (ingredients.length === 0) { showToast('请至少添加一种有效材料', 'error'); return; }
        const steps = _editSteps.filter(s => s.text.trim().length > 0 || (s.images && s.images.length > 0));
        if (steps.length === 0) { showToast('请至少添加一个有效步骤', 'error'); return; }
        const finalImages = _editFinalImages || [];
        const recipeData = {
            name, description, ingredients, steps, emoji, finalImages,
            nutrition: { calories: null, protein: null, fat: null, carbs: null, sodium: null, calcium: null },
            createdAt: editId ? (recipes.find(r => r.id === editId)?.createdAt || Date.now()) : Date.now(),
            order: editId ? (recipes.find(r => r.id === editId)?.order || Date.now()) : Date.now()
        };
        if (editId) {
            const oldRecipe = recipes.find(r => r.id === editId);
            if (oldRecipe) {
                const oldImageIds = new Set([
                    ...(oldRecipe.finalImages || []),
                    ...(oldRecipe.steps || []).flatMap(s => s.images || [])
                ]);
                const newImageIds = new Set([
                    ...finalImages,
                    ...steps.flatMap(s => s.images || [])
                ]);
                for (const id of oldImageIds) {
                    if (!newImageIds.has(id)) deleteImage(id);
                }
                Object.assign(oldRecipe, recipeData);
                showToast('✅ 配方已更新', 'success');
            }
        } else {
            recipeData.id = genId('r');
            recipes.push(recipeData);
            showToast('✅ 配方已添加', 'success');
        }
        saveRecipes();
        clearDraft('recipe_' + (editId || 'new'));
        renderAllPreserveScroll();
        if (editId) {
            closeModal();
            setTimeout(() => viewRecipeDetail(editId, true), 50);
        } else {
            closeModal();
        }
    };

    function renderStepMaterials(stepMats, recipe) {
        if (!stepMats || stepMats.length === 0) return '';
        return stepMats.map(idx => {
            const ing = recipe.ingredients[idx];
            if (!ing) return '';
            const displayQty = ing.quantity * _detailServings;

    window.toggleStepMaterialCompleted = function(el) { el.classList.toggle('completed'); };

    function stepTimerTick(stepIdx, recipeId) {
        const key = recipeId + '_' + stepIdx;
        if (!stepTimers[key]) return;
        const timer = stepTimers[key];
        if (timer.state !== 'running') return;
        const elapsed = Math.floor((Date.now() - timer.startTime) / 1000);
        const remain = Math.max(0, timer.totalSeconds - elapsed);
        timer.remain = remain;
        updateStepTimerDisplay(recipeId, stepIdx);
        if (remain <= 0) {
            timer.state = 'done';
            clearInterval(timer.interval);
            showToast('⏰ 步骤 ' + (stepIdx + 1) + ' 计时完成！', 'success');
            updateStepTimerDisplay(recipeId, stepIdx);
        }
    }

    function updateStepTimerDisplay(recipeId, stepIdx) {
        const key = recipeId + '_' + stepIdx;
        const timer = stepTimers[key];
        if (!timer) return;
        const displayEl = document.querySelector(`.step-timer-display-${recipeId}-${stepIdx}`);
        const startBtn = document.querySelector(`.step-timer-start-${recipeId}-${stepIdx}`);
        const pauseBtn = document.querySelector(`.step-timer-pause-${recipeId}-${stepIdx}`);
        if (displayEl) {
            const mins = Math.floor(timer.remain / 60);
            const secs = timer.remain % 60;
            displayEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }
        if (startBtn) startBtn.disabled = (timer.state === 'running' || timer.state === 'done');
        if (pauseBtn) pauseBtn.disabled = (timer.state !== 'running');
    }

    window.startStepTimer = function(recipeId, stepIdx) {
        const key = recipeId + '_' + stepIdx;
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        const step = recipe.steps[stepIdx];
        if (!step) return;
        let timer = stepTimers[key];
        if (!timer) {
            const totalSec = (step.timerMinutes || 0) * 60;
            timer = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
            stepTimers[key] = timer;
        }
        if (timer.state === 'done' || timer.state === 'idle') timer.remain = timer.totalSeconds;
        if (timer.remain <= 0) { showToast('请设置计时时长', 'error'); return; }
        timer.state = 'running';
        timer.startTime = Date.now() - (timer.totalSeconds - timer.remain) * 1000;
        if (timer.interval) clearInterval(timer.interval);
        timer.interval = setInterval(() => stepTimerTick(stepIdx, recipeId), 1000);
        updateStepTimerDisplay(recipeId, stepIdx);
    };

    window.pauseStepTimer = function(recipeId, stepIdx) {
        const key = recipeId + '_' + stepIdx;
        const timer = stepTimers[key];
        if (!timer || timer.state !== 'running') return;
        timer.state = 'paused';
        if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
        updateStepTimerDisplay(recipeId, stepIdx);
    };

    window.resetStepTimer = function(recipeId, stepIdx) {
        const key = recipeId + '_' + stepIdx;
        const timer = stepTimers[key];
        if (!timer) return;
        if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
        timer.state = 'idle'; timer.remain = timer.totalSeconds;
        updateStepTimerDisplay(recipeId, stepIdx);
    };
