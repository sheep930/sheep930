let _detailRecipeId = null, _detailServings = 1;

async function renderStepImagesList(images, containerId, stepIndex) {
    const container = document.getElementById(containerId);
    if (!container) return;
    if (!images || images.length === 0) { container.innerHTML = ''; return; }
    let html = `<div class="step-images-list">`;
    for (let idx = 0; idx < images.length; idx++) {
        const url = await resolveImageUrl(images[idx]);
        html += `<div class="step-image-item" onclick="previewStepImage(${stepIndex}, ${idx})"><img src="${url}" loading="lazy"></div>`;
    }
    html += `</div>`;
    container.innerHTML = html;
    container.dataset.stepImages = JSON.stringify(images);
    container.dataset.stepIndex = stepIndex;
}

window.previewStepImage = function(stepIndex, imgIndex) {
    const containers = document.querySelectorAll('[data-step-images]');
    let images = null;
    for (const c of containers) {
        if (String(c.dataset.stepIndex) === String(stepIndex)) {
            try { images = JSON.parse(c.dataset.stepImages); } catch (e) {}
            break;
        }
    }
    if (!images || images.length === 0) return;
    _previewImages = images.slice();
    _previewIndex = Math.max(0, Math.min(imgIndex, images.length - 1));
    renderPreviewModal();
};

function renderStepMaterials(stepMats, recipe) {
    if (!stepMats || stepMats.length === 0) return '';
    const stepSet = new Set(stepMats);
    const ings = recipe.ingredients || [];
    return ings.map((ing, idx) => {
        if (!stepSet.has(idx)) return '';
        const displayQty = ing.quantity * _detailServings;
        const cat = ing.category;
        return `<span class="step-materials-display" data-cat="${escapeHtml(cat)}" onclick="toggleStepMaterialCompleted(this)">${escapeHtml(cat)} ${displayQty}${ing.unit}</span>`;
    }).filter(Boolean).join(' ');
}

window.toggleStepMaterialCompleted = function(el) { el.classList.toggle('completed'); };

// ---- 步骤计时器 ----
function stepTimerTick(stepIdx, recipeId) {
    const key = recipeId + '_' + stepIdx;
    if (!stepTimers[key]) return;
    const timer = stepTimers[key];
    if (timer.state !== 'running') return;
    const elapsed = Math.floor((Date.now() - timer.startTime) / 1000);
    const remain = Math.max(0, timer.totalSeconds - elapsed);
    timer.remain = remain;
    updateStepTimerDisplay(recipeId, stepIdx);
    if (remain <= 0) {
        timer.state = 'done';
        clearInterval(timer.interval);
        showToast('⏰ 步骤 ' + (stepIdx + 1) + ' 计时完成！', 'success');
        updateStepTimerDisplay(recipeId, stepIdx);
    }
}

function updateStepTimerDisplay(recipeId, stepIdx) {
    const key = recipeId + '_' + stepIdx;
    const timer = stepTimers[key];
    if (!timer) return;
    const displayEl = document.querySelector(`.step-timer-display-${recipeId}-${stepIdx}`);
    const startBtn = document.querySelector(`.step-timer-start-${recipeId}-${stepIdx}`);
    const pauseBtn = document.querySelector(`.step-timer-pause-${recipeId}-${stepIdx}`);
    if (displayEl) {
        const mins = Math.floor(timer.remain / 60);
        const secs = timer.remain % 60;
        displayEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }
    if (startBtn) startBtn.disabled = (timer.state === 'running' || timer.state === 'done');
    if (pauseBtn) pauseBtn.disabled = (timer.state !== 'running');
}

window.startStepTimer = function(recipeId, stepIdx) {
    const key = recipeId + '_' + stepIdx;
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;
    const step = recipe.steps[stepIdx];
    if (!step) return;
    let timer = stepTimers[key];
    if (!timer) {
        const totalSec = (step.timerMinutes || 0) * 60;
        timer = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
        stepTimers[key] = timer;
    }
    if (timer.state === 'done' || timer.state === 'idle') timer.remain = timer.totalSeconds;
    if (timer.remain <= 0) { showToast('请设置计时时长', 'error'); return; }
    timer.state = 'running';
    timer.startTime = Date.now() - (timer.totalSeconds - timer.remain) * 1000;
    if (timer.interval) clearInterval(timer.interval);
    timer.interval = setInterval(() => stepTimerTick(stepIdx, recipeId), 1000);
    updateStepTimerDisplay(recipeId, stepIdx);
};

window.pauseStepTimer = function(recipeId, stepIdx) {
    const key = recipeId + '_' + stepIdx;
    const timer = stepTimers[key];
    if (!timer || timer.state !== 'running') return;
    timer.state = 'paused';
    if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
    updateStepTimerDisplay(recipeId, stepIdx);
};

window.resetStepTimer = function(recipeId, stepIdx) {
    const key = recipeId + '_' + stepIdx;
    const timer = stepTimers[key];
    if (!timer) return;
    if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
    timer.state = 'idle'; timer.remain = timer.totalSeconds;
    updateStepTimerDisplay(recipeId, stepIdx);
};

// ---- 生成详情HTML ----
async function generateRecipeDetailHTML(recipeId) {
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return '';
    const details = recipe.ingredients.map((ing, originalIdx) => {
        const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
        const items = materials.filter(m => m.category === ing.category);
        return { ...ing, originalIdx, available: totalAvail, sufficient: totalAvail >= ing.quantity, items };
    });
    const allSufficient = details.every(d => d.sufficient);
    const status = allSufficient ? '可制作' : '材料不足';
    const statusCls = allSufficient ? 'can-make' : 'cannot-make';
    let totalWeight = 0;
    recipe.ingredients.forEach(ing => {
        const qty = parseFloat(ing.quantity) || 0;
        if (ing.unit === 'g') totalWeight += qty;
        else if (ing.unit === 'kg') totalWeight += qty * 1000;
        else if (ing.unit === 'ml') totalWeight += qty * getDensityForCategory(ing.category);
        else if (ing.unit === 'L') totalWeight += qty * getDensityForCategory(ing.category) * 1000;
    });
    const totalWeightText = totalWeight > 0 ? `总重量：约 ${totalWeight} g` : '';

    const groupedByTag = new Map();
    details.forEach(d => {
        const tag = (d.tag || '').trim() || '__default__';
        if (!groupedByTag.has(tag)) groupedByTag.set(tag, []);
        groupedByTag.get(tag).push(d);
    });
    const ingredientsHTML = Array.from(groupedByTag.entries()).map(([tag, group]) => {
        const titleHTML = tag === '__default__' ? '' : '<div class="ingredient-group-title">' + escapeHtml(tag) + '</div>';
        const itemsHTML = group.map(d => {
            const displayAmount = d.quantity * _detailServings;
            const itemCount = d.items.length;
            const btnDisabled = itemCount === 0 || d.available < d.quantity;
            return `<div class="detail-ingredient-item" data-cat="${escapeHtml(d.category)}" data-idx="${d.originalIdx}"><div class="ing-left"><span class="ing-name">${escapeHtml(d.category)}</span>${itemCount > 0 ? `<span class="ing-sub">(${itemCount}种商品)</span>` : '<span class="ing-sub" style="color:var(--text-muted);">无库存</span>'}</div><div class="ing-right"><span class="ing-amount">${displayAmount}</span><span class="ing-stock">${escapeHtml(d.unit)}</span><button class="btn-use" onclick="useMaterialByCategory('${recipe.id}','${escapeHtml(d.category)}',${d.quantity},'${d.unit}',${_detailServings})" ${btnDisabled ? 'disabled' : ''}>使用</button></div></div>`;
        }).join('');
        return titleHTML + itemsHTML;
    }).join('');

    const stepsCardsHTML = recipe.steps.map((s, i) => {
        const listId = 'stepList_' + i + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const stepMatsHTML = renderStepMaterials(s.materials, recipe);
        const matsHTML = stepMatsHTML ? `<div style="margin-top:6px;margin-bottom:4px;font-size:0.85rem;font-weight:500;color:var(--text-light);"> 材料：${stepMatsHTML}</div>` : '';
        const timerMinutes = s.timerMinutes || 0;
        const timerDisplay = timerMinutes > 0 ? `
            <div class="step-timer-wrap step-timer-${recipeId}-${i}">
                <span class="timer-label">⏱️</span>
                <div class="timer-controls">
                    <span class="timer-display step-timer-display-${recipeId}-${i}">00:00</span>
                    <button class="btn btn-primary btn-xs step-timer-start-${recipeId}-${i}" onclick="startStepTimer('${recipeId}', ${i})">开始</button>
                    <button class="btn btn-xs step-timer-pause-${recipeId}-${i}" onclick="pauseStepTimer('${recipeId}', ${i})" disabled>暂停</button>
                    <button class="btn btn-xs step-timer-reset-${recipeId}-${i}" onclick="resetStepTimer('${recipeId}', ${i})">重置</button>
                </div>
            </div>
        ` : '';
        const stepNum = toChineseNumber(i + 1);
        return `<div class="step-card" data-step-index="${i}"><div class="step-header"><span class="step-num-icon">${i + 1}</span><span class="step-num-text">步骤${stepNum}</span></div><div class="step-text">${escapeHtml(s.text)}</div>${matsHTML}<div id="${listId}" style="width:100%;"></div>${timerDisplay}</div>`;
    }).join('');

    const finalImageIds = recipe.finalImages || [];
    let imagesHTML = '';
    if (finalImageIds.length > 0) {

    } else {
        imagesHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
    }

    const per100 = calcRecipeNutritionFromIngredients(recipe.ingredients);
    let nutHTML = '';
    if (per100) {
        const rows = [
            ['能量', 'kJ', 'calories', per100.calories],
            ['蛋白质', 'g', 'protein', per100.protein],
            ['脂肪', 'g', 'fat', per100.fat],
            ['碳水化合物', 'g', 'carbs', per100.carbs],
            ['钠', 'mg', 'sodium', per100.sodium],
            ['钙', 'mg', 'calcium', per100.calcium]
        ];
        const totalGrams = totalWeight || 100;
        const portionGrams = totalGrams / (_detailServings || 1);
        const factor = portionGrams / 100;
        nutHTML = `<div style="margin-top:12px;"><div style="font-weight:700;color:var(--text);margin-bottom:4px;">📊 营养成分表</div>
            <table class="detail-nutrition-table" style="table-layout:fixed;">

                <tbody>${rows.map(row => {
                    const v100 = row[3];
                    const vPortion = (v100 != null) ? (v100 * factor) : null;
                    return `<tr><td>${row[0]}</td><td>${v100!=null ? v100+row[1] : '—'}</td><td>${vPortion!=null ? vPortion.toFixed(1)+row[1] : '—'}</td></tr>`;

    const nameHTML = `<span class="detail-emoji">${recipe.emoji||'📖'}</span> ${escapeHtml(recipe.name)}`;
    return `

        <div class="detail-recipe-desc">${escapeHtml(recipe.description)||'暂无描述'}</div>
        <span class="detail-status-badge ${statusCls}">${status}</span>
        <div class="detail-section-title"><div class="ing-title-group"><span>📦 用料</span></div><div class="servings-control"><label>份数</label><div class="servings-stepper"><input type="number" id="servingsInput" value="${_detailServings}" min="0.5" step="0.5" oninput="updateServings(this.value)" onchange="updateServings(this.value)"><div class="servings-step-btns"><button type="button" class="servings-step-btn" onclick="adjustServings(0.5)">▲</button><button type="button" class="servings-step-btn" onclick="adjustServings(-0.5)">▼</button></div></div></div></div>
        <div id="detailIngredientsList">${ingredientsHTML}</div>
        <div class="detail-ingredients-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
            <span class="total-weight">${totalWeightText}</span>
            <button class="btn btn-primary btn-sm" onclick="useAllMaterialsByCategory('${recipe.id}')">全部使用</button>
        </div>
        ${nutHTML}
        <div class="detail-steps-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;">📋 制作步骤</div><div id="detailStepsContainer">${stepsCardsHTML}</div></div>
        <div class="detail-final-images-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span id="detailFinalImagesCount">🖼️ 成品图 (${finalImageIds.length}张)</span><button class="btn btn-outline btn-sm" onclick="openFinalImageManager('${recipe.id}')">管理成品图</button></div><div id="detailFinalImagesArea">${imagesHTML}</div></div>

            <button class="btn btn-outline" onclick="closeModal(); setTimeout(function(){ openRecipeModal('${recipe.id}', true); }, 50);">编辑</button>

}

window.viewRecipeDetail = async function(recipeId, keepPosition) {
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;
    const inPlace = window._detailInPlace === true;
    window._detailInPlace = false;
    if (keepPosition && !inPlace) {
        const oldModal = document.querySelector('#modalOverlay .modal');
        if (oldModal) _detailModalScrollTop = oldModal.scrollTop;
    }
    _detailRecipeId = recipeId;
    _detailServings = keepPosition ? _detailServings : 1;
    const html = await generateRecipeDetailHTML(recipeId);
    if (inPlace) {
        replaceModalContent(html);
        const modal = document.querySelector('#modalOverlay .modal');
        if (modal) modal.scrollTop = 0;
    } else {
        openModal(html, false, 'recipeDetail_' + recipeId);
        if (keepPosition && _detailModalScrollTop) {
            setTimeout(() => {
                const modal = document.querySelector('#modalOverlay .modal');
                if (modal) modal.scrollTop = _detailModalScrollTop;
            }, 60);
        }
    }
    setTimeout(async () => {
        recipe.steps.forEach((s, i) => {
            const containers = document.querySelectorAll(`#detailStepsContainer .step-card[data-step-index="${i}"] [id^="stepList_${i}_"]`);
            if (containers.length > 0 && s.images && s.images.length > 0) {
                renderStepImagesList(s.images, containers[containers.length - 1].id, i);
            }
            const key = recipeId + '_' + i;
            if (!stepTimers[key]) {
                const totalSec = (s.timerMinutes || 0) * 60;
                stepTimers[key] = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
            }
            updateStepTimerDisplay(recipeId, i);
        });
        const finalContainer = document.getElementById('detailFinalImages');
        if (finalContainer && recipe.finalImages && recipe.finalImages.length > 0) {
            let imgsHtml = '';
            for (let i = 0; i < recipe.finalImages.length; i++) {
                const url = await resolveImageUrl(recipe.finalImages[i]);
                const label = recipe.finalImages.length > 1 ? `${i+1}/${recipe.finalImages.length}` : '';
                imgsHtml += `<div class="detail-thumb-item" onclick="previewFullImageByRecipe('${recipe.id}', ${i}, true)"><img src="${url}" loading="lazy">${label ? `<span class="thumb-counter">${label}</span>` : ''}</div>`;
            }
            finalContainer.innerHTML = imgsHtml;
        }
    }, 100);
};

// ---- 份数调整 ----
window.adjustServings = function(delta) {
    const input = document.getElementById('servingsInput');
    if (!input) return;
    let val = parseFloat(input.value) || 1;
    val = Math.max(0.5, Math.round((val + delta) * 2) / 2);
    input.value = val;
    updateServings(val);
};

window.updateServings = function(val) {
        const num = parseFloat(val) || 1;
        if (num < 0.1) return;
        _detailServings = num;
        if (_detailRecipeId) {
            const recipe = recipes.find(r => r.id === _detailRecipeId);
            if (!recipe) return;
            recipe.ingredients.forEach((ing, i) => {
                const displayAmount = ing.quantity * _detailServings;
                const amountEl = document.querySelectorAll('.detail-ingredient-item .ing-amount')[i];
                if (amountEl) amountEl.textContent = displayAmount;
            });
        let totalWeight = 0;
        recipe.ingredients.forEach(ing => {
            const qty = ing.quantity * _detailServings;
            if (ing.unit === 'g') totalWeight += qty;
            else if (ing.unit === 'kg') totalWeight += qty * 1000;
            else if (ing.unit === 'ml') totalWeight += qty * getDensityForCategory(ing.category);
            else if (ing.unit === 'L') totalWeight += qty * getDensityForCategory(ing.category) * 1000;
        });
        const weightEl = document.querySelector('.total-weight');
        if (weightEl) weightEl.textContent = totalWeight > 0 ? `总重量：约 ${totalWeight} g` : '';
        recipe.steps.forEach((s, i) => {
            if (s.materials && s.materials.length > 0) {
                const stepCard = document.querySelectorAll('#detailStepsContainer .step-card')[i];
                if (stepCard) {
                    const matsContainer = stepCard.querySelector('.step-materials-display')?.parentElement;
                    if (matsContainer) {
                        const matsHTML = renderStepMaterials(s.materials, recipe);
                        if (matsHTML) {
                            const oldSpans = matsContainer.querySelectorAll('.step-materials-display');
                            const completedStates = Array.from(oldSpans).map(sp => sp.classList.contains('completed'));
                            matsContainer.innerHTML = ' 材料：' + matsHTML;
                            const newSpans = matsContainer.querySelectorAll('.step-materials-display');
                            newSpans.forEach((sp, idx) => { if (completedStates[idx]) sp.classList.add('completed'); });
                        }
                    }
                }
            }
        });
    }
};

// ---- 使用材料（分类） ----
let _multiSelectState = null;
let _selectModalKey = null;

window.useMaterialByCategory = function(recipeId, category, quantity, unit, servings) {
    if (!requireLogin()) return;
    const need = quantity * servings;
    const items = materials.filter(m => m.category === category);
    const available = items.filter(item => getItemRemaining(item) > 0);
    if (available.length === 0) { showToast('⚠️ 没有「' + category + '」类库存', 'error'); return; }
    if (available.length === 1) {
        const item = available[0];
        const remaining = getItemRemaining(item);
        const remainingInTarget = convertToUnit(remaining, item.unit, unit, item.name);
        if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
        const actualUse = Math.min(need, remainingInTarget);
        const actualUseOriginal = convertToUnit(actualUse, unit, item.unit, item.name);
        const recipe = recipes.find(r => r.id === recipeId);
        const recipeName = recipe ? recipe.name : '直接使用';
        addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, recipeId);
        const msg = actualUse < need ? '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」（库存不足，已全部使用）' : '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」';
        showToast(msg, 'success');
        renderAllPreserveScroll();
        window._detailInPlace = true;
        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
        return;
    }
    _multiSelectState = { category, remainingNeed: need, unit, recipeId, excludeIds: [], recipeName: '' };
    _selectModalKey = null;
    showMultiSelectForRemaining();
};

// 选择弹窗辅助：首次用 openModal，同 key 后续用 replaceModalContent 避免栈增长
function openSelectModal(html, key) {
    const overlay = document.getElementById('modalOverlay');
    const modal = overlay.querySelector('.modal');
    if (_selectModalKey === key && modal) {
        modal.innerHTML = html;
        modal.scrollTop = 0;
    } else {
        openModal(html, false, key);
        _selectModalKey = key;
    }
}
function closeSelectModal() {
    if (_selectModalKey) {
        _selectModalKey = null;
        closeModal();
    }
}

function showMultiSelectForRemaining() {
    if (!_multiSelectState) return;
    const s = _multiSelectState;
    const need = s.remainingNeed;
    if (need <= 0) {
        showToast('✅「' + s.category + '」已使用完毕', 'success');
        _multiSelectState = null;
        closeSelectModal();
        renderAllPreserveScroll();
        window._detailInPlace = true;
        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
        return;
    }
    const items = materials.filter(m => m.category === s.category);
    const available = items.filter(item => getItemRemaining(item) > 0 && !s.excludeIds.includes(item.id));
    if (available.length === 0) {
        showToast('⚠️「' + s.category + '」已无可选商品，还差 ' + need + s.unit, 'error');
        _multiSelectState = null;
        closeSelectModal();
        renderAllPreserveScroll();
        window._detailInPlace = true;
        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
        return;
    }
    if (available.length === 1) {
        const item = available[0];
        const remaining = getItemRemaining(item);
        const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
        if (remainingInTarget <= 0) { s.excludeIds.push(item.id); showMultiSelectForRemaining(); return; }
        const actualUse = Math.min(s.remainingNeed, remainingInTarget);
        const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
        const recipe = recipes.find(r => r.id === s.recipeId);
        const recipeName = recipe ? recipe.name : '直接使用';
        addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId);
        s.remainingNeed -= actualUse;
        s.excludeIds.push(item.id);
        if (s.remainingNeed > 0) {
            showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
            showMultiSelectForRemaining();
        } else {
            showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」', 'success');
            _multiSelectState = null;
            closeSelectModal();
            renderAllPreserveScroll();
            window._detailInPlace = true;
        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
        }
        return;
    }
    let usedText = (s.excludeIds.length > 0) ? '<br><span style="color:var(--text-muted);font-size:0.9rem;">已选商品扣减后，还需 <strong>' + need + ' ' + s.unit + '</strong></span>' : '';
    let html = '<button class="close-btn" onclick="closeMultiSelectRemaining()">✕</button><h2>选择商品</h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">需要 <strong>' + need + ' ' + s.unit + '</strong> 的 <strong>' + escapeHtml(s.category) + '</strong>，请选择使用哪个商品：' + usedText + '</div><div style="max-height:400px;overflow-y:auto;">';
    available.forEach(item => {
        const rem = getItemRemaining(item);

        html += '<div class="item-select-card" style="background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:6px 0;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" onclick="selectItemForRemaining(\'' + item.id + '\')">' +
            '<div class="item-info"><span class="item-name">' + escapeHtml(item.name) + (item.brand ? ' · ' + escapeHtml(item.brand) : '') + '</span></div>' +
            '<div class="item-stock">剩余 ' + rem + ' ' + item.unit + '</div>' +
            (canUse ? '<span class="item-badge" style="background:var(--success);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">可用</span>' : '<span class="item-badge" style="background:#b87820;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">部分</span>') +
            '</div>';
    });
    html += '</div><div class="modal-actions"><button class="btn btn-ghost" onclick="finishMultiSelectRemaining()">完成选择</button></div>';
    openSelectModal(html, 'multiSelect');
}

window.selectItemForRemaining = function(itemId) {
    if (!_multiSelectState) return;
    const s = _multiSelectState;
    const item = findMaterialById(itemId);
    if (!item) { showToast('商品不存在', 'error'); return; }
    const remaining = getItemRemaining(item);
    if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
    const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
    if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
    const actualUse = Math.min(s.remainingNeed, remainingInTarget);
    const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
    const recipe = recipes.find(r => r.id === s.recipeId);
    const recipeName = recipe ? recipe.name : '直接使用';
    addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId);
    s.remainingNeed -= actualUse;
    s.excludeIds.push(item.id);
    if (s.remainingNeed <= 0) {
        showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」', 'success');
        _multiSelectState = null;
        closeSelectModal();
        renderAllPreserveScroll();
        window._detailInPlace = true;
        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 50);
    } else {
        showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
        showMultiSelectForRemaining();
    }
};

// ---- 全部使用（多商品选择） ----
let _allUseQueue = [], _allUseResults = [], _allUseSkipped = [], _allUseRecipeId = null, _allUseRecipeName = '';

window.useAllMaterialsByCategory = function(recipeId) {
    if (!requireLogin()) return;
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;
    showConfirm('确定要使用所有材料吗？多商品将逐个选择。', () => {
        _allUseQueue = []; _allUseResults = []; _allUseSkipped = []; _allUseRecipeId = recipeId; _allUseRecipeName = recipe.name;
        _selectModalKey = null;
        for (const ing of recipe.ingredients) {
            const items = materials.filter(m => m.category === ing.category);
            const available = items.filter(item => getItemRemaining(item) > 0);
            if (available.length === 0) { _allUseSkipped.push(ing.category); continue; }
            let totalAvail = 0;
            for (const item of available) totalAvail += convertToUnit(getItemRemaining(item), item.unit, ing.unit, item.name);
            if (totalAvail <= 0) { _allUseSkipped.push(ing.category); continue; }
            if (available.length === 1) {
                const item = available[0];
                const need = ing.quantity;
                const rem = getItemRemaining(item);
                const remInTarget = convertToUnit(rem, item.unit, ing.unit, item.name);
                const actualUse = Math.min(need, remInTarget);
                const actualUseOriginal = convertToUnit(actualUse, ing.unit, item.unit, item.name);
                _allUseResults.push({ id: item.id, name: item.name, usedOriginal: actualUseOriginal, unitOriginal: item.unit, used: actualUse, need: need, unit: ing.unit, amt: actualUse * getUnitPrice(item) });
            } else {
                _allUseQueue.push({ category: ing.category, available, need: ing.quantity, unit: ing.unit, excludeIds: [] });
            }
        }
        if (_allUseQueue.length === 0) { finishAllUse(); return; }
        showNextMultiSelect();
    }, () => {});
};

function showNextMultiSelect() {
    if (_allUseQueue.length === 0) { finishAllUse(); return; }
    const task = _allUseQueue[0];
    const available = task.available.filter(it => getItemRemaining(it) > 0 && !task.excludeIds.includes(it.id));
    if (available.length === 0) { if (task.need > 0) _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); showNextMultiSelect(); return; }
    task.available = available;
    const remaining = _allUseQueue.length;
    const usedCount = _allUseResults.length;
    let headerMsg = '需要 <strong>' + task.need + ' ' + task.unit + '</strong> 的 <strong>' + escapeHtml(task.category) + '</strong>，请选择使用哪个商品';
    if (task.excludeIds.length > 0) headerMsg += '<br><span style="font-size:0.9rem;color:var(--text-muted);">已选商品扣减后，还需 <strong>' + task.need + ' ' + task.unit + '</strong></span>';
    if (remaining > 1) headerMsg += '<br><span style="font-size:0.9rem;color:var(--text-muted);">（选完本分类后还有 ' + (remaining - 1) + ' 种材料需要选择）</span>';
    let html = '<button class="close-btn" onclick="skipMultiSelect()">✕</button><h2>选择商品<span style="font-family:Arial, \'Helvetica Neue\', sans-serif;">（' + (usedCount + 1) + '/' + (usedCount + _allUseQueue.length) + '）</span></h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">' + headerMsg + '</div><div style="max-height:400px;overflow-y:auto;">';
    available.forEach(item => {
        const rem = getItemRemaining(item);
        const remInTarget = convertToUnit(rem, item.unit, task.unit, item.name);
        const canUse = remInTarget >= task.need;
        html += '<div class="item-select-card" style="background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:6px 0;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" onclick="confirmMultiSelectItem(\'' + item.id + '\')">' +
            '<div class="item-info"><span class="item-name">' + escapeHtml(item.name) + (item.brand ? ' · ' + escapeHtml(item.brand) : '') + '</span></div>' +
            '<div class="item-stock">剩余 ' + rem + ' ' + item.unit + '</div>' +
            (canUse ? '<span class="item-badge" style="background:var(--success);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">可用</span>' : '<span class="item-badge" style="background:#b87820;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">部分</span>') +
            '</div>';
    });
    html += '</div><div class="modal-actions"><button class="btn btn-ghost" onclick="skipMultiSelect()">跳过此项</button><button class="btn btn-ghost" onclick="cancelAllUse()">取消全部</button></div>';
    openSelectModal(html, 'multiSelectAll');
}

window.confirmMultiSelectItem = function(itemId) {
    const task = _allUseQueue[0];
    if (!task) return;
    const item = findMaterialById(itemId);
    if (!item) { showToast('商品不存在', 'error'); return; }
    const remaining = getItemRemaining(item);
    if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
    const remInTarget = convertToUnit(remaining, item.unit, task.unit, item.name);
    if (remInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
    const actualUse = Math.min(task.need, remInTarget);
    const actualUseOriginal = convertToUnit(actualUse, task.unit, item.unit, item.name);
    _allUseResults.push({ id: item.id, name: item.name, usedOriginal: actualUseOriginal, unitOriginal: item.unit, used: actualUse, need: task.need, unit: task.unit, amt: actualUse * getUnitPrice(item) });
    task.need -= actualUse;
    task.excludeIds.push(item.id);
    if (task.need > 0) {
        const stillAvailable = task.available.filter(it => getItemRemaining(it) > 0 && !task.excludeIds.includes(it.id));
        if (stillAvailable.length === 0) { _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); }
        else { task.available = stillAvailable; showToast('✅ 使用了 ' + actualUse + task.unit + '「' + item.name + '」，还差 ' + task.need + task.unit, 'success'); showNextMultiSelect(); return; }
    } else {
        _allUseQueue.shift();
    }
    showNextMultiSelect();
};

window.skipMultiSelect = function() {
    if (_allUseQueue.length > 0) { _allUseSkipped.push(_allUseQueue[0].category); _allUseQueue.shift(); }
    showNextMultiSelect();
};

window.cancelAllUse = function() {
    _allUseQueue = []; _allUseResults = []; _allUseSkipped = [];
    closeSelectModal();
    renderAllPreserveScroll();
    showToast('已取消全部使用', '');
    window._detailInPlace = true;
    if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 60);
};

function finishAllUse() {
        const plan = _allUseResults;
        if (plan.length === 0) {
            _allUseQueue = []; _allUseResults = []; _allUseSkipped = [];
            closeSelectModal();
            renderAllPreserveScroll();
            showToast('❌ 无库存：所有材料均无可用库存', 'error');
            return;
        }
        plan.forEach(u => { addUsageLog(u.id, u.usedOriginal, u.unitOriginal, _allUseRecipeName, _allUseRecipeId); });
        const usedMsg = plan.map(u => '· ' + u.name + ' ' + u.used + u.unit + (u.used < u.need ? '（仅剩）' : '')).join('\n');
        let toastMsg = '✅ 已使用：\n' + usedMsg;
        if (_allUseSkipped.length > 0) toastMsg += '\n⚠️ 无库存：' + _allUseSkipped.join('、');
        showToast(toastMsg, 'success');
        closeSelectModal();
        renderAllPreserveScroll();
        window._detailInPlace = true;
        if (_allUseRecipeId) setTimeout(() => viewRecipeDetail(_allUseRecipeId, true), 80);
        _allUseQueue = []; _allUseResults = []; _allUseSkipped = [];
    }

    // 配方渲染
    function renderRecipes() {
        const searchEl = document.getElementById('recipeSearch');
        const filterEl = document.getElementById('recipeFilter');
        const searchTerm = ((searchEl && searchEl.value) || '').toLowerCase();
        const filterVal = filterEl ? filterEl.value : 'all';
        const grid = document.getElementById('recipesGrid');
        const emptyEl = document.getElementById('recipeEmpty');

        let filtered = recipes;
        if (searchTerm) {
            filtered = filtered.filter(r => r.name.toLowerCase().includes(searchTerm) || (r.description && r.description.toLowerCase().includes(searchTerm)));
        }
        if (filterVal === 'can-make') {
            filtered = filtered.filter(r => canMakeRecipe(r));
        }
        if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyEl.style.display = 'block';
            return;
        }
        emptyEl.style.display = 'none';

        grid.innerHTML = filtered.map(r => {
            const canMake = canMakeRecipe(r);
            const statusText = canMake ? '✅ 可制作' : '材料不足';
            const statusClass = canMake ? 'can-make' : 'cannot-make';
            const ingCount = r.ingredients ? r.ingredients.length : 0;
            const stepCount = r.steps ? r.steps.length : 0;
            const nut = calcRecipeNutritionFromIngredients(r.ingredients);
            let nutHTML = '';
            if (nut) {
                nutHTML = '<div class="recipe-nutrition">' +
                    '<div class="nutrition-item"><div class="nut-val">' + nut.calories + '</div><div class="nut-label">能量(kJ)</div></div>' +
                    '<div class="nutrition-item"><div class="nut-val">' + nut.protein + '</div><div class="nut-label">蛋白(g)</div></div>' +
                    '<div class="nutrition-item"><div class="nut-val">' + nut.fat + '</div><div class="nut-label">脂肪(g)</div></div>' +
                    '<div class="nutrition-item"><div class="nut-val">' + nut.carbs + '</div><div class="nut-label">碳水(g)</div></div>' +
                    '</div>';
            }
            return '<div class="recipe-card" onclick="viewRecipeDetail(\'' + r.id + '\', false)">' +
                '<h3><span class="recipe-emoji">' + (r.emoji || '📖') + '</span> ' + escapeHtml(r.name) + '</h3>' +

                nutHTML +

                '<button class="btn btn-success btn-xs" onclick="event.stopPropagation(); showFullscreenStepsById(\'' + r.id + '\')">制作</button>' +
                '<button class="btn btn-outline btn-xs" onclick="event.stopPropagation(); openRecipeModal(\'' + r.id + '\')">编辑</button>' +
                '<button class="btn btn-xs btn-delete" onclick="event.stopPropagation(); deleteRecipe(\'' + r.id + '\')" style="background:transparent;border:1px solid var(--danger);color:var(--danger);">删除</button>' +
                '</div></div>';
        }).join('');
    }

    function canMakeRecipe(recipe) {
        if (!recipe || !recipe.ingredients) return false;
        for (const ing of recipe.ingredients) {
            if (ing.isNewCategory) continue;
            const avail = getCategoryAvailableInUnit(ing.category, ing.unit);
            if (avail < ing.quantity) return false;
        }
        return true;
    }

    function calcRecipeNutritionFromIngredients(ingredients) {
        if (!ingredients || ingredients.length === 0) return null;
        let totalGrams = 0;
        let totalCal = 0, totalPro = 0, totalFat = 0, totalCar = 0, totalSod = 0, totalCalc = 0;
        let hasData = false;
        for (const ing of ingredients) {
            if (ing.isNewCategory) continue;
            if (!ing.category || ing.quantity <= 0) continue;
            let qtyInGrams = ing.quantity;
            if (ing.unit === 'kg') qtyInGrams = ing.quantity * 1000;
            else if (ing.unit === 'L') qtyInGrams = ing.quantity * getDensityForCategory(ing.category) * 1000;
            else if (ing.unit === 'ml') qtyInGrams = ing.quantity * getDensityForCategory(ing.category);
            else if (ing.unit !== 'g') continue;
            totalGrams += qtyInGrams;
            const items = materials.filter(m => m.category === ing.category);
            if (items.length === 0) continue;
            let countCal = 0, countPro = 0, countFat = 0, countCar = 0, countSod = 0, countCalc = 0;
            let avgCal = 0, avgPro = 0, avgFat = 0, avgCar = 0, avgSod = 0, avgCalc = 0;
            for (const mat of items) {
                const nut = mat.nutrition || {};
                if (nut.calories != null) { avgCal += nut.calories; countCal++; }
                if (nut.protein != null) { avgPro += nut.protein; countPro++; }
                if (nut.fat != null) { avgFat += nut.fat; countFat++; }
                if (nut.carbs != null) { avgCar += nut.carbs; countCar++; }
                if (nut.sodium != null) { avgSod += nut.sodium; countSod++; }
                if (nut.calcium != null) { avgCalc += nut.calcium; countCalc++; }
            }
            if (countCal + countPro + countFat + countCar + countSod + countCalc === 0) continue;
            if (countCal > 0) avgCal /= countCal;
            if (countPro > 0) avgPro /= countPro;
            if (countFat > 0) avgFat /= countFat;
            if (countCar > 0) avgCar /= countCar;
            if (countSod > 0) avgSod /= countSod;
            if (countCalc > 0) avgCalc /= countCalc;
            const factor = qtyInGrams / 100;
            if (avgCal > 0) { totalCal += avgCal * factor; hasData = true; }
            if (avgPro > 0) { totalPro += avgPro * factor; hasData = true; }
            if (avgFat > 0) { totalFat += avgFat * factor; hasData = true; }
            if (avgCar > 0) { totalCar += avgCar * factor; hasData = true; }
            if (avgSod > 0) { totalSod += avgSod * factor; hasData = true; }
            if (avgCalc > 0) { totalCalc += avgCalc * factor; hasData = true; }
        }
        if (!hasData || totalGrams <= 0) return null;
        return {
            calories: Math.round(totalCal / totalGrams * 100 * 10) / 10,
            protein: Math.round(totalPro / totalGrams * 100 * 10) / 10,
            fat: Math.round(totalFat / totalGrams * 100 * 10) / 10,
            carbs: Math.round(totalCar / totalGrams * 100 * 10) / 10,
            sodium: Math.round(totalSod / totalGrams * 100 * 10) / 10,
            calcium: Math.round(totalCalc / totalGrams * 100 * 10) / 10
        };
    }

    let _draggingLog = null;
    window.startLogDrag = function(event, materialId, timestamp) {

    window.dropLogToGroup = function(event, gi) {
        event.preventDefault();
        if (!_draggingLog) return;
        const groups = window._logGroups || [];
        const target = groups[gi];
        if (!target) { _draggingLog = null; return; }
        const log = usageLogs.find(u => u.materialId === _draggingLog.materialId && u.timestamp === _draggingLog.timestamp);
        _draggingLog = null;
        if (!log) return;
        if ((log.recipeName || '直接使用') === target.recipeName) return;
        log.recipeName = target.recipeName;
        saveUsageLogsAndSync();
        renderLogs();
    };

    function renderLogs() {
        const container = document.getElementById('logsList');
        if (!container) return;
        let filtered = [...usageLogs];
        if (logFilters.material) {
            const searchTerm = logFilters.material;
            filtered = filtered.filter(u => {
                if (u.materialName.toLowerCase().includes(searchTerm)) return true;
                const mat = findMaterialById(u.materialId);
                if (mat && mat.category && mat.category.toLowerCase().includes(searchTerm)) return true;
                return false;
            });
        }
        if (logFilters.recipe) filtered = filtered.filter(u => u.recipeName.toLowerCase().includes(logFilters.recipe));
        if (logFilters.dateFrom) { const from = new Date(logFilters.dateFrom); from.setHours(0,0,0,0); filtered = filtered.filter(u => new Date(u.timestamp) >= from); }
        if (logFilters.dateTo) { const to = new Date(logFilters.dateTo); to.setHours(23,59,59,999); filtered = filtered.filter(u => new Date(u.timestamp) <= to); }
        filtered.sort((a, b) => b.timestamp - a.timestamp);
        let totalAmount = 0;
        const recipeMap = {};
        filtered.forEach(u => { const amt = u.amountUsed || 0; totalAmount += amt; const key = u.recipeName || '直接使用'; recipeMap[key] = (recipeMap[key] || 0) + amt; });
        document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);
        const recipeSummaryEl = document.getElementById('recipeSummary');
        const recipeKeys = Object.keys(recipeMap);
        if (recipeKeys.length === 0) recipeSummaryEl.innerHTML = '<span style="color:var(--text-muted);">暂无数据</span>';
        else recipeSummaryEl.innerHTML = recipeKeys.map(k => '<span class="rs-item">' + escapeHtml(k) + ': ¥' + recipeMap[k].toFixed(2) + '</span>').join('');
        if (filtered.length === 0) container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暂无匹配记录</p></div>';
        else {
            const recipeGroups = new Map();
            filtered.forEach(log => {
                const rn = log.recipeName || '直接使用';
                if (!recipeGroups.has(rn)) recipeGroups.set(rn, []);
                recipeGroups.get(rn).push(log);
            });
            const TWO_HOURS = 2 * 3600 * 1000;
            const batches = [];
            for (const [rn, logs] of recipeGroups) {
                logs.sort((a, b) => b.timestamp - a.timestamp);
                let currentBatch = null;
                for (const log of logs) {
                    if (!currentBatch || (currentBatch.lastTimestamp - log.timestamp) > TWO_HOURS) {
                        currentBatch = { recipeName: rn, timestamp: log.timestamp, lastTimestamp: log.timestamp, logs: [], totalAmount: 0 };
                        batches.push(currentBatch);
                    }
                    currentBatch.logs.push(log);
                    currentBatch.totalAmount += (log.amountUsed || 0);
                    currentBatch.lastTimestamp = log.timestamp;
                }
            }
            const groups = batches;
            groups.sort((a, b) => b.timestamp - a.timestamp);
            window._logGroups = groups;
            container.innerHTML = groups.map((g, gi) => {
                const itemsHTML = g.logs.map(log => {
                    return '<div class="log-item" draggable="true" ondragstart="startLogDrag(event, \'' + log.materialId + '\', ' + log.timestamp + ')">' +
                        '<div class="log-left">' +
                        '<span class="log-name">' + escapeHtml(log.materialName) + '</span>' +
                        '<span class="log-detail">' + log.quantity + ' ' + escapeHtml(log.unit) + '</span>' +
                        '<span class="log-amount">¥' + (log.amountUsed || 0).toFixed(2) + '</span>' +
                        '</div>' +
                        '<button class="btn btn-outline btn-xs" style="min-width:44px;padding:4px 12px;font-size:0.7rem;min-height:28px;" onclick="restoreLog(\'' + log.materialId + '\', ' + log.timestamp + ')">还原</button>' +
                        '</div>';
                }).join('');
                const dateStr = new Date(g.timestamp).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                return '<div class="log-group">' +
                    '<div class="log-group-title" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px 14px;" ondragover="event.preventDefault(); this.classList.add(\'img-drag-over\');" ondragleave="this.classList.remove(\'img-drag-over\');" ondrop="event.preventDefault(); this.classList.remove(\'img-drag-over\'); dropLogToGroup(event, ' + gi + ')">' +
                    '<div style="display:flex;align-items:center;gap:6px;line-height:1.4;"><span class="log-group-emoji" style="font-size:1rem;line-height:1.4;">🍰</span><span style="font-size:1.2rem;font-weight:700;color:var(--primary-dark);line-height:1.4;">' + escapeHtml(g.recipeName) + '</span><span style="margin-left:auto;color:var(--text-muted);font-size:0.72rem;font-weight:400;line-height:1.4;white-space:nowrap;">' + dateStr + '</span></div>' +
                    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span style="font-size:0.85rem;color:var(--text-light);font-weight:600;line-height:1.4;">用料 ' + g.logs.length + ' 项 · ¥' + g.totalAmount.toFixed(2) + '</span><button class="btn btn-outline btn-xs" onclick="restoreLogGroup(' + gi + ')" style="min-width:44px;padding:4px 12px;font-size:0.7rem;min-height:28px;margin-left:auto;flex-shrink:0;">还原</button></div>' +
                    '</div>' +
                    '<div class="log-group-body">' + itemsHTML + '</div></div>';
            }).join('');
        }
    }

    window.restoreLog = function(materialId, timestamp) {

        if (!log) return;
        showConfirm('确定要还原此条记录吗？将把 ' + log.quantity + ' ' + log.unit + ' 加回 ' + log.materialName + '。', () => {

            renderAllPreserveScroll();
        }, () => {});

    window.restoreLogGroup = function(groupIndex) {
        if (!requireLogin()) return;
        const groups = window._logGroups || [];
        const group = groups[groupIndex];
        if (!group || !group.logs || group.logs.length === 0) return;
        showConfirm('确定要还原这一组记录吗？将把 ' + group.logs.length + ' 条记录的用量加回库存。', () => {

    function bindRecycleLongPress() {
        const PRESS_MS = 600;
        const rows = document.querySelectorAll('.recycle-row');
        rows.forEach(row => {
            let timer = null, triggered = false;
            const start = (e) => {
                if (e.target.closest('button')) return;
                triggered = false;
                timer = setTimeout(() => {
                    triggered = true;
                    const detailSpan = row.querySelector('.recycle-detail');
                    const txt = detailSpan ? detailSpan.textContent : '';
                    if (txt) showToast(txt, 'success', true);
                }, PRESS_MS);
            };
            const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
            row.addEventListener('touchstart', start, { passive: true });
            row.addEventListener('touchend', cancel);
            row.addEventListener('touchmove', cancel);
            row.addEventListener('mousedown', start);
            row.addEventListener('mouseup', cancel);
            row.addEventListener('mouseleave', cancel);
            row.addEventListener('click', (e) => {
                if (triggered) { e.preventDefault(); e.stopPropagation(); triggered = false; }
            });
        });
    }

        } else if (item.type === 'recipe') {
            recipes.push(item.data);
            saveRecipesAndSync();
        } else if (item.type === 'category') {
            CATEGORIES.push(item.data.name);
            saveCategoriesLocal();

        recycleBin.splice(index, 1);
        saveRecycleBin();
        showToast('✅ 已还原');

    window.importData = function() {
        if (!requireLogin()) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data.materials)) { materials = data.materials; saveMaterialsLocal(); }
                    if (Array.isArray(data.recipes)) { recipes = data.recipes; saveRecipesLocal(); }
                    if (Array.isArray(data.usageLogs)) { usageLogs = data.usageLogs; saveUsageLogsLocal(); }
                    if (Array.isArray(data.categories) && data.categories.length) { CATEGORIES = data.categories; saveCategoriesLocal(); }
                    showToast('✅ 数据已导入', 'success');
                    renderAllPreserveScroll();
                } catch (err) {
                    showToast('❌ 导入失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        };
        input.click();
    };

    function renderGallery() {
        const container = document.getElementById('galleryContainer');
        if (!container) return;
        const groups = [];
        for (const r of recipes) {
            if (r.finalImages && r.finalImages.length > 0) {
                groups.push({ id: r.id, name: r.name, emoji: r.emoji || '📖', images: r.finalImages });
            }
        }
        if (groups.length === 0) {
            container.innerHTML = '<div class="gallery-empty"><span class="empty-icon">🖼️</span><p>暂无成品图，添加配方时上传吧</p></div>';
            return;
        }
        const maxDisplay = 8;
        let html = '';
        for (const g of groups) {
            const total = g.images.length;
            const showMore = total > maxDisplay;
            const displayImages = showMore ? g.images.slice(0, maxDisplay) : g.images;
            html += '<div class="gallery-group" style="margin-bottom:24px;">' +
                '<div class="gallery-group-title" style="font-weight:700;color:var(--primary-dark);margin-bottom:8px;font-size:1rem;">' + escapeHtml(g.emoji) + ' ' + escapeHtml(g.name) + ' (' + total + '张)</div>' +
                '<div class="gallery-grid">';
            for (let i = 0; i < displayImages.length; i++) {
                const counter = total > 1 ? (i + 1) + '/' + total : '';
                const isLastAndMore = showMore && i === maxDisplay - 1;
                const moreBadge = isLastAndMore ? '<span class="gallery-more-badge">+' + (total - maxDisplay) + '</span>' : '';
                html += '<div class="gallery-item" data-recipe-id="' + g.id + '" data-idx="' + i + '" onclick="previewGalleryGroupImage(\'' + g.id + '\',' + i + ')">' +
                    '<div class="gallery-img-wrap"><img src="" alt="成品图" loading="lazy" style="display:none;"><span class="gallery-img-ph" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">加载中</span>' +
                    (counter ? '<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;padding:0 8px;border-radius:12px;font-size:0.6rem;font-weight:600;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);line-height:1.6;z-index:5;">' + counter + '</span>' : '') +
                    moreBadge +
                    '</div></div>';
            }
            html += '</div></div>';
        }
        container.innerHTML = html;
        container.querySelectorAll('.gallery-item[data-recipe-id]').forEach(el => {
            const recipeId = el.dataset.recipeId;
            const idx = parseInt(el.dataset.idx);
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe || !recipe.finalImages) return;
            const ref = recipe.finalImages[idx];
            resolveImageUrl(ref).then(url => {
                if (url) {
                    const img = el.querySelector('img');
                    const ph = el.querySelector('.gallery-img-ph');
                    if (img) { img.src = url; img.style.display = 'block'; }
                    if (ph) ph.style.display = 'none';
                }
            }).catch(() => {
                const ph = el.querySelector('.gallery-img-ph');
                if (ph) ph.textContent = '加载失败';
            });
        });
    }

    // ============================================================

    // ============================================================
    let _pvScale = 1, _pvTx = 0, _pvTy = 0;

    function renderPreviewModal() {
        if (!_previewImages || _previewImages.length === 0) return;
        _pvScale = 1; _pvTx = 0; _pvTy = 0;
        const slides = _previewImages.map((url, i) => '<div class="ios-preview-slide" data-idx="' + i + '"><img src="' + url + '" alt=""></div>').join('');
        const html = '<div class="ios-preview-stage" id="previewStage">' +
            '<div class="ios-preview-counter" id="previewCounter">' + (_previewIndex + 1) + ' / ' + _previewImages.length + '</div>' +

    function bindPreviewGestures() {
        const stage = document.getElementById('previewStage');
        const track = document.getElementById('previewTrack');
        if (!stage || !track) return;
        const stageWidth = stage.clientWidth || window.innerWidth;
        const slideWidth = stageWidth;
        const stride = stageWidth;
        let cur = _previewIndex;
        _pvScale = 1; _pvTx = 0; _pvTy = 0;

        function currentImg() {
            const slide = track.querySelector('.ios-preview-slide[data-idx="' + cur + '"]');
            return slide ? slide.querySelector('img') : null;
        }
        function targetX(idx) { return -idx * stride; }
        function applyTrack() {
            track.style.transform = 'translateX(' + targetX(cur) + 'px)';
        }
        function applyZoom(img) {
            if (img) img.style.transform = 'translate(' + _pvTx + 'px,' + _pvTy + 'px) scale(' + _pvScale + ')';
        }
        function resetZoom() {
            _pvScale = 1; _pvTx = 0; _pvTy = 0;
            track.querySelectorAll('.ios-preview-slide img').forEach(function(im) { im.style.transition = 'none'; im.style.transform = ''; });
        }
        function updateCounter() {
            const counter = document.getElementById('previewCounter');
            if (counter) counter.textContent = (_previewIndex + 1) + ' / ' + _previewImages.length;
        }
        function clampPv() {
            if (_pvScale <= 1) { _pvScale = 1; _pvTx = 0; _pvTy = 0; return; }
            const maxT = 240 * _pvScale;
            _pvTx = Math.max(-maxT, Math.min(maxT, _pvTx));
            _pvTy = Math.max(-maxT, Math.min(maxT, _pvTy));
        }

        track.style.transition = 'none';
        applyTrack();
        resetZoom();

        let startX = 0, startY = 0, startTrackPos = 0;
        let startDist = 0;
        let pinchStartScale = 1, pinchStartTx = 0, pinchStartTy = 0, pinchMidX = 0, pinchMidY = 0;
        let mode = 'none';
        let lastDx = 0, lastDy = 0;
        let panImg = null, panStartTx = 0, panStartTy = 0;

        stage.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startTrackPos = targetX(cur);
                panImg = currentImg();
                panStartTx = _pvTx; panStartTy = _pvTy;
                lastDx = 0; lastDy = 0;
                mode = 'none';
                track.style.transition = 'none';
                if (panImg) panImg.style.transition = 'none';
            } else if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                startDist = Math.hypot(dx, dy);
                pinchStartScale = _pvScale; pinchStartTx = _pvTx; pinchStartTy = _pvTy;
                pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                mode = 'pinch';
                if (panImg) panImg.style.transition = 'none';
            }
        }, { passive: false });

        stage.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if (e.touches.length === 2) {
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const dist = Math.hypot(dx, dy);
                if (startDist > 0) {
                    _pvScale = Math.max(1, Math.min(4, pinchStartScale * (dist / startDist)));
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    _pvTx = pinchStartTx + (midX - pinchMidX);
                    _pvTy = pinchStartTy + (midY - pinchMidY);
                    applyZoom(panImg);
                }
                mode = 'pinch';
            } else if (e.touches.length === 1) {
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                lastDx = dx; lastDy = dy;
                if (_pvScale > 1.01) {
                    mode = 'pan';
                    _pvTx = panStartTx + dx;
                    _pvTy = panStartTy + dy;
                    applyZoom(panImg);
                } else {
                    if (mode === 'none') {
                        mode = Math.abs(dx) > Math.abs(dy) ? 'swipe-h' : 'swipe-v';
                    }
                    if (mode === 'swipe-h') {
                        track.style.transform = 'translateX(' + (startTrackPos + dx) + 'px)';
                    } else if (mode === 'swipe-v') {
                        track.style.transform = 'translateX(' + startTrackPos + 'px) translateY(' + dy + 'px)';
                        stage.style.background = 'rgba(0,0,0,' + Math.max(0.4, 1 - Math.abs(dy) / 600).toFixed(3) + ')';
                    }
                }
            }
        }, { passive: false });

        stage.addEventListener('touchend', function(e) {
            if (mode === 'pinch') {
                clampPv();
                if (panImg) { panImg.style.transition = 'transform 0.25s ease'; applyZoom(panImg); }
                mode = 'none';
                return;
            }
            if (mode === 'pan') {
                clampPv();
                if (panImg) { panImg.style.transition = 'transform 0.25s ease'; applyZoom(panImg); }
                mode = 'none';
                return;
            }
            if (mode === 'swipe-h') {
                const th = 60;
                track.style.transition = 'transform 0.25s ease';
                if (lastDx < -th && cur < _previewImages.length - 1) {
                    cur++; _previewIndex = cur; resetZoom();
                } else if (lastDx > th && cur > 0) {
                    cur--; _previewIndex = cur; resetZoom();
                }
                applyTrack();
                updateCounter();
                mode = 'none';
                return;
            }
            if (mode === 'swipe-v') {
                const th = 100;
                track.style.transition = 'transform 0.25s ease';
                if (lastDy > th) {
                    track.style.transform = 'translateX(' + targetX(cur) + 'px) translateY(110%)';
                    stage.style.transition = 'opacity 0.25s ease';
                    stage.style.opacity = '0';
                    setTimeout(function() { closeModal(); }, 200);
                } else {
                    applyTrack();
                    stage.style.background = '#000';
                }
                mode = 'none';
                return;
            }
            mode = 'none';
        }, { passive: false });
    }

    window.switchTab = function(tabName) {
        // 隐藏所有面板
        document.querySelectorAll('.panel').forEach(function(panel) {
            panel.classList.remove('active');
        });
        // 显示目标面板
        const targetPanel = document.getElementById('panel-' + tabName);
        if (targetPanel) {
            targetPanel.classList.add('active');
        }
        // 更新导航标签状态
        document.querySelectorAll('.nav-tab').forEach(function(tab) {
            tab.classList.remove('active');
            if (tab.dataset.panel === tabName) {
                tab.classList.add('active');
            }
        });
        // 触发对应渲染
        if (tabName === 'dashboard') renderDashboard();
        else if (tabName === 'materials') renderMaterials();
        else if (tabName === 'recipes') renderRecipes();
        else if (tabName === 'gallery') renderGallery();
        else if (tabName === 'logs') renderLogs();
    };

    // 拖拽事件占位（避免报错）
    // ============================================================
    function bindMaterialDragEvents() {
        // 简单占位，实际拖拽由 HTML 的 draggable 和事件驱动
        const tbody = document.getElementById('materialTableBody');
        if (!tbody) return;
        let dragItem = null;
        tbody.addEventListener('dragstart', function(e) {
            const tr = e.target.closest('tr');
            if (!tr) return;
            dragItem = tr;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', tr.dataset.id || '');
            tr.style.opacity = '0.5';
        });
        tbody.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        tbody.addEventListener('drop', function(e) {
            e.preventDefault();
            if (!dragItem) return;
            const target = e.target.closest('tr');
            if (!target || target === dragItem) { dragItem = null; return; }
            const idA = dragItem.dataset.id;
            const idB = target.dataset.id;
            const idxA = materials.findIndex(m => m.id === idA);
            const idxB = materials.findIndex(m => m.id === idB);
            if (idxA < 0 || idxB < 0) { dragItem = null; return; }
            const temp = materials[idxA];
            materials[idxA] = materials[idxB];
            materials[idxB] = temp;
            saveMaterialsLocal();
            renderMaterials();
            dragItem.style.opacity = '';
            dragItem = null;
        });
        tbody.addEventListener('dragend', function() {
            if (dragItem) { dragItem.style.opacity = ''; dragItem = null; }
        });
    }

    function bindRecipeDragEvents() {
        // 配方的拖拽排序（简单占位，通过网格拖拽实现）
        const grid = document.getElementById('recipesGrid');
        if (!grid) return;
        let dragItem = null;
        grid.addEventListener('dragstart', function(e) {
            const card = e.target.closest('.recipe-card');
            if (!card) return;
            dragItem = card;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', card.dataset.recipeId || '');
            card.style.opacity = '0.5';
        });
        grid.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        grid.addEventListener('drop', function(e) {
            e.preventDefault();
            if (!dragItem) return;
            const target = e.target.closest('.recipe-card');
            if (!target || target === dragItem) { dragItem = null; return; }
            const idA = dragItem.dataset.recipeId;
            const idB = target.dataset.recipeId;
            const idxA = recipes.findIndex(r => r.id === idA);
            const idxB = recipes.findIndex(r => r.id === idB);
            if (idxA < 0 || idxB < 0) { dragItem = null; return; }
            const temp = recipes[idxA];
            recipes[idxA] = recipes[idxB];
            recipes[idxB] = temp;
            saveRecipesLocal();
            renderRecipes();
            dragItem.style.opacity = '';
            dragItem = null;
        });
        grid.addEventListener('dragend', function() {
            if (dragItem) { dragItem.style.opacity = ''; dragItem = null; }
        });
        // 让recipe-card可拖拽
        grid.querySelectorAll('.recipe-card').forEach(card => {
            card.draggable = true;
            card.dataset.recipeId = card.querySelector('[onclick^="viewRecipeDetail"]')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || '';
        });
        // 重新渲染时重新绑定
        const observer = new MutationObserver(() => {
            grid.querySelectorAll('.recipe-card').forEach(card => {
                if (!card.draggable) {
                    card.draggable = true;
                    card.dataset.recipeId = card.querySelector('[onclick^="viewRecipeDetail"]')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || '';
                }
            });
        });
        observer.observe(grid, { childList: true, subtree: true });
    }

    // ---- 归集 GitHub 仓库中未被引用的图片到 images/未使用的图片/ ----
    window.collectUnusedImages = async function() {
        if (!requireLogin()) return;
        showToast('⏳ 正在扫描云端图片...', '');
        try {
            const treeUrl = 'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/git/trees/' + CONFIG.branch + '?recursive=1';
            const treeRes = await fetch(treeUrl, { headers: { 'Authorization': 'Bearer ' + githubToken } });
            if (!treeRes.ok) throw new Error('获取文件树失败（HTTP ' + treeRes.status + '）');
            const treeData = await treeRes.json();
            const imageBlobs = (treeData.tree || []).filter(f => f.type === 'blob' && f.path.startsWith('images/') && !f.path.includes('未使用的图片'));
            const usedNames = new Set();
            const pushRef = (u) => {
                if (!u || u.startsWith('data:') || u.startsWith('local:')) return;
                const name = u.split('?')[0].split('/').pop();
                if (name) usedNames.add(name);
            };
            recipes.forEach(r => {
                (r.finalImages || []).forEach(pushRef);
                (r.steps || []).forEach(s => (s.images || []).forEach(pushRef));
            });
            const unused = imageBlobs.filter(f => !usedNames.has(f.path.split('/').pop()));
            if (unused.length === 0) { showToast('✅ 没有未使用的图片', 'success'); return; }
            showConfirm('找到 ' + unused.length + ' 张未使用的图片，将收集到「images/未使用的图片/」文件夹。是否继续？', async () => {
                let moved = 0, failed = 0;
                for (const f of unused) {
                    try {
                        const name = f.path.split('/').pop();
                        const encPath = f.path.split('/').map(encodeURIComponent).join('/');
                        const encNewPath = ('images/未使用的图片/' + name).split('/').map(encodeURIComponent).join('/');
                        const getRes = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + encPath, { headers: { 'Authorization': 'Bearer ' + githubToken } });
                        if (!getRes.ok) throw new Error('读取失败');
                        const fileInfo = await getRes.json();
                        const putRes = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + encNewPath, {
                            method: 'PUT',
                            headers: { 'Authorization': 'Bearer ' + githubToken, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: '归集未使用图片 ' + name, content: fileInfo.content, branch: CONFIG.branch })
                        });
                        if (!putRes.ok) throw new Error('移动失败');
                        const delRes = await fetch('https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo + '/contents/' + encPath, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + githubToken, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: '移除已归集图片 ' + name, sha: fileInfo.sha, branch: CONFIG.branch })
                        });
                        if (!delRes.ok) throw new Error('删除失败');
                        moved++;
                    } catch (err) { console.error('归集失败:', f.path, err); failed++; }
                }
                showToast('✅ 已归集 ' + moved + ' 张' + (failed > 0 ? '，失败 ' + failed + ' 张' : ''), moved > 0 ? 'success' : 'error');
            }, () => {});
        } catch (err) {
            showToast('❌ 扫描失败：' + err.message, 'error');
        }
    };
