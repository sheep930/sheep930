                <button class="btn btn-outline" style="flex:1;padding:10px 8px;min-width:0;" onclick="addFinalImageFromManager()">+ 添加成品图</button>
                <button class="btn btn-primary" style="flex:1;padding:10px 8px;min-width:0;" onclick="saveFinalImageManager()">保存</button>
                <button class="btn btn-ghost" style="flex:1;padding:10px 8px;min-width:0;" onclick="closeFinalImageManager()">取消</button>
            </div>`;
        openModal(html, false, 'finalImageManager_' + recipeId);
        bindMgrDragSort();
    };

    window.closeFinalImageManager = function() {
        _mgrRecipeId = null;
        _mgrFinalImages = [];
        closeModal();
    };

    async function buildMgrGridHTML() {
        if (!_mgrFinalImages || _mgrFinalImages.length === 0) {
            return '<div style="grid-column:1/-1;text-align:center;padding:30px 16px;"><div style="font-size:2.2rem;margin-bottom:8px;">🖼️</div><p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:14px;">还没有成品图，点击下方按钮或拖拽图片到此处上传</p></div>';
        }
        const items = [];
        for (let i = 0; i < _mgrFinalImages.length; i++) {
            const url = await resolveImageUrl(_mgrFinalImages[i]);
            items.push(`<div class="mgr-img-card" draggable="true" data-idx="${i}" onclick="previewFullImageByMgr(${i})"><img src="${url}" alt="成品图 ${i+1}"><span class="mgr-order-badge">${i+1}</span><div class="mgr-actions"><button class="mgr-act-btn del" onclick="event.stopPropagation(); removeFinalImageFromManager(${i})" title="删除">✕</button></div></div>`);
        }
        return items.join('');
    }

    async function renderMgrGrid() {
        const grid = document.getElementById('mgrGrid');
        if (!grid) return;
        grid.innerHTML = await buildMgrGridHTML();
        const countText = document.getElementById('mgrCountText');
        if (countText) countText.textContent = `共 ${_mgrFinalImages.length} 张 · 拖拽排序 · 点击预览`;
        bindMgrDragSort();
    }

    function bindMgrDragSort() {
        const grid = document.getElementById('mgrGrid');
        if (!grid) return;
        let dragIdx = null;
        let touchTimer = null;
        let longPressed = false;
        const cards = grid.querySelectorAll('.mgr-img-card');

        cards.forEach((card, idx) => {
            // 桌面端：原生 HTML5 拖拽
            card.addEventListener('dragstart', function(e) {
                if (longPressed || e.target.closest('button')) { e.preventDefault(); return; }
                dragIdx = idx;
                this.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', String(idx)); } catch (_) {}
            });
            card.addEventListener('dragend', function() {
                this.classList.remove('dragging');
                grid.querySelectorAll('.mgr-img-card').forEach(c => c.classList.remove('drag-over'));
                dragIdx = null;
            });
            card.addEventListener('dragover', function(e) {
                e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                if (dragIdx !== null && dragIdx !== idx) this.classList.add('drag-over');
            });
            card.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
            card.addEventListener('drop', function(e) {
                e.preventDefault(); this.classList.remove('drag-over');
                const dropIdx = (dragIdx !== null) ? dragIdx : idx;
                if (dropIdx === idx) return;
                const [moved] = _mgrFinalImages.splice(dropIdx, 1);
                const insIdx = (idx > dropIdx) ? idx - 1 : idx;
                _mgrFinalImages.splice(insIdx, 0, moved);
                dragIdx = null;
                renderMgrGrid();
            });

            // 移动端：长按后拖拽（iOS 风格）
            card.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                if (e.target.closest('button')) return;
                touchTimer = setTimeout(() => {
                    longPressed = true;
                    dragIdx = idx;
                    card.classList.add('dragging');
                    if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) {}
                }, 250);
            }, { passive: true });
            card.addEventListener('touchmove', function(e) {
                if (touchTimer && !longPressed) { clearTimeout(touchTimer); touchTimer = null; return; }
                if (longPressed) {
                    e.preventDefault();
                    const x = e.touches[0].clientX, y = e.touches[0].clientY;
                    cards.forEach((c, ci) => {
                        if (ci === idx) return;
                        const r = c.getBoundingClientRect();
                        const isOver = (x > r.left && x < r.right && y > r.top && y < r.bottom);
                        c.classList.toggle('drag-over', isOver);
                    });
                }
            }, { passive: false });
            card.addEventListener('touchend', function(e) {
                if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                if (longPressed) {
                    const x = e.changedTouches[0].clientX, y = e.changedTouches[0].clientY;
                    let dropIdx = idx;
                    cards.forEach((c, ci) => {
                        const r = c.getBoundingClientRect();
                        if (x > r.left && x < r.right && y > r.top && y < r.bottom) dropIdx = ci;
                    });
                    if (dragIdx !== null && dropIdx !== dragIdx) {
                        const [moved] = _mgrFinalImages.splice(dragIdx, 1);
                        const insIdx = (dropIdx > dragIdx) ? dropIdx - 1 : dropIdx;
                        _mgrFinalImages.splice(insIdx, 0, moved);
                    }
                    dragIdx = null;
                    longPressed = false;
                    renderMgrGrid();
                }
            });
            card.addEventListener('touchcancel', function() {
                if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
                if (longPressed) {
                    longPressed = false;
                    dragIdx = null;
                    grid.querySelectorAll('.mgr-img-card').forEach(c => { c.classList.remove('dragging'); c.classList.remove('drag-over'); });
                }
            });
        });
    }

    window.previewFullImageByMgr = function(index) {
        if (!_mgrFinalImages || _mgrFinalImages.length === 0) return;
        Promise.all(_mgrFinalImages.map(u => resolveImageUrl(u))).then(urls => {
            _previewImages = urls;
            _previewIndex = Math.max(0, Math.min(index, urls.length - 1));
            renderPreviewModal();
        });
    };

    window.addFinalImageFromManager = function() {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
        input.onchange = function(e) { handleMgrAddFiles(e.target.files); input.value = ''; };
        input.click();
    };

    window.handleMgrImageDrop = function(event) {
        if (event.dataTransfer && event.dataTransfer.files) handleMgrAddFiles(event.dataTransfer.files);
    };

    async function handleMgrAddFiles(fileList) {
        const files = Array.from(fileList || []);
        if (files.length === 0) return;
        if (!_mgrFinalImages) _mgrFinalImages = [];
        const progressEl = document.getElementById('mgrUploadProgress'), progressText = document.getElementById('mgrUploadProgressText');
        if (progressEl) progressEl.classList.add('show');
        let processed = 0, failed = 0;
        for (const file of files) {
            if (progressText) progressText.textContent = `正在处理 ${processed + failed + 1}/${files.length} · ${formatFileSize(file.size)}`;
            try {
                const dataUrl = await compressImage(file);
                _mgrFinalImages.push(dataUrl);
                processed++;
            } catch (err) { console.error(err); failed++; }
        }
        if (progressEl) progressEl.classList.remove('show');
        await renderMgrGrid();
        if (processed > 0) showToast('✅ 已添加 ' + processed + ' 张成品图（点“保存”后生效）' + (failed > 0 ? '，' + failed + ' 张失败' : ''), 'success');
        else if (failed > 0) showToast('❌ ' + failed + ' 张图片处理失败', 'error');
    }

    window.removeFinalImageFromManager = function(index) {
        if (!_mgrFinalImages || index < 0 || index >= _mgrFinalImages.length) return;
        _mgrFinalImages.splice(index, 1);
        renderMgrGrid();
    };

    window.saveFinalImageManager = async function() {
        const recipe = recipes.find(r => r.id === _mgrRecipeId);
        if (!recipe) return;
        // 无任何改动（增删/排序均未变）则静默关闭，不提示
        const unchanged = JSON.stringify(recipe.finalImages || []) === JSON.stringify(_mgrFinalImages || []);
        if (unchanged) { closeFinalImageManager(); return; }
        // ① 先把新增的 data: 图片落本地（IndexedDB），不依赖网络
        const finalImages = await persistImagesLocally(_mgrFinalImages);
        recipe.finalImages = finalImages;
        // ② 立即保存到本地
        saveRecipesLocal();
        renderGallery();
        showToast('✅ 成品图已保存', 'success');
        const savedRecipeId = _mgrRecipeId;
        closeFinalImageManager();
        // 回到详情页后刷新成品图区域
        setTimeout(() => refreshDetailFinalImages(savedRecipeId), 30);
        // ③ 后台把本地图上传到云端（登录时），完成后重新保存并同步
        uploadRecipeImagesToRemote(savedRecipeId);
    };

    // ---- 图片本地落盘 / 后台上传 公共辅助 ----
    async function persistImagesLocally(images) {
        const result = [];
        for (const img of (images || [])) {
            if (img && img.startsWith('data:')) {
                try {
                    const blob = await (await fetch(img)).blob();
                    result.push(await saveImageOffline(blob));
                } catch (err) { console.error('图片本地保存失败:', err); result.push(img); }
            } else {
                result.push(img);
            }
        }
        return result;
    }

    async function imageRefToDataUrl(ref) {
        if (ref && ref.startsWith('data:')) return ref;
        if (ref && ref.startsWith('local:')) {
            const blob = await getOfflineImage(ref);
            if (!blob) throw new Error('本地图片不存在');
            return await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        throw new Error('不支持的图片引用');
    }

    async function uploadLocalImagesToRemote(images) {
        const result = [];
        for (const img of images) {
            if (img && (img.startsWith('local:') || img.startsWith('data:'))) {
                try {
                    const dataUrl = await imageRefToDataUrl(img);
                    result.push(await storeImage(dataUrl)); // 登录时上传 CDN
                } catch (err) { console.error('图片上传失败:', err); result.push(img); }
            } else {
                result.push(img);
            }
        }
        return result;
    }

    async function uploadRecipeImagesToRemote(recipeId) {
        if (!isLoggedIn || !githubToken) return;
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        let uploadedCount = 0;
        try {
            if (recipe.finalImages && recipe.finalImages.length) {
                const before = recipe.finalImages;
                const after = await uploadLocalImagesToRemote(before);
                uploadedCount += after.filter((u, i) => u !== before[i]).length;
                recipe.finalImages = after;
            }
            for (const step of (recipe.steps || [])) {
                if (step.images && step.images.length) {
                    const before = step.images;
                    const after = await uploadLocalImagesToRemote(before);
                    uploadedCount += after.filter((u, i) => u !== before[i]).length;
                    step.images = after;
                }
            }
            saveRecipesAndSync();
            showToast('✅ 图片上传完成' + (uploadedCount > 0 ? '（' + uploadedCount + ' 张）' : ''), 'success');
        } catch (err) { console.error('图片后台上传失败:', err); showToast('⚠️ 部分图片上传失败', 'error'); }
    }

    async function refreshDetailFinalImages(recipeId) {
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) return;
        const countEl = document.getElementById('detailFinalImagesCount');
        if (countEl) countEl.textContent = `🖼️ 成品图 (${(recipe.finalImages || []).length}张)`;
        const area = document.getElementById('detailFinalImagesArea');
        if (!area) return;
        if (recipe.finalImages && recipe.finalImages.length > 0) {
            let html = `<div id="detailFinalImages" class="detail-thumb-grid">`;
            for (let i = 0; i < recipe.finalImages.length; i++) {
                const url = await resolveImageUrl(recipe.finalImages[i]);
                const label = recipe.finalImages.length > 1 ? `${i+1}/${recipe.finalImages.length}` : '';
                html += `<div class="detail-thumb-item" onclick="previewFullImageByRecipe('${recipe.id}', ${i}, true)"><img src="${url}" loading="lazy">${label ? `<span class="thumb-counter">${label}</span>` : ''}</div>`;
            }
            html += `</div>`;
            area.innerHTML = html;
        } else {
            area.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
        }
    }

    // ============================================================
    // 初始化
    // ============================================================
    async function initializeData() {
        const remote = await fetchRemoteData();
        if (remote) {
            if (Array.isArray(remote.materials)) { materials = remote.materials; saveMaterialsLocal(); }
            if (Array.isArray(remote.recipes)) { recipes = remote.recipes; saveRecipesLocal(); }
            if (Array.isArray(remote.usageLogs)) { usageLogs = remote.usageLogs; saveUsageLogsLocal(); }
            if (Array.isArray(remote.categories) && remote.categories.length) { CATEGORIES = remote.categories; saveCategoriesLocal(); }
        }
        renderAll();
        updateLoginButton();
        checkDrafts();
    }

    function checkDrafts() {
        const materialDraft = localStorage.getItem('draft_material');
        if (materialDraft) {
            showToast('检测到未保存的商品草稿，点击恢复', '', true, { label: '恢复', callback: () => {
                try {
                    const draft = JSON.parse(materialDraft);
                    openMaterialModal(null);
                    setTimeout(() => {
                        for (let key in draft) {
                            const el = document.getElementById('mat' + key.charAt(0).toUpperCase() + key.slice(1));
                            if (el) el.value = draft[key];
                        }
                        updateMatTotal(); calcAmount();
                    }, 100);
                } catch(e) {}
            }});
        }
        // 配方草稿检查
        const recipeDraftKeys = Object.keys(localStorage).filter(k => k.startsWith('draft_recipe_'));
        if (recipeDraftKeys.length > 0) {
            showToast('检测到未保存的配方草稿，点击恢复', '', true, { label: '恢复', callback: () => {
                try {
                    const key = recipeDraftKeys[0];
                    const draft = JSON.parse(localStorage.getItem(key));
                    const id = key.replace('draft_recipe_', '');
                    if (id === 'new') {
                        openRecipeModal(null);
                    } else {
                        openRecipeModal(id);
                    }
                    setTimeout(() => {
                        document.getElementById('recipeName').value = draft.name || '';
                        document.getElementById('recipeDesc').value = draft.desc || '';
                        document.getElementById('recipeEmoji').value = draft.emoji || '';
                        _editIngs = draft.ings || [];
                        _editSteps = draft.steps || [];
                        _editFinalImages = draft.finalImages || [];
                        renderIngredientRows();
                        renderStepEditItems();
                        renderEditFinalImages();
                        updateNutritionPreview();
                        _recipeInitialSnapshot = JSON.parse(JSON.stringify({
                            name: draft.name || '',
                            desc: draft.desc || '',
                            emoji: draft.emoji || '',
                            ings: _editIngs.filter(ing => !ing.isNewCategory),
                            steps: _editSteps,
                            finalImages: _editFinalImages
                        }));
                    }, 100);
                } catch(e) {}
            }});
        }
    }

    // ============================================================
    // 应用初始化
    // ============================================================
    function initApp() {
        initializeData();
        bindMaterialDragEvents();
        bindRecipeDragEvents();
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                switchTab(this.dataset.panel);
            });
        });
        // 默认显示工作台

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }

    console.log('🥐 烘焙工作台 v8.8');
})();
