    // ============================================================
    // 拖拽事件占位（避免报错）
    // ============================================================
    function bindMaterialDragEvents() {
        // 简单占位，实际拖拽由 HTML 的 draggable 和事件驱动
        const tbody = document.getElementById('materialTableBody');
        if (!tbody) return;
        let dragItem = null;
        tbody.addEventListener('dragstart', function(e) {
            const tr = e.target.closest('tr');
            if (!tr) return;
            dragItem = tr;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', tr.dataset.id || '');
            tr.style.opacity = '0.5';
        });
        tbody.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        tbody.addEventListener('drop', function(e) {
            e.preventDefault();
            if (!dragItem) return;
            const target = e.target.closest('tr');
            if (!target || target === dragItem) { dragItem = null; return; }
            const idA = dragItem.dataset.id;
            const idB = target.dataset.id;
            const idxA = materials.findIndex(m => m.id === idA);
            const idxB = materials.findIndex(m => m.id === idB);
            if (idxA < 0 || idxB < 0) { dragItem = null; return; }
            const temp = materials[idxA];
            materials[idxA] = materials[idxB];
            materials[idxB] = temp;
            saveMaterialsLocal();
            renderMaterials();
            dragItem.style.opacity = '';
            dragItem = null;
        });
        tbody.addEventListener('dragend', function() {
            if (dragItem) { dragItem.style.opacity = ''; dragItem = null; }
        });
    }

    function bindRecipeDragEvents() {
        // 配方的拖拽排序（简单占位，通过网格拖拽实现）
        const grid = document.getElementById('recipesGrid');
        if (!grid) return;
        let dragItem = null;
        grid.addEventListener('dragstart', function(e) {
            const card = e.target.closest('.recipe-card');
            if (!card) return;
            dragItem = card;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', card.dataset.recipeId || '');
            card.style.opacity = '0.5';
        });
        grid.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        });
        grid.addEventListener('drop', function(e) {
            e.preventDefault();
            if (!dragItem) return;
            const target = e.target.closest('.recipe-card');
            if (!target || target === dragItem) { dragItem = null; return; }
            const idA = dragItem.dataset.recipeId;
            const idB = target.dataset.recipeId;
            const idxA = recipes.findIndex(r => r.id === idA);
            const idxB = recipes.findIndex(r => r.id === idB);
            if (idxA < 0 || idxB < 0) { dragItem = null; return; }
            const temp = recipes[idxA];
            recipes[idxA] = recipes[idxB];
            recipes[idxB] = temp;
            saveRecipesLocal();
            renderRecipes();
            dragItem.style.opacity = '';
            dragItem = null;
        });
        grid.addEventListener('dragend', function() {
            if (dragItem) { dragItem.style.opacity = ''; dragItem = null; }
        });
        // 让recipe-card可拖拽
        grid.querySelectorAll('.recipe-card').forEach(card => {
            card.draggable = true;
            card.dataset.recipeId = card.querySelector('[onclick^="viewRecipeDetail"]')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || '';
        });
        // 重新渲染时重新绑定
        const observer = new MutationObserver(() => {
            grid.querySelectorAll('.recipe-card').forEach(card => {
                if (!card.draggable) {
                    card.draggable = true;
                    card.dataset.recipeId = card.querySelector('[onclick^="viewRecipeDetail"]')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || '';
                }
            });
        });
        observer.observe(grid, { childList: true, subtree: true });
    }

    function checkDrafts() {
        const materialDraft = localStorage.getItem('draft_material');
        if (materialDraft) {
            showToast('检测到未保存的商品草稿，点击恢复', '', true, { label: '恢复', callback: () => {
                try {
                    const draft = JSON.parse(materialDraft);
                    openMaterialModal(null);
                    setTimeout(() => {
                        for (let key in draft) {
                            const el = document.getElementById('mat' + key.charAt(0).toUpperCase() + key.slice(1));
                            if (el) el.value = draft[key];
                        }
                        updateMatTotal(); calcAmount();
                    }, 100);
                } catch(e) {}
            }});
        }
        // 配方草稿检查
        const recipeDraftKeys = Object.keys(localStorage).filter(k => k.startsWith('draft_recipe_'));
        if (recipeDraftKeys.length > 0) {
            showToast('检测到未保存的配方草稿，点击恢复', '', true, { label: '恢复', callback: () => {
                try {
                    const key = recipeDraftKeys[0];

                    const id = key.replace('draft_recipe_', '');
                    if (id === 'new') {
                        openRecipeModal(null);
                    } else {

                    }

                        document.getElementById('recipeName').value = draft.name || '';
                        document.getElementById('recipeDesc').value = draft.desc || '';
                        document.getElementById('recipeEmoji').value = draft.emoji || '';
