            window.useAllMaterialsByCategory = function(recipeId) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;
                saveAndRestoreDetailScroll();
                const servings = _detailServings || 1;
                _allUseQueue = []; _allUseResults = []; _allUseSkipped = []; _allUseRecipeId = recipeId; _allUseRecipeName = recipe.name;
                for (const ing of recipe.ingredients) {
                    const items = materials.filter(m => m.category === ing.category);
                    const available = items.filter(item => getItemRemaining(item) > 0);
                    if (available.length === 0) { _allUseSkipped.push(ing.category); continue; }
                    let totalAvail = 0;
                    for (const item of available) {
                        const rem = getItemRemaining(item);
                        totalAvail += convertToUnit(rem, item.unit, ing.unit, item.name);
                    }
                    if (totalAvail <= 0) { _allUseSkipped.push(ing.category); continue; }
                    if (available.length === 1) {
                        const item = available[0];
                        const need = ing.quantity * servings;
                        const rem = getItemRemaining(item);
                        const remInTarget = convertToUnit(rem, item.unit, ing.unit, item.name);
                        const actualUse = Math.min(need, remInTarget);
                        const actualUseOriginal = convertToUnit(actualUse, ing.unit, item.unit, item.name);
                        const unitPrice = getUnitPrice(item);
                        addUsageLog(item.id, actualUseOriginal, item.unit, recipe.name, recipeId);
                        _allUseResults.push({ name: item.name, used: actualUse, need, unit: ing.unit, amt: actualUse * unitPrice });
                    } else {
                        const need = ing.quantity * servings;
                        _allUseQueue.push({ category: ing.category, available, need, unit: ing.unit });
                    }
                }
                if (_allUseQueue.length === 0) { finishAllUse(); return; }
                showNextMultiSelect();
            };

            function showNextMultiSelect() {
                if (_allUseQueue.length === 0) { finishAllUse(); return; }
                const task = _allUseQueue[0];
                const available = task.available.filter(it => getItemRemaining(it) > 0 && !(task.excludeIds || []).includes(it.id));
                if (available.length === 0) { if (task.need > 0) _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); showNextMultiSelect(); return; }
                task.available = available;
                const remaining = _allUseQueue.length;
                const usedCount = _allUseResults.filter(r => r !== null).length;
                let headerMsg = `需要 <strong>${task.need} ${task.unit}</strong> 的 <strong>${task.category}</strong>，请选择使用哪个商品`;
                if (task.excludeIds && task.excludeIds.length > 0) headerMsg += `<br><span style="font-size:0.9rem;color:var(--text-muted);">已选商品扣减后，还需 <strong>${task.need} ${task.unit}</strong></span>`;
                if (remaining > 1) headerMsg += `<br><span style="font-size:0.9rem;color:var(--text-muted);">（选完本分类后还有 ${remaining - 1} 种材料需要选择）</span>`;
                let html = `<button class="close-btn" onclick="skipMultiSelect()">✕</button><h2>选择商品（${usedCount + 1}/${usedCount + _allUseQueue.length}）</h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">${headerMsg}</div><div style="max-height:400px;overflow-y:auto;">`;
                available.forEach(item => {
                    const rem = getItemRemaining(item);
                    const remInTarget = convertToUnit(rem, item.unit, task.unit, item.name);
                    const canUse = remInTarget >= task.need;
                    html += `<div class="item-select-card" style="background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:6px 0;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" onclick="confirmMultiSelectItem('${item.id}')"><div class="item-info"><span class="item-name">${item.name} ${item.brand ? '· '+item.brand : ''}</span><span class="item-detail">${item.specification || ''} ${item.price ? '· ¥'+item.price : ''} ${item.openingDate ? '· 开封 '+item.openingDate : ''}</span></div><div class="item-stock">剩余 ${rem} ${item.unit} (约 ${remInTarget.toFixed(1)} ${task.unit})</div>${canUse ? '<span class="item-badge" style="background:var(--success);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">可用</span>' : '<span class="item-badge" style="background:#b87820;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">部分</span>'}</div>`;
                });
                html += `</div><div class="modal-actions"><button class="btn btn-ghost" onclick="skipMultiSelect()">跳过此项</button><button class="btn btn-ghost" onclick="cancelAllUse()">取消全部</button></div>`;
                openModal(html, false);
            }

            window.confirmMultiSelectItem = function(itemId) {
                const task = _allUseQueue[0];
                const item = findMaterialById(itemId);
                if (!item) { showToast('商品不存在', 'error'); return; }
                const remaining = getItemRemaining(item);
                if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
                const remInTarget = convertToUnit(remaining, item.unit, task.unit, item.name);
                if (remInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
                const actualUse = Math.min(task.need, remInTarget);
                const actualUseOriginal = convertToUnit(actualUse, task.unit, item.unit, item.name);
                const unitPrice = getUnitPrice(item);
                addUsageLog(item.id, actualUseOriginal, item.unit, _allUseRecipeName, _allUseRecipeId);
                _allUseResults.push({ name: item.name, used: actualUse, need: task.need, unit: task.unit, amt: actualUse * unitPrice });
                task.need -= actualUse;
                if (!task.excludeIds) task.excludeIds = [];
                task.excludeIds.push(item.id);
                if (task.need > 0) {
                    const stillAvailable = task.available.filter(it => getItemRemaining(it) > 0 && !task.excludeIds.includes(it.id));
                    if (stillAvailable.length === 0) { _allUseSkipped.push(task.category + '(差' + task.need + task.unit + ')'); _allUseQueue.shift(); }
                    else { task.available = stillAvailable; showToast('✅ 使用了 ' + actualUse + task.unit + '「' + item.name + '」，还差 ' + task.need + task.unit, 'success'); showNextMultiSelect(); return; }
                } else { _allUseQueue.shift(); }
                showNextMultiSelect();
            };
            window.skipMultiSelect = function() { _allUseSkipped.push(_allUseQueue[0].category); _allUseQueue.shift(); showNextMultiSelect(); };
            window.cancelAllUse = function() { if (_allUseResults.length > 0) { saveUsageLogs(); finishAllUse(true); } else closeModal(true); };

            function finishAllUse(isCancelled) {

                let totalAmount = plan.reduce((s, u) => s + u.amt, 0);
                let detailMsg = plan.map(u => `${u.name} ${u.used}${u.unit}${u.used < u.need ? '(仅剩)' : ''} (¥${u.amt.toFixed(2)})`).join('；');
                let toastMsg = '✅ 已使用 ' + plan.length + ' 种材料，总金额 ¥' + totalAmount.toFixed(2);
                if (isCancelled) toastMsg += '（已取消后续选择）';

                }).join('');
                const html = `<button class="close-btn" onclick="closeModal()">✕</button><div class="detail-recipe-name"><span class="detail-emoji">${recipe.emoji||'📖'}</span> ${recipe.name}</div><div style="color:var(--text-muted);font-size:0.85rem;margin-bottom:16px;text-align:center;">全屏步骤 · 可跟随制作</div><div class="detail-steps-container open fullscreen-steps" style="max-height:none;padding:0;">${stepsHTML}</div><div class="detail-actions" style="margin-top:20px;"><button class="btn btn-primary" onclick="closeModal()" style="width:100%;justify-content:center;">完成制作</button></div>`;
                openModal(html, true);
                setTimeout(() => {
                    recipe.steps.forEach((s, i) => {
                        const containers = document.querySelectorAll(`[id^="stepList_${i}_"]`);
                        if (containers.length > 0) {
                            const container = containers[containers.length - 1];
                            if (container && s.images && s.images.length > 0) {
                                renderStepImagesList(s.images, container.id, i);
                            }
                        }
                        const key = recipeId + '_' + i;
                        if (!stepTimers[key]) {
                            const totalSec = (s.timerMinutes || 0) * 60;
                            stepTimers[key] = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };

            window.deleteRecipe = function(recipeId) {

            window.openFinalImageManager = function(recipeId) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;
                const detailModal = document.querySelector('#modalOverlay .modal');
                if (detailModal) _detailModalScrollTop = detailModal.scrollTop;
                const finalImageIds = recipe.finalImages || [];
                Promise.all(finalImageIds.map(id => getImage(id))).then(imgs => {
                    const valid = imgs.filter(d => d);
                    const imagesHTML = valid.length > 0 ? valid.map((url, i) =>
                        `<div class="mgr-img-card" draggable="true" data-idx="${i}" onclick="previewFullImageByMgr('${recipe.id}', ${i})"><img src="${url}" alt="成品图 ${i+1}"><span class="mgr-order-badge">${i+1}</span><div class="mgr-actions"><button class="mgr-act-btn del" onclick="event.stopPropagation(); deleteFinalImageFromManager('${recipe.id}', ${i})" title="删除">✕</button></div></div>`
                    ).join('') : '<div style="grid-column:1/-1;text-align:center;padding:30px 16px;"><div style="font-size:2.2rem;margin-bottom:8px;">🖼️</div><p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:14px;">还没有成品图，上传一张吧</p></div>';
                    const html = `<button class="close-btn" onclick="closeFinalImageManager('${recipe.id}')">✕</button><h2>🖼️ 成品图管理 · ${recipe.name}</h2><div style="margin-bottom:10px;font-size:0.82rem;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;"><span>共 ${valid.length} 张 · 拖拽排序 · 点击预览</span></div><div class="final-images-manager-grid" id="mgrGrid">${imagesHTML}</div><div class="upload-progress-wrap" id="uploadProgress"><div class="upload-progress-spinner"></div><div class="upload-progress-text" id="uploadProgressText">正在处理图片...</div></div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary" onclick="addFinalImageFromManager('${recipe.id}')">+ 添加成品图（可多选）</button><button class="btn btn-ghost" onclick="closeFinalImageManager('${recipe.id}')">返回</button></div>`;
                    openModal(html, false);

            window.closeFinalImageManager = function(recipeId) {
                closeModal(true);
                setTimeout(function() {
                    viewRecipeDetail(recipeId, true);

                        const modal = document.querySelector('#modalOverlay .modal');

            function initMgrDragSort(recipeId) {
                const grid = document.getElementById('mgrGrid');
                if (!grid) return;
                let dragIdx = null;
                grid.querySelectorAll('.mgr-img-card').forEach(card => {
                    card.addEventListener('dragstart', function(e) {
                        dragIdx = parseInt(this.dataset.idx);
                        this.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });
                    card.addEventListener('dragend', function() {
                        this.classList.remove('dragging');
                        grid.querySelectorAll('.mgr-img-card').forEach(c => c.classList.remove('drag-over'));
                    });
                    card.addEventListener('dragover', function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        if (dragIdx !== null && parseInt(this.dataset.idx) !== dragIdx) this.classList.add('drag-over');
                    });
                    card.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                    card.addEventListener('drop', function(e) {
                        e.preventDefault();
                        this.classList.remove('drag-over');
                        const dropIdx = parseInt(this.dataset.idx);
                        if (dragIdx === null || dragIdx === dropIdx) return;
                        const recipe = recipes.find(r => r.id === recipeId);
                        if (!recipe || !recipe.finalImages) return;
                        const ids = recipe.finalImages;
                        const [moved] = ids.splice(dragIdx, 1);
                        ids.splice(dropIdx, 0, moved);
                        saveRecipes();
                        dragIdx = null;
                        openFinalImageManager(recipeId);
                    });
                });
            }

            window.addFinalImageFromManager = function(recipeId) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;
                if (!recipe.finalImages) recipe.finalImages = [];
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
                input.onchange = async function(e) {
                    const files = Array.from(e.target.files || []);
                    if (files.length === 0) return;
                    const progressEl = document.getElementById('uploadProgress'), progressText = document.getElementById('uploadProgressText');
                    if (progressEl) progressEl.classList.add('show');
                    let processed = 0, failed = 0;
                    for (const file of files) {
                        if (progressText) progressText.textContent = `正在处理 ${processed + failed + 1}/${files.length} · ${formatFileSize(file.size)}`;
                        try {
                            const dataUrl = await compressImage(file);
                            const id = await saveImage(dataUrl);
                            recipe.finalImages.push(id);
                            processed++;
                        } catch (err) { console.error(err); failed++; }
                    }
                    if (progressEl) progressEl.classList.remove('show');
                    saveRecipes();
                    if (processed > 0) showToast('✅ 已添加 ' + processed + ' 张成品图' + (failed > 0 ? '，' + failed + ' 张失败' : ''), 'success');
                    else if (failed > 0) showToast('❌ ' + failed + ' 张图片处理失败', 'error');
                    closeModal(true);
                    openFinalImageManager(recipeId);
                };
                input.click();
            };
            window.deleteFinalImageFromManager = function(recipeId, imageIndex) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe || !recipe.finalImages) return;
                showConfirm('确定要删除这张成品图吗？', function() {

                    saveRecipes();
                    showToast('✅ 成品图已删除', 'success');
                    closeModal(true);
                    openFinalImageManager(recipeId);
                }, function() {});
            };

            function renderPreviewModal() {

                const counter = total > 1 ? `${_previewIndex+1}/${total}` : '';
                const html = `<button class="close-btn" onclick="closePreview(true)" style="position:sticky;top:0;float:right;z-index:30;">✕</button>
                    <div class="fullscreen-preview-wrap" id="previewWrap" style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;">
                        ${counter ? `<span class="fullscreen-preview-counter">${counter}</span>` : ''}
                        <img class="fullscreen-preview-img" id="previewImg" src="${img}" style="max-width:90%;max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.3);user-select:none;-webkit-user-drag:none;touch-action:none;">
                        <div class="fullscreen-preview-nav">
                            <button class="nav-btn" onclick="navPreview(-1)" ${_previewIndex===0?'disabled':''}>‹</button>
                            <button class="nav-btn" onclick="navPreview(1)" ${_previewIndex===_previewImages.length-1?'disabled':''}>›</button>
                        </div>

                openModal(html, true);

                    _imgEl.addEventListener('touchstart', handlePreviewTouchStart, { passive: false });
                    _imgEl.addEventListener('touchmove', handlePreviewTouchMove, { passive: false });

                }
                const wrap = document.getElementById('previewWrap');

            window.navPreview = function(dir) {
                const newIdx = _previewIndex + dir;
                if (newIdx < 0 || newIdx >= _previewImages.length) return;
                _previewIndex = newIdx;
                _scale = 1; _panX = 0; _panY = 0;

                const counter = document.querySelector('.fullscreen-preview-counter');

            window.previewFullImageByRecipe = function(recipeId, index, fromDetail) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe || !recipe.finalImages || recipe.finalImages.length === 0) return;
                const modal = document.querySelector('#modalOverlay .modal');
                if (modal) _detailModalScrollTop = modal.scrollTop;
                const ids = recipe.finalImages;
                Promise.all(ids.map(id => getImage(id))).then(imgs => {
                    const valid = imgs.filter(d => d);
                    if (valid.length === 0) return;
                    _previewImages = valid;

                    _previewFromDetail = fromDetail !== false;
                    _previewFromEdit = false;

            };
            window.previewFullImageByMgr = function(recipeId, index) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe || !recipe.finalImages || recipe.finalImages.length === 0) return;
                const modal = document.querySelector('#modalOverlay .modal');
                if (modal) { _mgrModalScrollTop = modal.scrollTop; _mgrModalHTML = modal.innerHTML; }
                _mgrRecipeId = recipeId;
                const ids = recipe.finalImages;
                Promise.all(ids.map(id => getImage(id))).then(imgs => {
                    const valid = imgs.filter(d => d);
                    if (valid.length === 0) return;
                    _previewImages = valid;
                    _previewIndex = Math.max(0, Math.min(index, valid.length - 1));
                    _previewFromDetail = false;
                    _previewFromEdit = false;
                    _previewFromMgr = true;
                    renderPreviewModal();
                });
            };

            let previewTouches = []; let initialDistance = 0; let initialScale = 1; let initialPanX = 0, initialPanY = 0;

            function handlePreviewTouchStart(e) {
                if (e.touches.length === 2) {
                    previewTouches = Array.from(e.touches);
                    initialDistance = Math.hypot(previewTouches[1].pageX - previewTouches[0].pageX, previewTouches[1].pageY - previewTouches[0].pageY);
                    initialScale = _scale;
                    initialPanX = _panX; initialPanY = _panY;
                    e.preventDefault();
                } else if (e.touches.length === 1 && _scale > 1) {
                    previewTouches = [e.touches[0]];
                    initialPanX = _panX - e.touches[0].pageX;
                    initialPanY = _panY - e.touches[0].pageY;
                }
            }

            function handlePreviewTouchMove(e) {
                if (!_imgEl) return;
                if (e.touches.length === 2 && previewTouches.length === 2) {
                    const dist = Math.hypot(e.touches[1].pageX - e.touches[0].pageX, e.touches[1].pageY - e.touches[0].pageY);
                    let newScale = initialScale * (dist / initialDistance);
                    newScale = Math.min(5, Math.max(1, newScale));
                    _scale = newScale;
                    _imgEl.style.transform = `scale(${_scale}) translate(${_panX}px, ${_panY}px)`;
                    e.preventDefault();
                } else if (e.touches.length === 1 && _scale > 1) {
                    const touch = e.touches[0];
                    const prevTouch = previewTouches[0];
                    if (prevTouch) {
                        const dx = (touch.pageX - prevTouch.pageX) * 0.3;
                        const dy = (touch.pageY - prevTouch.pageY) * 0.3;
                        _panX += dx; _panY += dy;
                        previewTouches = [touch];
                        _imgEl.style.transform = `scale(${_scale}) translate(${_panX}px, ${_panY}px)`;
                    }
                    e.preventDefault();
                }
            }

            function handlePreviewTouchEnd(e) {
                previewTouches = [];
                if (_scale <= 1) { _panX = 0; _panY = 0; _imgEl.style.transform = 'scale(1)'; }
            }

            function setupGallerySwipe(container) {
                if (!container) return;
                let startX = 0, startY = 0;
                container.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    startX = touch.clientX; startY = touch.clientY;
                }, { passive: true });
                container.addEventListener('touchend', function(e) {
                    if (!startX) return;
                    const touch = e.changedTouches[0];
                    const deltaX = touch.clientX - startX;
                    const deltaY = touch.clientY - startY;
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                        if (deltaX < 0) { navPreview(1); } else { navPreview(-1); }
                    }
                    startX = 0;
                }, { passive: true });
            }

            // ============================================================
            // 12. 配方列表渲染
            // ============================================================
            function renderRecipes() {
                const searchEl = document.getElementById('recipeSearch'), filterEl = document.getElementById('recipeFilter');
                const searchTerm = ((searchEl && searchEl.value) || '').toLowerCase();
                const filterVal = (filterEl && filterEl.value) || 'all';
                let filtered = recipes;
                if (searchTerm) filtered = filtered.filter(r => r.name.toLowerCase().includes(searchTerm) || r.description.toLowerCase().includes(searchTerm));
                if (filterVal === 'can-make') {
                    filtered = filtered.filter(r => r.ingredients.every(ing => {
                        const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
                        return totalAvail >= ing.quantity;
                    }));
                }
                filtered.sort((a, b) => (a.order || a.createdAt || 0) - (b.order || b.createdAt || 0));
                const grid = document.getElementById('recipesGrid'), emptyEl = document.getElementById('recipeEmpty');
                if (filtered.length === 0) { grid.innerHTML = ''; emptyEl.style.display = 'block'; }
                else {
                    emptyEl.style.display = 'none';
                    grid.innerHTML = filtered.map((r, idx) => {
                        const allSufficient = r.ingredients.every(ing => {
                            const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
                            return totalAvail >= ing.quantity;
                        });
                        const status = allSufficient ? '可制作' : '材料不足';
                        const statusCls = allSufficient ? 'can-make' : 'cannot-make';
                        const per100 = calcRecipeNutritionFromIngredients(r.ingredients);
                        const nutritionHTML = per100 ? `<div class="recipe-nutrition"><div class="nutrition-item"><div class="nut-val">${per100.calories||'—'}</div><div class="nut-label">能量/100g</div></div><div class="nutrition-item"><div class="nut-val">${per100.protein||'—'}</div><div class="nut-label">蛋白质/100g</div></div><div class="nutrition-item"><div class="nut-val">${per100.fat||'—'}</div><div class="nut-label">脂肪/100g</div></div><div class="nutrition-item"><div class="nut-val">${per100.carbs||'—'}</div><div class="nut-label">碳水/100g</div></div></div>` : '';
                        return `<div class="recipe-card" data-index="${idx}" onclick="viewRecipeDetail('${r.id}')"><h3><span class="recipe-emoji" onclick="event.stopPropagation(); viewRecipeDetail('${r.id}')">${r.emoji||'📖'}</span>${r.name}</h3><p class="recipe-desc">${r.description||'暂无描述'}</p><div class="recipe-meta"><span>${r.ingredients.length} 种材料</span><span class="recipe-status-badge ${statusCls}">${status}</span></div>${nutritionHTML}<div class="recipe-actions"><button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); viewRecipeDetail('${r.id}');">详情</button><button class="btn btn-success btn-sm" onclick="event.stopPropagation(); showFullscreenStepsById('${r.id}');">制作</button><button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); openRecipeModal('${r.id}');">编辑</button><button class="btn btn-outline-danger btn-sm" onclick="event.stopPropagation(); deleteRecipe('${r.id}');">删除</button></div></div>`;
                    }).join('');
                }
            }

            // ============================================================
            // 13. 日志
            // ============================================================
            let logFilters = { material: '', recipe: '', dateFrom: '', dateTo: '' };
            window.applyLogFilters = function() {
                const material = document.getElementById('logSearchMaterial').value.trim().toLowerCase();
                const recipe = document.getElementById('logSearchRecipe').value.trim().toLowerCase();
                const dateFrom = document.getElementById('logDateFrom').value;
                const dateTo = document.getElementById('logDateTo').value;
                logFilters = { material, recipe, dateFrom, dateTo };
                renderLogs();
            };
            window.resetLogFilters = function() {
                document.getElementById('logSearchMaterial').value = '';
                document.getElementById('logSearchRecipe').value = '';
                document.getElementById('logDateFrom').value = '';
                document.getElementById('logDateTo').value = '';
                logFilters = { material: '', recipe: '', dateFrom: '', dateTo: '' };
                renderLogs();
            };

            function renderLogs() {
                const container = document.getElementById('logsList');
                if (!container) return;
                let filtered = [...usageLogs];
                if (logFilters.material) filtered = filtered.filter(u => u.materialName.toLowerCase().includes(logFilters.material));
                if (logFilters.recipe) filtered = filtered.filter(u => u.recipeName.toLowerCase().includes(logFilters.recipe));
                if (logFilters.dateFrom) { const from = new Date(logFilters.dateFrom); from.setHours(0,0,0,0); filtered = filtered.filter(u => new Date(u.timestamp) >= from); }
                if (logFilters.dateTo) { const to = new Date(logFilters.dateTo); to.setHours(23,59,59,999); filtered = filtered.filter(u => new Date(u.timestamp) <= to); }
                filtered.sort((a, b) => b.timestamp - a.timestamp);
                let totalAmount = 0;
                const recipeMap = {};
                filtered.forEach(u => { const amt = u.amountUsed || 0; totalAmount += amt; const key = u.recipeName || '直接使用'; recipeMap[key] = (recipeMap[key] || 0) + amt; });
                document.getElementById('totalAmount').textContent = '¥' + totalAmount.toFixed(2);
                const recipeSummaryEl = document.getElementById('recipeSummary');
                const recipeKeys = Object.keys(recipeMap);
                if (recipeKeys.length === 0) recipeSummaryEl.innerHTML = '<span style="color:var(--text-muted);">暂无数据</span>';
                else recipeSummaryEl.innerHTML = recipeKeys.map(k => `<span class="rs-item">${k}: ¥${recipeMap[k].toFixed(2)}</span>`).join('');
                if (filtered.length === 0) container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暂无匹配记录</p></div>';
                else {
                    const groups = [];
                    let currentGroup = null;
                    filtered.forEach(log => {
                        const recipeKey = log.recipeName || '直接使用';
                        if (!currentGroup || currentGroup.recipeName !== recipeKey || (currentGroup.timestamp - log.timestamp) > 16 * 60 * 60 * 1000) {
                            currentGroup = { recipeName: recipeKey, timestamp: log.timestamp, logs: [] };
                            groups.push(currentGroup);
                        }
                        currentGroup.logs.push(log);
                    });
                    container.innerHTML = groups.map(g => {
                        const groupTotal = g.logs.reduce((s, u) => s + (u.amountUsed || 0), 0);
                        const groupQty = g.logs.length;
                        const timeStr = new Date(g.timestamp).toLocaleString();
                        const emoji = g.recipeName === '直接使用' ? '📦' : '🍰';
                        const itemsHTML = g.logs.map(log => `<div class="log-item"><div class="log-left"><span class="log-name">${log.materialName}</span><span class="log-detail">${log.quantity} ${log.unit}</span><span class="log-amount">¥${(log.amountUsed||0).toFixed(2)}</span></div><span class="log-time">${new Date(log.timestamp).toLocaleTimeString()}</span></div>`).join('');
                        return `<div class="log-group"><div class="log-group-title"><span class="log-group-emoji">${emoji}</span><span>${g.recipeName}</span><span class="log-group-meta">${timeStr} · ${groupQty}项 · ¥${groupTotal.toFixed(2)}</span></div><div class="log-group-body">${itemsHTML}</div></div>`;
                    }).join('');
                }
            }

            window.clearLogs = function() { showConfirm('确定要清空所有使用记录吗？', function() { usageLogs = []; saveUsageLogs(); renderLogs(); showToast('已清空所有记录'); }, function() {}); };

            // ============================================================
            // 14. 导出导入
            // ============================================================
            window.exportData = function() {
                const backup = { version: 2, exportedAt: new Date().toISOString(), materials, recipes, usageLogs, categories: CATEGORIES };
                const json = JSON.stringify(backup, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'baking-backup-' + new Date().toISOString().slice(0, 10) + '.json';
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                showToast('✅ 文本数据已导出（图片数据仍保存在本地IndexedDB）', 'success');
            };

            window.importData = function() {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = 'application/json,.json';
                input.onchange = function(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (!data || typeof data !== 'object') throw new Error('格式错误');
                            showConfirm('导入将覆盖当前所有文本数据，确定继续吗？', function() {
                                if (Array.isArray(data.materials)) { materials = data.materials; saveMaterials(); }
                                if (Array.isArray(data.recipes)) { recipes = data.recipes; saveRecipes(); }
                                if (Array.isArray(data.usageLogs)) { usageLogs = data.usageLogs; saveUsageLogs(); }
                                if (Array.isArray(data.categories) && data.categories.length > 0) { CATEGORIES = data.categories; saveCategories(); }
                                renderAll();
                                showToast('✅ 文本数据导入成功', 'success');
                            }, function() {});
                        } catch (err) { showToast('❌ 文件解析失败：' + err.message, 'error'); }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            // ============================================================
            // 15. 仪表板、图库、切换标签
            // ============================================================
            function renderDashboard() {
                const totalMaterials = materials.length;
                const canMakeCount = recipes.filter(r => r.ingredients.every(ing => {
                    const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
                    return totalAvail >= ing.quantity;
                })).length;
                document.getElementById('dashboardStats').innerHTML = `
                    <div class="stat-card" onclick="switchTab('materials')">
                        <span class="stat-icon">📦</span>
                        <span class="stat-label">库存</span>
                        <div class="stat-info">
                            <div class="stat-value">${totalMaterials}</div>
                            <div class="stat-desc">库存种类材料</div>
                        </div>
                    </div>
                    <div class="stat-card" onclick="switchTab('recipes'); document.getElementById('recipeFilter').value='can-make'; renderRecipes();">
                        <span class="stat-icon">🍰</span>
                        <span class="stat-label">可做</span>
                        <div class="stat-info">
                            <div class="stat-value">${canMakeCount}</div>
                            <div class="stat-desc">可制作配方</div>
                        </div>
                    </div>`;

                const availableRecipes = recipes.filter(r => r.ingredients.every(ing => {
                    const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
                    return totalAvail >= ing.quantity;
                }));
                const tableWrap = document.getElementById('availableRecipesTableWrap');
                const tbody = document.getElementById('availableRecipesTableBody');
                const emptyEl = document.getElementById('availableRecipesEmpty');

                if (availableRecipes.length === 0) {
                    tableWrap.style.display = 'none';
                    emptyEl.style.display = 'block';
                } else {
                    tableWrap.style.display = 'block';
                    emptyEl.style.display = 'none';
                    tbody.innerHTML = availableRecipes.map((r) => {
                        return `<tr onclick="viewRecipeDetail('${r.id}')">
                            <td><span class="avail-emoji">${r.emoji||'📖'}</span><span class="avail-name">${r.name}</span><span class="avail-meta">（${r.ingredients.length}种材料）</span></td>
                            <td style="text-align:right;"><button class="avail-action" onclick="event.stopPropagation(); showFullscreenStepsById('${r.id}');">制作</button></td>
                        </tr>`;
                    }).join('');
                }
            }

            function renderGallery() {
                const container = document.getElementById('galleryContainer');
                const groups = {};
                recipes.forEach(r => { if (r.finalImages && r.finalImages.length > 0) groups[r.id] = { name: r.name, emoji: r.emoji || '📖', images: r.finalImages }; });
                if (Object.keys(groups).length === 0) { container.innerHTML = '<div class="gallery-empty"><span class="empty-icon">🖼️</span><p>暂无成品图</p></div>'; return; }

                const maxDisplay = 8;   // 固定最多显示8张
                let html = '';
                for (const id in groups) {
                    const g = groups[id];
                    const total = g.images.length;
                    const showMore = total > maxDisplay;
                    const displayImages = showMore ? g.images.slice(0, maxDisplay) : g.images;
                    const moreCount = total - maxDisplay;

                    html += `<div class="gallery-group" style="margin-bottom:24px;"><div class="gallery-group-title" style="font-weight:700;color:var(--primary-dark);margin-bottom:8px;">${g.emoji} ${g.name} (${total}张)</div><div class="gallery-grid" id="gallery-grid-${id}">`;
                    displayImages.forEach((imgId, idx) => {
                        const counter = total > 1 ? `${idx+1}/${total}` : '';
                        const isLastAndMore = showMore && idx === maxDisplay - 1;
                        const moreBadge = isLastAndMore ? `<span class="gallery-more-badge">+${moreCount}</span>` : '';
                        html += `<div class="gallery-item" data-img-id="${imgId}" onclick="previewFullImageByRecipe('${id}', ${idx}, false)" style="position:relative;">
                            <div class="gallery-img-wrap" style="position:relative;">
                                <img src="" loading="lazy" style="display:none;">
                                <span style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">加载中</span>
                                ${counter ? `<span style="position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;padding:0 8px;border-radius:12px;font-size:0.6rem;font-weight:600;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);line-height:1.6;z-index:5;">${counter}</span>` : ''}
                                ${moreBadge}
                            </div>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
                container.innerHTML = html;
                container.querySelectorAll('.gallery-item[data-img-id]').forEach(el => {
                    const id = el.dataset.imgId;
                    getImage(id).then(url => {
                        if (url) {
                            const wrap = el.querySelector('.gallery-img-wrap');
                            const img = wrap.querySelector('img');
                            const placeholder = wrap.querySelector('span');
                            if (img) { img.src = url; img.style.display = 'block'; }
                            if (placeholder) placeholder.style.display = 'none';
                        }
                    });
                });
            }

            window.expandGalleryGroup = function(recipeId) {
                // 直接打开全屏预览，从第0张开始，可左右滑动查看全部成品图
                previewFullImageByRecipe(recipeId, 0, false);
            };

            window.switchTab = function(tabName) {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                const tabMap = { 'dashboard': 'panel-dashboard', 'materials': 'panel-materials', 'recipes': 'panel-recipes', 'gallery': 'panel-gallery', 'logs': 'panel-logs' };
                const panelId = tabMap[tabName];
                if (!panelId) return;
                const tabBtn = document.querySelector('.nav-tab[data-panel="' + tabName + '"]');
                if (tabBtn) tabBtn.classList.add('active');
                const panel = document.getElementById(panelId);
                if (panel) panel.classList.add('active');
                try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
                if (tabName === 'dashboard') renderDashboard();
                else if (tabName === 'materials') renderMaterials();
                else if (tabName === 'recipes') renderRecipes();
                else if (tabName === 'gallery') renderGallery();
                else if (tabName === 'logs') renderLogs();
                const panelEl = document.getElementById(panelId);
                if (panelEl) panelEl.scrollTop = 0;
            };

            document.getElementById('navTabs').addEventListener('click', function(e) {
                const tab = e.target.closest('.nav-tab');
                if (!tab) return;
                const panelName = tab.dataset.panel;
                if (panelName) switchTab(panelName);
            });

            // ============================================================
            // 16. 初始化
            // ============================================================
            function renderAll() {
                renderDashboard();
                renderMaterials();
                renderRecipes();
                renderGallery();
                renderLogs();
            }

            openDB().then(() => {
                console.log('IndexedDB 已就绪');
                renderAll();
            }).catch(err => {
                console.error('IndexedDB 初始化失败', err);
                showToast('⚠️ 存储初始化失败，请重新加载页面', 'error');
            });

            // 暴露全局函数
            window.showToast = showToast;
            window.showConfirm = showConfirm;
            window.closeModal = closeModal;
            window.renderAll = renderAll;
            window.renderMaterials = renderMaterials;
            window.renderRecipes = renderRecipes;
            window.renderDashboard = renderDashboard;
            window.renderLogs = renderLogs;
            window.clearLogs = clearLogs;
            window.exportData = exportData;
            window.importData = importData;
            window.openMaterialDetail = openMaterialDetail;
            window.openMaterialModal = openMaterialModal;
            window.saveMaterial = saveMaterial;
            window.deleteMaterial = deleteMaterial;
            window.openCategoryModal = openCategoryModal;
            window.confirmNewCategory = confirmNewCategory;
            window.openCategoryMgmtModal = openCategoryMgmtModal;
            window.openRenameCategoryModal = openRenameCategoryModal;
            window.confirmRenameCategory = confirmRenameCategory;
            window.openRecipeModal = openRecipeModal;
            window.viewRecipeDetail = viewRecipeDetail;
            window.deleteRecipe = deleteRecipe;
            window.showFullscreenStepsById = showFullscreenStepsById;
            window.openFinalImageManager = openFinalImageManager;
            window.closeFinalImageManager = closeFinalImageManager;
            window.addFinalImageFromManager = addFinalImageFromManager;
            window.deleteFinalImageFromManager = deleteFinalImageFromManager;
            window.addIngredientRow = addIngredientRow;
            window.addStep = addStep;
            window.moveStep = moveStep;
            window.removeStep = removeStep;
            window.moveIngredient = moveIngredient;
            window.removeIngredientRow = removeIngredientRow;
            window.onCategoryChange = onCategoryChange;
            window.onQtyChange = onQtyChange;
            window.onUnitChange = onUnitChange;
            window.autoCalcAndFillNutrition = autoCalcAndFillNutrition;
            window.updateNutritionPreview = updateNutritionPreview;
            window.renderStepEditItems = renderStepEditItems;
            window.renderEditFinalImages = renderEditFinalImages;
            window.addCategoryFromRecipe = addCategoryFromRecipe;
            window.confirmNewCategoryFromRecipe = confirmNewCategoryFromRecipe;
            window.cancelNewCategoryFromRecipe = cancelNewCategoryFromRecipe;
            window.toggleStepMaterialCompleted = toggleStepMaterialCompleted;
            window.startStepTimer = startStepTimer;
            window.pauseStepTimer = pauseStepTimer;
            window.resetStepTimer = resetStepTimer;
            window.updateStepTimerDuration = updateStepTimerDuration;
            window.navPreview = navPreview;
            window.switchTab = switchTab;
            window.openAdjustRemainingModal = openAdjustRemainingModal;
            window.confirmAdjustRemaining = confirmAdjustRemaining;
            window.closePreview = closePreview;
            window.formatDateInput = formatDateInput;
            window.expandGalleryGroup = expandGalleryGroup;
            window.onNativeDateChange = onNativeDateChange;

            // 成品图模块：窗口尺寸变化时重新计算缩略图行数
            let _galleryResizeTimer = null;
            window.addEventListener('resize', function() {
                if (_galleryResizeTimer) clearTimeout(_galleryResizeTimer);
                _galleryResizeTimer = setTimeout(function() {
                    const galleryPanel = document.getElementById('panel-gallery');
                    if (galleryPanel && galleryPanel.classList.contains('active')) {
                        renderGallery();
                    }
                }, 300);
            });

            console.log('🥐 烘焙工作台 v7.5 已就绪 (iOS优化版)');
        })();
    </script>
