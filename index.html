            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')

    // ==================== IndexedDB 离线图片 ====================
    const DB_NAME = 'baking_offline_images';
    const DB_STORE = 'images';
    let dbPromise;
    function openImageDB() {
        if (!dbPromise) {
            dbPromise = new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE, { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        return dbPromise;
    }
    async function saveImageOffline(blob) {
        const db = await openImageDB();
        const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put({ id, blob });
            tx.oncomplete = resolve;
            tx.onerror = reject;
        });
        return `local:${id}`;
    }
    async function getOfflineImage(ref) {
        const id = ref.replace('local:', '');
        const db = await openImageDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).get(id);
            req.onsuccess = () => resolve(req.result ? req.result.blob : null);
            req.onerror = reject;
        });
    }
    async function resolveImageUrl(url) {
        if (url && url.startsWith('local:')) {
            const blob = await getOfflineImage(url);
            return blob ? URL.createObjectURL(blob) : '';
        }
        return url;
    }

    async function fetchRemoteData() {
        try {
            const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.dataFilePath}`;
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error('远程数据不存在');
            return await res.json();
        } catch (err) { console.warn('无法从 GitHub 加载数据，使用本地数据', err); return null; }
    }

    async function pushToGitHub() {
        if (!isLoggedIn || !githubToken) return;
        try {
            const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dataFilePath}`;
            const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${githubToken}` } });
            if (!getRes.ok) throw new Error('获取文件信息失败');
            const fileInfo = await getRes.json();
            const payload = { materials, recipes, usageLogs, categories: CATEGORIES };
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: '更新烘焙数据', content, sha: fileInfo.sha })
            });
            if (!putRes.ok) throw new Error((await putRes.json().catch(() => ({}))).message || '上传失败');
            console.log('✅ 数据已同步到 GitHub');
        } catch (err) {
            console.error('同步失败:', err);
            showToast('⚠️ 云端同步失败：' + err.message, 'error', true);
        }
    }

    // ==================== 图片存储（延迟上传） ====================
    async function storeImage(dataUrl) {
        const blob = await (await fetch(dataUrl)).blob();
        if (isLoggedIn) {
            const name = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
            const path = `images/${name}`;
            const apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
            const contentBase64 = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
            const payload = { message: `上传图片 ${name}`, content: contentBase64, branch: CONFIG.branch };
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error((await response.json().catch(() => ({}))).message || '图片上传失败');
            return `https://cdn.jsdelivr.net/gh/${CONFIG.owner}/${CONFIG.repo}@${CONFIG.branch}/${path}`;
        } else {
            return await saveImageOffline(blob);
        }
    }

        }
        return result;

        const steps = _editSteps.filter(s => s.text.trim().length > 0 || (s.images && s.images.length > 0));
        if (steps.length === 0) { showToast('请至少添加一个有效步骤', 'error'); return; }

        // 延迟上传所有图片
        const finalImages = await uploadPendingImages(_editFinalImages || []);
        for (const step of steps) {
            if (step.images && step.images.length > 0) {
                step.images = await uploadPendingImages(step.images);
            }
        }

        const recipeData = {
            name, description, ingredients, steps, emoji, finalImages,
            nutrition: { calories: null, protein: null, fat: null, carbs: null, sodium: null, calcium: null },
            createdAt: editId ? (recipes.find(r => r.id === editId)?.createdAt || Date.now()) : Date.now(),

        const amountUsed = qty * unitPrice;
        usageLogs.push({ materialId: mid, materialName: displayName, quantity: qty, unit: unit, recipeName: rName || '直接使用', recipeId: rId || '', timestamp: Date.now(), amountUsed: amountUsed, priceAtUse: unitPrice, batchId: batchId || null });

    window.restoreLog = function(materialId, timestamp) {
        if (!requireLogin()) return;
        const log = usageLogs.find(u => u.materialId === materialId && u.timestamp === timestamp);
        if (!log) return;
        showConfirm(`确定要还原此条记录吗？将把 ${log.quantity} ${log.unit} 加回 ${log.materialName}。`, () => {
            const item = findMaterialById(materialId);
            if (item) {
                item.remainingQuantity = (item.remainingQuantity || 0) + log.quantity;
                saveMaterialsAndSync();
            }
            usageLogs = usageLogs.filter(u => !(u.materialId === materialId && u.timestamp === timestamp));
            saveUsageLogsAndSync();
            showToast('✅ 已还原记录', 'success');
            renderAllPreserveScroll();
        }, () => {});
    };

        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'application/json,.json';
        input.onchange = function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (Array.isArray(data.materials)) { materials = data.materials; saveMaterialsAndSync(); }
                    if (Array.isArray(data.recipes)) { recipes = data.recipes; saveRecipesAndSync(); }
                    if (Array.isArray(data.usageLogs)) { usageLogs = data.usageLogs; saveUsageLogsAndSync(); }
                    if (Array.isArray(data.categories) && data.categories.length > 0) { CATEGORIES = data.categories; saveCategoriesAndSync(); }
                    renderAll();
                    showToast('✅ 数据导入成功', 'success');
                } catch (err) { showToast('❌ 文件解析失败：' + err.message, 'error'); }
            };
            reader.readAsText(file);
        };
        input.click();
    };
