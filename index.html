<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>🥐 烘焙工作台 · 配方 & 库存</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* ===== 全局样式 ===== */
        :root {
            --bg: #f5f0eb;
            --surface: #ffffff;
            --surface-alt: #faf7f4;
            --primary: #c8753d;
            --primary-light: #e8a87c;
            --primary-dark: #8b4f2a;
            --accent: #f0a05a;
            --text: #2d1f14;
            --text-light: #6b4d3a;
            --text-muted: #9b8a7a;
            --border: #e8ddd0;
            --border-light: #f0e8e0;
            --success: #6b9e5a;
            --success-bg: #edf7e7;
            --danger: #c8553d;
            --danger-bg: #fdf0ed;
            --shadow-sm: 0 1px 3px rgba(60,30,10,0.06);
            --shadow: 0 3px 12px rgba(60,30,10,0.08);
            --shadow-lg: 0 8px 30px rgba(60,30,10,0.12);
            --radius-sm: 8px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-heading: 'Georgia','Noto Serif SC','STSong',serif;
            --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            --safe-top: env(safe-area-inset-top,0px);
            --safe-bottom: env(safe-area-inset-bottom,0px);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:var(--font-body);
            background:linear-gradient(160deg,#fdf6ee 0%,#fef9f3 30%,#fff7ef 60%,#fdf5ec 100%);
            background-attachment:fixed;
            color:var(--text);
            min-height:100vh;
            min-height:100dvh;
            line-height:1.6;
            -webkit-font-smoothing:antialiased;
            padding-top:var(--safe-top);
            padding-bottom:var(--safe-bottom);
            padding-left:env(safe-area-inset-left,0px);
            padding-right:env(safe-area-inset-right,0px);
            position:relative;
            overflow-x:hidden;
        }
        body.modal-open { position:fixed; width:100%; top:0; left:0; }
        .app-container { max-width:1200px; margin:0 auto; padding:16px 16px 40px; position:relative; z-index:1; }
        .app-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; text-align:center; padding:12px 12px 6px; position:relative; gap:6px; }
        .app-header .header-left { display:flex; align-items:center; gap:6px; flex:1 1 auto; justify-content:center; }
        .app-header .logo-icon { font-size:32px; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 4px 8px rgba(180,100,40,0.15)); flex-shrink:0; }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
        .app-header .header-title { display:flex; flex-direction:column; align-items:flex-start; }
        .app-header h1 { font-family:var(--font-heading); font-size:1.6rem; color:var(--primary-dark); letter-spacing:0.03em; font-weight:700; line-height:1.2; }
        .app-header .subtitle { font-size:0.7rem; color:var(--text-muted); line-height:1.3; }

        .nav-tabs {
            display:flex; gap:0; justify-content:space-around; margin:6px 0 14px;
            background:var(--surface); border-radius:40px; padding:4px; box-shadow:var(--shadow-sm);
            border:1px solid var(--border-light); position:sticky; top:8px; top:calc(8px + var(--safe-top));
            z-index:100; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
            background:rgba(255,255,255,0.92); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
        }
        .nav-tabs::-webkit-scrollbar { display:none; }
        .nav-tab {
            flex:1; padding:8px 4px; border-radius:30px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600;
            background:transparent; color:var(--text-light); transition:var(--transition); white-space:nowrap;
            letter-spacing:0.02em; font-family:var(--font-body); text-align:center; touch-action:manipulation;
            min-height:36px; -webkit-touch-callout:none; text-align:center;
        }
        .nav-tab:hover { background:#fef6ee; color:var(--primary); }
        .nav-tab.active { background:var(--primary); color:#fff; box-shadow:0 3px 14px rgba(200,117,61,0.3); }

        .panel { display:none; animation:fadeSlideIn 0.3s ease; }
        .panel.active { display:block; }
        @keyframes fadeSlideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .card { background:var(--surface); border-radius:var(--radius-lg); padding:18px 18px; box-shadow:var(--shadow); border:1px solid var(--border-light); transition:var(--transition); position:relative; }
        .card:hover { box-shadow:var(--shadow-lg); transform:translateY(-1px); }
        .card-header { display:flex; align-items:center; justify-content:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
        .card-title { font-family:var(--font-heading); font-size:1.1rem; color:var(--primary-dark); font-weight:700; letter-spacing:0.02em; text-align:center; }

        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:16px; }
        .stat-card { background:var(--surface); border-radius:var(--radius-lg); padding:12px 16px; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); display:flex; align-items:center; gap:10px; transition:var(--transition); cursor:pointer; justify-content:flex-start; }
        .stat-card:hover { box-shadow:var(--shadow); transform:translateY(-2px); }
        .stat-icon { font-size:2.2rem; line-height:1; flex-shrink:0; text-align:center; }
        .stat-card .stat-label { font-size:2.0rem; font-weight:700; color:var(--primary-dark); line-height:1.2; letter-spacing:0.02em; flex-shrink:0; }
        .stat-card .stat-info { display:flex; flex-direction:column; align-items:center; min-width:0; flex:1; }
        .stat-card .stat-value { font-size:1.8rem; font-weight:800; color:var(--text); line-height:1.2; }
        .stat-card .stat-desc { font-size:0.7rem; color:var(--text-muted); font-weight:500; margin-top:1px; text-align:center; }

        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 32px; border-radius:30px; border:none; cursor:pointer; font-size:0.9rem; font-weight:600; letter-spacing:0.02em; transition:var(--transition); font-family:var(--font-body); white-space:nowrap; text-decoration:none; touch-action:manipulation; min-height:42px; min-width:100px; }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(200,117,61,0.25); }
        .btn-primary:hover { background:var(--primary-dark); box-shadow:0 4px 16px rgba(200,117,61,0.35); transform:translateY(-1px); }
        .btn-outline { background:#fff; color:var(--primary); border:2px solid var(--primary-light); }
        .btn-outline:hover { background:#fef6ee; border-color:var(--primary); }
        .btn-sm { padding:6px 18px; font-size:0.8rem; border-radius:22px; min-height:38px; min-width:70px; }
        .btn-xs { padding:4px 10px; font-size:0.65rem; border-radius:14px; min-height:28px; min-width:44px; }
        .btn-success { background:var(--success); color:#fff; box-shadow:0 2px 8px rgba(107,158,90,0.25); }
        .btn-success:hover { background:#558a45; box-shadow:0 4px 16px rgba(107,158,90,0.35); transform:translateY(-1px); }
        .btn-ghost { background:transparent; color:var(--text-muted); padding:4px 8px; font-size:0.8rem; font-weight:500; min-height:36px; min-width:auto; }
        .btn-ghost:hover { background:#f5ece4; color:var(--text); }
        .btn-delete { color:var(--danger); font-weight:600; background:transparent; border:1px solid var(--danger); }
        .btn-delete:hover { color:#a8432f; background:var(--danger-bg); }
        .btn-outline-danger { background:#fff; color:var(--danger); border:2px solid var(--danger); font-weight:600; }
        .btn-outline-danger:hover { background:var(--danger-bg); }
        .btn-use { background:var(--success-bg); color:var(--success); border:1px solid var(--success); padding:3px 10px; font-size:0.7rem; border-radius:14px; cursor:pointer; transition:var(--transition); font-weight:600; min-height:30px; }
        .btn-use:hover { background:var(--success); color:#fff; }
        .btn-use:disabled { opacity:0.4; cursor:not-allowed; background:#e0d6cc; color:#999; border-color:#ccc; }

        .material-table-wrap { overflow-x:auto; border-radius:var(--radius-lg); box-shadow:var(--shadow); background:var(--surface); border:1px solid var(--border-light); -webkit-overflow-scrolling:touch; }
        .material-table { width:100%; border-collapse:collapse; min-width:600px; font-size:0.9rem; table-layout:auto; }
        .material-table th, .material-table td { padding:8px 10px; border-bottom:1px solid var(--border-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.5; }
        .material-table th { background:#fef9f3; font-weight:700; font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; position:sticky; top:0; z-index:2; }
        .material-table tbody tr:hover { background:#fefaf6; }
        .material-table .drag-handle { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; font-size:1rem; color:var(--text-muted); padding:2px 4px; display:inline-block; width:20px; text-align:center; transition:color 0.2s; }
        .material-table .drag-handle:active { cursor:grabbing; }
        .material-table .drag-handle:hover { color:var(--primary); }
        .material-table .col-drag { width:28px; text-align:center; }
        .material-table .col-name { width:auto; min-width:160px; }
        .material-table .col-cat { width:90px; text-align:center; }
        .material-table .col-stock { width:90px; text-align:center; }
        .material-table .col-edit { width:50px; text-align:center; }
        .material-table .col-del { width:50px; text-align:center; }
        .material-table .col-edit .btn, .material-table .col-del .btn { min-width:36px; padding:2px 6px; font-size:0.6rem; min-height:24px; }
        .category-badge { display:inline-block; padding:2px 8px; border-radius:14px; font-size:0.65rem; font-weight:600; background:#f3e6d8; color:#6b4d3a; letter-spacing:0.03em; white-space:nowrap; }
        .material-name-click { cursor:pointer; color:var(--primary-dark); font-weight:600; transition:color 0.15s; }
        .material-name-click:hover { color:var(--primary); text-decoration:underline; }
        .brand-text { font-weight:400; color:var(--primary); font-size:inherit; }

        .recipes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
        .recipe-card { background:var(--surface); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow); border:1px solid var(--border-light); transition:var(--transition); display:flex; flex-direction:column; gap:8px; position:relative; cursor:pointer; }
        .recipe-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-3px); }
        .recipe-card .recipe-emoji { display:inline-block; margin-right:6px; font-size:1.4rem; vertical-align:middle; cursor:pointer; }
        .recipe-card h3 { font-family:var(--font-heading); font-size:1.4rem; color:var(--primary-dark); letter-spacing:0.02em; cursor:pointer; display:flex; align-items:center; }
        .recipe-card .recipe-desc { font-size:0.82rem; color:var(--text-muted); line-height:1.5; flex-grow:1; }
        .recipe-card .recipe-meta { font-size:0.75rem; color:var(--text-light); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .recipe-card .recipe-actions { display:flex; gap:4px; flex-wrap:nowrap; margin-top:4px; justify-content:space-between; align-items:center; }
        .recipe-card .recipe-actions .btn { flex:1 1 0; min-width:0; justify-content:center; padding:6px 4px; font-size:0.75rem; border-radius:22px; white-space:nowrap; text-align:center; min-height:34px; }
        .recipe-card .recipe-nutrition { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; background:var(--border-light); border-radius:var(--radius-sm); overflow:hidden; padding:1px; margin-top:2px; }
        .recipe-card .nutrition-item { background:var(--surface); text-align:center; padding:4px 2px; font-size:0.6rem; line-height:1.3; }
        .recipe-card .nutrition-item .nut-val { font-weight:700; color:var(--primary-dark); font-size:0.72rem; }
        .recipe-card .nutrition-item .nut-label { color:var(--text-muted); font-size:0.55rem; }
        .recipe-status-badge { display:inline-block; padding:3px 10px; border-radius:16px; font-size:0.7rem; font-weight:600; letter-spacing:0.02em; }
        .recipe-status-badge.can-make { background:var(--success-bg); color:#4a7a3a; }
        .recipe-status-badge.partial { background:#fef6ed; color:#b87820; }
        .recipe-status-badge.cannot-make { background:var(--danger-bg); color:#a84030; }

        .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
        .filter-bar input, .filter-bar select { padding:10px 14px; border-radius:30px; border:2px solid var(--border); font-size:0.9rem; font-family:var(--font-body); background:var(--surface); color:var(--text); transition:var(--transition); min-width:120px; outline:none; -webkit-appearance:none; appearance:none; }
        .filter-bar input:focus, .filter-bar select:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.08); }
        .filter-bar input { flex:1; min-width:160px; max-width:280px; }
        .filter-bar .btn { flex-shrink:0; }
        .filter-bar .btn-sm { min-height:44px; padding:0 16px; height:44px; display:inline-flex; align-items:center; justify-content:center; font-size:0.9rem; }

        .recipe-filter-bar { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:6px; padding-bottom:4px; }
        .recipe-filter-bar input { flex:2; min-width:100px; max-width:none; font-size:0.9rem; }
        .recipe-filter-bar select { flex:1; min-width:80px; max-width:none; text-align:center; text-align-last:center; -webkit-text-align-last:center; font-size:0.9rem; }
        .recipe-filter-bar .btn {
            flex:1; min-width:80px; max-width:none; font-size:0.9rem;
            padding: 10px 12px;
            min-height: 41px;
            height: auto;
        }

        .panel-bottom-actions { display:flex; justify-content:flex-end; margin-top:14px; gap:10px; flex-wrap:wrap; align-items:center; }

        .log-filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:nowrap; background:var(--surface-alt); padding:10px 14px; border-radius:var(--radius); border:1px solid var(--border-light); overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap; scrollbar-width:thin; min-height:52px; }
        .log-filter-bar input, .log-filter-bar select, .log-filter-bar .btn { height:38px; min-height:38px; padding:6px 12px; border-radius:30px; border:2px solid var(--border); font-size:14px; font-family:var(--font-body); background:var(--surface); color:var(--text); transition:var(--transition); outline:none; flex-shrink:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; line-height:1; }
        .log-filter-bar input:focus, .log-filter-bar select:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.08); }
        .log-filter-bar input { min-width:90px; max-width:150px; text-align:left; justify-content:flex-start; }
        .log-filter-bar .date-range input { width:140px; min-width:110px; }
        .log-filter-bar .btn { padding:0 14px; font-size:0.8rem; border-color:var(--border); background:var(--surface); color:var(--text-light); }
        .log-filter-bar .btn:hover { border-color:var(--primary-light); background:#fef6ee; }
        .log-filter-bar .date-range { display:flex; align-items:center; gap:4px; }
        .log-filter-bar .date-range span { font-size:0.85rem; color:var(--text-muted); }

        .log-summary { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:8px 12px; background:var(--surface); border-radius:var(--radius-sm); border:1px solid var(--border-light); margin-bottom:12px; font-size:0.9rem; }
        .log-summary .summary-item { display:flex; align-items:center; gap:4px; }
        .log-summary .summary-item .label { color:var(--text-muted); }
        .log-summary .summary-item .value { font-weight:700; color:var(--primary-dark); }
        .log-summary .recipe-summary { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
        .log-summary .recipe-summary .rs-item { background:var(--surface-alt); padding:2px 10px; border-radius:12px; font-size:0.8rem; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(40,18,5,0.5); z-index:200; justify-content:center; align-items:flex-start; padding:20px; overflow-y:auto; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
        .modal-overlay.show { display:flex; }
        .modal-overlay .modal { background:var(--surface); border-radius:var(--radius-xl); padding:22px 20px 18px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(40,18,5,0.2); animation:modalIn 0.3s ease; position:relative; margin:auto; max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; border:1px solid rgba(255,255,255,0.3); }
        .modal-overlay .modal.fullscreen { border-radius:0; max-width:100%; max-height:100vh; max-height:100dvh; height:100vh; height:100dvh; margin:0; padding:20px 18px; padding-top:calc(20px + var(--safe-top)); padding-bottom:calc(20px + var(--safe-bottom)); }
        @keyframes modalIn { from { opacity:0; transform:translateY(30px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .modal h2 { font-family:var(--font-heading); color:var(--primary-dark); font-size:1.25rem; margin-bottom:14px; letter-spacing:0.02em; padding-right:30px; font-weight:700; }
        .modal .form-group { margin-bottom:14px; }
        .modal .form-group label { display:block; font-weight:600; font-size:0.85rem; color:var(--text-light); margin-bottom:4px; letter-spacing:0.02em; }
        .modal .form-group input, .modal .form-group select, .modal .form-group textarea { width:100%; padding:8px 12px; border-radius:var(--radius-sm); border:2px solid var(--border); font-size:16px; font-family:var(--font-body); background:#fefcf9; color:var(--text); transition:var(--transition); outline:none; resize:vertical; -webkit-appearance:none; appearance:none; height:40px; }
        .modal .form-group input:focus, .modal .form-group select:focus, .modal .form-group textarea:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.07); }
        .modal .form-group input[readonly] { background:#f5f0eb; color:var(--text-muted); }
        .modal .close-btn { position:sticky; top:0; float:right; margin-top:-8px; margin-right:-6px; width:36px; height:36px; border-radius:50%; border:none; background:#f5ece4; cursor:pointer; font-size:1.1rem; color:var(--text-muted); transition:var(--transition); display:flex; align-items:center; justify-content:center; z-index:10; }
        .modal .close-btn:hover { background:#e8d5c4; color:var(--text); }
        .modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
        .modal .form-row { display:flex; flex-wrap:wrap; gap:10px; }
        .modal .form-row .form-group { flex:1 1 calc(50% - 10px); min-width:140px; }
        .modal .form-row.keep-row .form-group { flex:1 1 calc(50% - 10px); min-width:0; }
        .modal .form-row-3 { display:flex; flex-wrap:wrap; gap:10px; }
        .modal .form-row-3 .form-group { flex:1 1 calc(33.33% - 10px); min-width:100px; }

        /* 日期输入组件（按钮左置） */
        .date-input-group {
            position: relative;   /* 新增：作为内部绝对定位的参照 */
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fefcf9;
            transition: var(--transition);
            padding: 0 4px;
            height: 40px;
            box-sizing: border-box;
        }
        .date-input-group:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(200,117,61,0.07);
        }
        .date-input-group input[type="text"] {
            flex: 1; height: 38px; font-size: 16px; padding: 8px 30px 8px 4px;
            border: none; background: transparent; outline: none;
            min-width: 0;
        }
        .date-input-group .date-picker-btn {
            flex-shrink: 0;
            background: transparent;
            border: none;
            font-size: 18px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 36px;
            min-height: 40px;
            height: 100%;
            margin: 0;            /* 移除原来的 margin-top: 32px */
            transform: translateY(15px);   /* 修改：下移15px */
            order: -1;
        }
        .date-input-group .date-picker-btn:hover { color: var(--primary); }
        .date-input-group .clear-date-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 16px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .date-input-group .clear-date-btn:hover { color: var(--danger); }

        .pack-input-wrap { display:flex; align-items:center; border:2px solid var(--border); border-radius:var(--radius-sm); background:#fefcf9; padding:0 10px; height:40px; transition:var(--transition); box-sizing:border-box; }
        .pack-input-wrap:focus-within { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(200,117,61,0.07); }

<body>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. IndexedDB 图片存储
            // ============================================================
            const DB_NAME = 'BakingAppDB';
            const STORE_NAME = 'images';
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db && db.name === DB_NAME) { resolve(db); return; }
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains(STORE_NAME)) {
                            d.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });

            const UNITS = ['g','kg','ml','L','个'];

            function genId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
            function findMaterialById(id) { return materials.find(m => m.id === id); }
            function getItemRemaining(item) { if (!item) return 0; const total = item.totalQuantity || 0; const used = usageLogs.filter(u => u.materialId === item.id).reduce((s,u) => s + u.quantity, 0); return Math.max(0, total - used); }
            function getUnitPrice(item) { if (!item) return 0; const price = item.price || 0; if (!item.specification) return price; const match = item.specification.match(/^([\d.]+)/); if (match) { const n = parseFloat(match[1]); if (n > 0) return price / n; } return price; }
            function convertToUnit(quantity, fromUnit, toUnit, materialName) {
                if (fromUnit === toUnit) return quantity;
                const isMilk = materialName && materialName.toLowerCase().includes('牛奶');
                if (isMilk) {
                    if (fromUnit === 'ml' && toUnit === 'g') return quantity * 1.03;
                    if (fromUnit === 'g' && toUnit === 'ml') return quantity / 1.03;
                }
                return quantity;
            }

            function addUsageLog(mid, qty, unit, rName, rId) {
                const item = findMaterialById(mid); if (!item) return;
                const displayName = item.name + (item.brand ? ' ' + item.brand : '');

                const amountUsed = qty * unitPrice;
                usageLogs.push({ materialId: mid, materialName: displayName, quantity: qty, unit: unit, recipeName: rName || '直接使用', recipeId: rId || '', timestamp: Date.now(), amountUsed: amountUsed, priceAtUse: unitPrice });
                saveUsageLogs();

            function showToast(message, type = '', persistent = false) {
                const container = document.getElementById('toastContainer');
                if (persistent) {
                    const existing = container.querySelectorAll('.toast.persistent');
                    if (existing.length >= 2) existing[0].remove();
                }
                const toast = document.createElement('div');
                toast.className = 'toast ' + type + (persistent ? ' persistent' : '');
                const textSpan = document.createElement('span');
                textSpan.className = 'toast-text';
                textSpan.textContent = message;
                const closeBtn = document.createElement('span');
                closeBtn.className = 'toast-close';
                closeBtn.textContent = '✕';
                toast.appendChild(textSpan);
                toast.appendChild(closeBtn);

                function dismiss() {
                    toast.style.opacity = '0';
                    toast.style.transition = '0.3s';
                    setTimeout(() => toast.remove(), 300);
                }

                closeBtn.addEventListener('click', function(e) { e.stopPropagation(); dismiss(); });
                toast.addEventListener('click', dismiss);

                // 所有 toast 均 3.6 秒自动消失
                let autoTimer = setTimeout(() => { dismiss(); }, 3600);

                toast.addEventListener('mouseenter', function() {
                    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
                });
                toast.addEventListener('mouseleave', function() {
                    if (!autoTimer) { autoTimer = setTimeout(() => { dismiss(); }, 2000); }
                });

                container.appendChild(toast);

            // ============================================================
            // 6. 图片压缩
            // ============================================================
            const IMAGE_CONFIG = { maxWidth: 2048, maxHeight: 2048, quality: 0.8, maxFileSize: 200 * 1024 * 1024 };

            function compressImage(file) {
                return new Promise((resolve, reject) => {
                    if (!file.type.startsWith('image/')) { reject(new Error('非图片文件')); return; }
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = new Image();
                        img.onload = function() {
                            let { width, height } = img;
                            if (width > IMAGE_CONFIG.maxWidth || height > IMAGE_CONFIG.maxHeight) {
                                const ratio = Math.min(IMAGE_CONFIG.maxWidth / width, IMAGE_CONFIG.maxHeight / height);
                                width = Math.round(width * ratio);
                                height = Math.round(height * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', IMAGE_CONFIG.quality);
                            resolve(dataUrl);
                        };
                        img.onerror = function() { reject(new Error('图片加载失败')); };
                        img.src = ev.target.result;
                    };
                    reader.onerror = function() { reject(new Error('文件读取失败')); };
                    reader.readAsDataURL(file);
                });
            }

            function formatFileSize(bytes) { if (bytes < 1024) return bytes + 'B'; if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + 'KB'; return (bytes / 1024 / 1024).toFixed(1) + 'MB'; }

            // ============================================================
            // 8. 材料相关 (修复日期选择器)
            // ============================================================
            function parseDateInput(val) {
                if (!val) return null;
                let str = val.trim().replace(/\s/g, '');
                if (!str) return null;
                let d = new Date(str);
                if (!isNaN(d.getTime()) && /^\d{4}-\d{1,2}-\d{1,2}$/.test(str)) return d;
                let parts = str.split(/[\.\/\-]/);
                if (parts.length === 1 && /^\d+$/.test(str)) {
                    const num = str;
                    if (num.length === 4) {
                        const month = parseInt(num.slice(0, 1));
                        const day = parseInt(num.slice(1));
                        if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                            const now = new Date();
                            return new Date(now.getFullYear(), month - 1, day);
                        }
                        const y = parseInt(num);
                        if (y > 1900 && y < 2100) return new Date(y, 0, 1);
                    } else if (num.length === 6) {
                        const y = parseInt(num.slice(0, 2));
                        const m = parseInt(num.slice(2, 4));
                        const day = parseInt(num.slice(4, 6));
                        if (y >= 1 && y <= 99 && m >= 1 && m <= 12 && day >= 1 && day <= 31) {
                            const fullYear = 2000 + y;
                            return new Date(fullYear, m - 1, day);
                        }
                    } else if (num.length === 8) {
                        const y = parseInt(num.slice(0, 4));
                        const m = parseInt(num.slice(4, 6));
                        const day = parseInt(num.slice(6, 8));
                        if (y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && day >= 1 && day <= 31) {
                            return new Date(y, m - 1, day);
                        }
                    }
                    return null;
                }
                let numbers = parts.map(p => parseInt(p)).filter(n => !isNaN(n));
                if (numbers.length === 0) return null;
                const now = new Date();
                const currentYear = now.getFullYear();
                if (numbers.length === 1) {
                    const num = numbers[0];
                    if (num > 12) {
                        if (num < 100) return new Date(2000 + num, 0, 1);
                        return new Date(num, 0, 1);
                    } else {
                        return new Date(currentYear, num - 1, 1);
                    }
                } else if (numbers.length === 2) {
                    let a = numbers[0], b = numbers[1];
                    if (a > 12) {
                        if (a < 100) a = 2000 + a;
                        if (b >= 1 && b <= 12) return new Date(a, b - 1, 1);
                        return null;
                    } else {
                        if (a >= 1 && a <= 12 && b >= 1 && b <= 31) {
                            return new Date(currentYear, a - 1, b);
                        }
                        if (a >= 1 && a <= 12 && b > 31) {
                            if (b < 100) b = 2000 + b;
                            return new Date(b, a - 1, 1);
                        }
                        return null;
                    }
                } else if (numbers.length === 3) {
                    let y = numbers[0], m = numbers[1], day = numbers[2];
                    if (y > 12) {
                        if (y < 100) y = 2000 + y;
                        if (y >= 1900 && y <= 2100 && m >= 1 && m <= 12 && day >= 1 && day <= 31) {
                            return new Date(y, m - 1, day);
                        }
                    } else {
                        if (m >= 1 && m <= 31 && day < 100) {
                            const fullYear = 2000 + day;
                            if (fullYear >= 1900 && fullYear <= 2100 && y >= 1 && y <= 12 && m >= 1 && m <= 31) {
                                return new Date(fullYear, y - 1, m);
                            }
                        }
                        if (day > 1000 && y >= 1 && y <= 12 && m >= 1 && m <= 31) {
                            return new Date(day, y - 1, m);
                        }
                        if (y >= 1 && y <= 12 && m >= 1 && m <= 31) {
                            return new Date(currentYear, y - 1, m);
                        }
                    }
                    return null;
                }
                return null;
            }

            function getExpiryStatus(expiryDate) {
                if (!expiryDate) return { text: '未设置', cls: 'ok' };
                const now = new Date();
                const expiry = new Date(expiryDate);
                if (isNaN(expiry.getTime())) return { text: '无效日期', cls: 'ok' };
                const diff = expiry - now;
                if (diff < 0) {
                    const days = Math.abs(Math.ceil(diff / (1000 * 60 * 60 * 24)));
                    return { text: `已过期 ${days} 天`, cls: 'danger' };
                }
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                if (days > 365) {
                    const years = Math.floor(days / 365);
                    return { text: `还剩 ${years} 年`, cls: 'ok' };
                } else if (days > 60) {
                    const months = Math.ceil(days / 30);
                    return { text: `还剩 ${months} 个月`, cls: 'ok' };
                } else {
                    return { text: `还剩 ${days} 天`, cls: days < 7 ? 'danger' : 'ok' };
                }
            }

            // ============================================================
            // 拖拽排序
            // ============================================================
            let dragState = null, dragListenersBound = false;

            function initDragSort() {
                const tbody = document.getElementById('materialTableBody');
                if (!tbody) return;
                if (dragListenersBound) {
                    document.removeEventListener('touchmove', handleTouchMove);
                    document.removeEventListener('touchend', handleTouchEnd);
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                    tbody.removeEventListener('touchstart', handleTouchStart);
                    tbody.removeEventListener('mousedown', handleMouseDown);
                    dragListenersBound = false;
                }
                tbody.addEventListener('touchstart', handleTouchStart, { passive: false });
                tbody.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('touchend', handleTouchEnd, { passive: false });
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
                dragListenersBound = true;
            }

            function getRowIndex(el) {
                const tr = el.closest('tr');
                if (!tr) return -1;
                return Array.from(tr.parentElement.children).indexOf(tr);
            }
            function getRowByIndex(index) {
                const tbody = document.getElementById('materialTableBody');
                return tbody ? tbody.children[index] : null;
            }
            function swapRows(a, b) {
                const tbody = document.getElementById('materialTableBody');
                if (!tbody) return;
                const rows = tbody.children;
                if (a < 0 || a >= rows.length || b < 0 || b >= rows.length) return;
                const ra = rows[a], rb = rows[b];
                if (a < b) tbody.insertBefore(rb, ra);
                else tbody.insertBefore(ra, rb);
                const temp = materials[a];
                materials[a] = materials[b];
                materials[b] = temp;
                saveMaterials();
            }
            function getDragTarget(e) {
                const target = e.target.closest('.drag-handle');
                if (!target) return null;
                const tr = target.closest('tr');
                if (!tr) return null;
                return tr;
            }

            function handleTouchStart(e) {
                const tr = getDragTarget(e);
                if (!tr) return;
                const idx = getRowIndex(tr);
                if (idx < 0) return;
                const touch = e.touches[0];
                dragState = { type: 'touch', startIndex: idx, currentIndex: idx, startY: touch.clientY, isDragging: false };
                e.preventDefault();
            }

            function handleTouchMove(e) {
                if (!dragState || dragState.type !== 'touch') return;
                if (!dragState.isDragging) {
                    const touch = e.touches[0];
                    if (Math.abs(touch.clientY - dragState.startY) <= 10) return;
                }
                e.preventDefault();
                const touch2 = e.touches[0];
                if (!dragState.isDragging && Math.abs(touch2.clientY - dragState.startY) > 10) {
                    dragState.isDragging = true;
                    const tr = getRowByIndex(dragState.startIndex);
                    if (tr) tr.classList.add('dragging');
                }
                if (!dragState.isDragging) return;
                const tbody = document.getElementById('materialTableBody');
                if (!tbody) return;
                const rows = tbody.children;
                let targetIdx = dragState.startIndex;
                const y = touch2.clientY;
                for (let i = 0; i < rows.length; i++) {
                    const rect = rows[i].getBoundingClientRect();
                    if (y > rect.top + rect.height / 2) targetIdx = i;
                    else break;
                }
                targetIdx = Math.max(0, Math.min(rows.length - 1, targetIdx));
                if (targetIdx !== dragState.currentIndex) {
                    swapRows(dragState.currentIndex, targetIdx);
                    dragState.currentIndex = targetIdx;
                    Array.from(rows).forEach((r, i) => {
                        r.classList.toggle('drag-over', i === targetIdx && i !== dragState.startIndex);
                    });
                }
            }

            function handleTouchEnd(e) {
                if (!dragState || dragState.type !== 'touch') return;
                const tbody = document.getElementById('materialTableBody');
                if (tbody) {
                    Array.from(tbody.children).forEach(r => r.classList.remove('dragging', 'drag-over'));
                }
                dragState = null;
                renderMaterials();
            }

            function handleMouseDown(e) {
                const tr = getDragTarget(e);
                if (!tr || e.button !== 0) return;
                const idx = getRowIndex(tr);
                if (idx < 0) return;
                dragState = { type: 'mouse', startIndex: idx, currentIndex: idx, startY: e.clientY, isDragging: false };
                e.preventDefault();
            }

            function handleMouseMove(e) {
                if (!dragState || dragState.type !== 'mouse') return;
                if (!dragState.isDragging && Math.abs(e.clientY - dragState.startY) > 10) {
                    dragState.isDragging = true;
                    const tr = getRowByIndex(dragState.startIndex);
                    if (tr) tr.classList.add('dragging');
                }
                if (!dragState.isDragging) return;
                const tbody = document.getElementById('materialTableBody');
                if (!tbody) return;
                const rows = tbody.children;
                let targetIdx = dragState.startIndex;
                const y = e.clientY;
                for (let i = 0; i < rows.length; i++) {
                    const rect = rows[i].getBoundingClientRect();
                    if (y > rect.top + rect.height / 2) targetIdx = i;
                    else break;
                }
                targetIdx = Math.max(0, Math.min(rows.length - 1, targetIdx));
                if (targetIdx !== dragState.currentIndex) {
                    swapRows(dragState.currentIndex, targetIdx);
                    dragState.currentIndex = targetIdx;
                    Array.from(rows).forEach((r, i) => {
                        r.classList.toggle('drag-over', i === targetIdx && i !== dragState.startIndex);
                    });
                }
            }

            function handleMouseUp(e) {
                if (!dragState || dragState.type !== 'mouse') return;
                const tbody = document.getElementById('materialTableBody');
                if (tbody) {
                    Array.from(tbody.children).forEach(r => r.classList.remove('dragging', 'drag-over'));
                }
                dragState = null;
                renderMaterials();
            }

            function calcRecipeNutritionFromIngredients(ingredients) {
                let totalGrams = 0;
                let totalCal = 0, totalPro = 0, totalFat = 0, totalCar = 0, totalSod = 0, totalCalc = 0;
                let hasData = false;
                for (const ing of ingredients) {
                    if (ing.isNewCategory) continue;
                    if (!ing.category || ing.quantity <= 0) continue;
                    let qtyInGrams = ing.quantity;
                    if (ing.unit === 'kg') qtyInGrams = ing.quantity * 1000;
                    else if (ing.unit === 'ml') {
                        const isMilk = ing.category.toLowerCase().includes('牛奶');
                        if (isMilk) qtyInGrams = ing.quantity * 1.03;
                        else qtyInGrams = ing.quantity;
                    } else if (ing.unit !== 'g' && ing.unit !== 'ml' && ing.unit !== 'kg') {
                        continue;
                    }
                    totalGrams += qtyInGrams;
                    const items = materials.filter(m => m.category === ing.category);
                    if (items.length === 0) continue;
                    let count = 0;
                    let avgCal = 0, avgPro = 0, avgFat = 0, avgCar = 0, avgSod = 0, avgCalc = 0;
                    for (const mat of items) {
                        const nut = mat.nutrition || {};
                        if (nut.calories != null) { avgCal += nut.calories; count++; }
                        if (nut.protein != null) avgPro += nut.protein;
                        if (nut.fat != null) avgFat += nut.fat;
                        if (nut.carbs != null) avgCar += nut.carbs;
                        if (nut.sodium != null) avgSod += nut.sodium;
                        if (nut.calcium != null) avgCalc += nut.calcium;
                    }
                    if (count === 0) continue;
                    avgCal /= count; avgPro /= count; avgFat /= count; avgCar /= count; avgSod /= count; avgCalc /= count;
                    const factor = qtyInGrams / 100;
                    if (avgCal > 0) { totalCal += avgCal * factor; hasData = true; }
                    if (avgPro > 0) { totalPro += avgPro * factor; hasData = true; }
                    if (avgFat > 0) { totalFat += avgFat * factor; hasData = true; }
                    if (avgCar > 0) { totalCar += avgCar * factor; hasData = true; }
                    if (avgSod > 0) { totalSod += avgSod * factor; hasData = true; }
                    if (avgCalc > 0) { totalCalc += avgCalc * factor; hasData = true; }
                }
                if (!hasData || totalGrams <= 0) return null;
                return {
                    calories: Math.round(totalCal / totalGrams * 100 * 10) / 10,
                    protein: Math.round(totalPro / totalGrams * 100 * 10) / 10,
                    fat: Math.round(totalFat / totalGrams * 100 * 10) / 10,
                    carbs: Math.round(totalCar / totalGrams * 100 * 10) / 10,
                    sodium: Math.round(totalSod / totalGrams * 100 * 10) / 10,
                    calcium: Math.round(totalCalc / totalGrams * 100 * 10) / 10
                };
            }

            window.autoCalcAndFillNutrition = function() { updateNutritionPreview(); };

                previewEl.innerHTML = `

                        <div class="nut-preview-item"><div class="nut-value">${nut.fat}</div><div class="nut-label">脂肪 (g/100g)</div></div>

                const used = new Set();

                        _editSteps[i].materials.forEach(idx => used.add(idx));
                    }
                }
                return used;

                    return `<span class="step-materials-display" data-cat="${cat}" onclick="toggleStepMaterialCompleted(this)">${cat} ${displayQty}${ing.unit}</span>`;
                }).join(' ');
            }

            window.toggleStepMaterialCompleted = function(el) {
                el.classList.toggle('completed');
            };

            function stepTimerTick(stepIdx, recipeId) {
                const key = recipeId + '_' + stepIdx;
                if (!stepTimers[key]) return;
                const timer = stepTimers[key];
                if (timer.state !== 'running') return;
                const elapsed = Math.floor((Date.now() - timer.startTime) / 1000);
                const remain = Math.max(0, timer.totalSeconds - elapsed);
                timer.remain = remain;
                updateStepTimerDisplay(recipeId, stepIdx);
                if (remain <= 0) {
                    timer.state = 'done';
                    clearInterval(timer.interval);
                    showToast('⏰ 步骤 ' + (stepIdx + 1) + ' 计时完成！', 'success');
                    updateStepTimerDisplay(recipeId, stepIdx);
                }
            }

            function updateStepTimerDisplay(recipeId, stepIdx) {
                const key = recipeId + '_' + stepIdx;
                const timer = stepTimers[key];
                if (!timer) return;
                const displayEl = document.querySelector(`.step-timer-display-${recipeId}-${stepIdx}`);
                const stateEl = document.querySelector(`.step-timer-state-${recipeId}-${stepIdx}`);
                const startBtn = document.querySelector(`.step-timer-start-${recipeId}-${stepIdx}`);
                const pauseBtn = document.querySelector(`.step-timer-pause-${recipeId}-${stepIdx}`);
                const resetBtn = document.querySelector(`.step-timer-reset-${recipeId}-${stepIdx}`);
                if (displayEl) {
                    const mins = Math.floor(timer.remain / 60);
                    const secs = timer.remain % 60;
                    displayEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                }
                if (stateEl) {
                    const stateText = { idle: '待开始', running: '运行中', paused: '已暂停', done: '已完成' }[timer.state] || '待开始';
                    stateEl.textContent = stateText;
                }
                if (startBtn) startBtn.disabled = (timer.state === 'running' || timer.state === 'done');
                if (pauseBtn) pauseBtn.disabled = (timer.state !== 'running');
                if (resetBtn) resetBtn.disabled = false;
            }

            window.startStepTimer = function(recipeId, stepIdx) {
                const key = recipeId + '_' + stepIdx;
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;
                const step = recipe.steps[stepIdx];
                if (!step) return;
                let timer = stepTimers[key];
                if (!timer) {
                    const totalSec = (step.timerMinutes || 0) * 60;
                    timer = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
                    stepTimers[key] = timer;
                }
                if (timer.state === 'done' || timer.state === 'idle') {
                    timer.remain = timer.totalSeconds;
                }
                if (timer.remain <= 0) { showToast('请设置计时时长', 'error'); return; }
                timer.state = 'running';
                timer.startTime = Date.now() - (timer.totalSeconds - timer.remain) * 1000;
                if (timer.interval) clearInterval(timer.interval);
                timer.interval = setInterval(() => { stepTimerTick(stepIdx, recipeId); }, 1000);
                updateStepTimerDisplay(recipeId, stepIdx);
            };

            window.pauseStepTimer = function(recipeId, stepIdx) {
                const key = recipeId + '_' + stepIdx;
                const timer = stepTimers[key];
                if (!timer || timer.state !== 'running') return;
                timer.state = 'paused';
                if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
                updateStepTimerDisplay(recipeId, stepIdx);
            };

            window.resetStepTimer = function(recipeId, stepIdx) {
                const key = recipeId + '_' + stepIdx;
                const timer = stepTimers[key];
                if (!timer) return;
                if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
                timer.state = 'idle';
                timer.remain = timer.totalSeconds;
                updateStepTimerDisplay(recipeId, stepIdx);
            };

            window.updateStepTimerDuration = function(recipeId, stepIdx, value) {
                const minutes = parseInt(value) || 0;
                const key = recipeId + '_' + stepIdx;
                const timer = stepTimers[key];
                if (timer) {
                    timer.totalSeconds = minutes * 60;
                    timer.remain = timer.totalSeconds;
                    timer.state = 'idle';
                    if (timer.interval) { clearInterval(timer.interval); timer.interval = null; }
                    updateStepTimerDisplay(recipeId, stepIdx);
                }
                const recipe = recipes.find(r => r.id === recipeId);
                if (recipe && recipe.steps[stepIdx]) {
                    recipe.steps[stepIdx].timerMinutes = minutes;
                    saveRecipes();
                }
            };

            window.viewRecipeDetail = async function(recipeId, keepPosition) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (!recipe) return;
                if (keepPosition) {
                    const oldModal = document.querySelector('#modalOverlay .modal');
                    if (oldModal) _detailModalScrollTop = oldModal.scrollTop;
                }
                _detailRecipeId = recipeId;
                _detailServings = keepPosition ? _detailServings : 1;
                const details = recipe.ingredients.map(ing => {
                    const totalAvail = getCategoryAvailableInUnit(ing.category, ing.unit);
                    const items = materials.filter(m => m.category === ing.category);
                    return { ...ing, available: totalAvail, sufficient: totalAvail >= ing.quantity, items };
                });
                const allSufficient = details.every(d => d.sufficient);
                const status = allSufficient ? '可制作' : '材料不足';
                const statusCls = allSufficient ? 'can-make' : 'cannot-make';
                let totalWeight = 0;
                recipe.ingredients.forEach(ing => {
                    const qty = parseFloat(ing.quantity) || 0;
                    if (ing.unit === 'g') totalWeight += qty;
                    else if (ing.unit === 'kg') totalWeight += qty * 1000;
                    else if (ing.unit === 'ml') {
                        const firstItem = materials.find(m => m.category === ing.category && getItemRemaining(m) > 0);
                        if (firstItem && firstItem.name.toLowerCase().includes('牛奶')) totalWeight += qty * 1.03;
                    }
                });
                const totalWeightText = totalWeight > 0 ? `总重量：约 ${totalWeight} g` : '';

                const ingredientsHTML = details.map(d => {
                    const displayAmount = d.quantity * _detailServings;
                    const itemCount = d.items.length;
                    const btnDisabled = itemCount === 0 || d.available < d.quantity;
                    return `<div class="detail-ingredient-item" data-cat="${d.category}"><div class="ing-left"><span class="ing-name">${d.category}</span>${itemCount > 0 ? `<span class="ing-sub">(${itemCount}种商品)</span>` : '<span class="ing-sub" style="color:var(--text-muted);">无库存</span>'}</div><div class="ing-right"><span class="ing-amount">${displayAmount}</span><span class="ing-stock">${d.unit}</span><button class="btn-use" onclick="useMaterialByCategory('${recipe.id}','${d.category}',${d.quantity},'${d.unit}',${_detailServings})" ${btnDisabled ? 'disabled' : ''}>使用</button></div></div>`;
                }).join('');

                const stepsCardsHTML = recipe.steps.map((s, i) => {
                    const listId = 'stepList_' + i + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                    const stepMatsHTML = renderStepMaterials(s.materials, recipe);
                    const matsHTML = stepMatsHTML ? `<div style="margin-top:6px;margin-bottom:4px;font-size:0.85rem;font-weight:500;color:var(--text-light);"> 材料：${stepMatsHTML}</div>` : '';
                    const timerMinutes = s.timerMinutes || 0;
                    const timerDisplay = timerMinutes > 0 ? `
                        <div class="step-timer-wrap step-timer-${recipeId}-${i}">
                            <span class="timer-label">⏱️ 计时：</span>
                            <div class="timer-controls">
                                <input type="number" class="step-timer-set" value="${timerMinutes}" min="0" step="1" style="width:50px;padding:4px 2px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;height:30px;" onchange="updateStepTimerDuration('${recipeId}', ${i}, this.value)">
                                <span class="timer-display step-timer-display-${recipeId}-${i}">${String(Math.floor(timerMinutes)).padStart(2,'0')}:00</span>
                                <span class="timer-state step-timer-state-${recipeId}-${i}" style="font-size:0.65rem;color:var(--text-muted);">待开始</span>
                                <button class="btn btn-primary btn-xs step-timer-start-${recipeId}-${i}" onclick="startStepTimer('${recipeId}', ${i})">开始</button>
                                <button class="btn btn-xs step-timer-pause-${recipeId}-${i}" onclick="pauseStepTimer('${recipeId}', ${i})" disabled>暂停</button>
                                <button class="btn btn-xs step-timer-reset-${recipeId}-${i}" onclick="resetStepTimer('${recipeId}', ${i})">重置</button>
                            </div>
                        </div>
                    ` : '';
                    const stepNum = toChineseNumber(i + 1);
                    return `<div class="step-card"><div class="step-header"><span class="step-num-icon">${i + 1}</span><span class="step-num-text">步骤${stepNum}</span></div><div class="step-text">${s.text}</div>${matsHTML}${timerDisplay}<div id="${listId}" style="width:100%;"></div></div>`;
                }).join('');

                const finalImageIds = recipe.finalImages || [];
                let imagesHTML = '';
                if (finalImageIds.length > 0) {
                    const imgs = await Promise.all(finalImageIds.map(id => getImage(id)));
                    const valid = imgs.filter(d => d);
                    if (valid.length > 0) {
                        imagesHTML = valid.map((url, i) => {
                            const label = valid.length > 1 ? `${i+1}/${valid.length}` : '';
                            return `<div class="detail-thumb-item" onclick="previewFullImageByRecipe('${recipe.id}', ${i}, true)"><img src="${url}" alt="成品图 ${i+1}" loading="lazy">${label ? `<span class="thumb-counter">${label}</span>` : ''}<div class="thumb-overlay"><span>🔍</span></div></div>`;
                        }).join('');
                    } else {
                        imagesHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
                    }
                } else {
                    imagesHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px;font-size:0.9rem;grid-column:1/-1;">暂无成品图</p>';
                }

                const per100 = calcRecipeNutritionPer100g(recipe);
                let nutHTML = '';
                if (per100) {
                    const rows = [
                        ['能量', 'kJ', 'calories', per100.calories],
                        ['蛋白质', 'g', 'protein', per100.protein],
                        ['脂肪', 'g', 'fat', per100.fat],
                        ['碳水化合物', 'g', 'carbs', per100.carbs],
                        ['钠', 'mg', 'sodium', per100.sodium],
                        ['钙', 'mg', 'calcium', per100.calcium]
                    ];
                    const totalGrams = totalWeight || 100;
                    const portionGrams = totalGrams / (_detailServings || 1);
                    const factor = portionGrams / 100;
                    nutHTML = `<div style="margin-top:12px;"><div style="font-weight:700;color:var(--text);margin-bottom:4px;">📊 营养成分表</div>
                        <table class="detail-nutrition-table" style="table-layout:fixed;">
                            <thead><tr><th style="width:34%;">成分</th><th style="width:33%;">每100g</th><th style="width:33%;">每份</th></tr></thead>
                            <tbody>${rows.map(row => {
                                const v100 = row[3];
                                const vPortion = (v100 != null) ? (v100 * factor) : null;
                                return `<tr><td>${row[0]}</td><td>${v100!=null ? v100+row[1] : '—'}</td><td>${vPortion!=null ? vPortion.toFixed(1)+row[1] : '—'}</td></tr>`;
                            }).join('')}</tbody>
                        </table></div>`;
                }

                const nameHTML = `<span class="detail-emoji">${recipe.emoji||'📖'}</span> ${recipe.name}`;
                const html = `
                    <button class="close-btn" onclick="closeModal(true)">✕</button>
                    <div class="detail-recipe-name">${nameHTML}</div>
                    <div class="detail-recipe-desc">${recipe.description||'暂无描述'}</div>
                    <span class="detail-status-badge ${statusCls}">${status}</span>
                    <div class="detail-section-title"><span>📦 用料</span><div class="servings-control"><label>份数</label><input type="number" id="servingsInput" value="${_detailServings}" min="0.5" step="0.5" oninput="updateServings(this.value)" onchange="updateServings(this.value)"></div></div>
                    <div id="detailIngredientsList">${ingredientsHTML}</div>
                    <div class="detail-ingredients-footer" style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span class="total-weight">${totalWeightText}</span>
                        <button class="btn btn-primary btn-sm" onclick="useAllMaterialsByCategory('${recipe.id}')">全部使用</button>
                    </div>
                    ${nutHTML}
                    <div class="detail-steps-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;">📋 制作步骤</div><div id="detailStepsContainer">${stepsCardsHTML}</div></div>
                    <div class="detail-final-images-wrap" style="margin-top:16px;"><div style="font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border-light);padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;"><span>🖼️ 成品图 (${finalImageIds.length}张)</span><button class="btn btn-outline btn-sm" onclick="openFinalImageManager('${recipe.id}')">管理成品图</button></div><div class="detail-thumb-grid">${imagesHTML}</div></div>
                    <div class="detail-actions">
                        <button class="btn btn-ghost" onclick="closeModal(true)">关闭</button>
                        <button class="btn btn-outline" onclick="closeModal(true); setTimeout(function(){ openRecipeModal('${recipe.id}', true); }, 50);">编辑</button>
                        <button class="btn btn-primary" onclick="showFullscreenStepsById('${recipe.id}')">👩‍🍳 制作此配方</button>
                    </div>`;
                openModal(html, false);
                _detailRecipeId = recipeId;
                if (keepPosition && _detailModalScrollTop) {
                    setTimeout(() => {
                        const modal = document.querySelector('#modalOverlay .modal');
                        if (modal) modal.scrollTop = _detailModalScrollTop;
                    }, 60);
                }
                setTimeout(() => {
                    recipe.steps.forEach((s, i) => {
                        const containers = document.querySelectorAll(`#detailStepsContainer .step-card:nth-child(${i+1}) [id^="stepList_${i}_"]`);
                        if (containers.length > 0) {
                            const container = containers[containers.length - 1];
                            if (container && s.images && s.images.length > 0) {
                                renderStepImagesList(s.images, container.id, i);
                            }
                        }
                        const key = recipeId + '_' + i;
                        if (!stepTimers[key]) {
                            const totalSec = (s.timerMinutes || 0) * 60;
                            stepTimers[key] = { totalSeconds: totalSec, remain: totalSec, state: 'idle', startTime: null, interval: null };
                        }
                        updateStepTimerDisplay(recipeId, i);
                    });
                }, 100);
            };

            window.updateServings = function(val) {
                const num = parseFloat(val) || 1;
                if (num < 0.1) return;
                _detailServings = num;
                if (_detailRecipeId) {
                    const recipe = recipes.find(r => r.id === _detailRecipeId);
                    if (!recipe) return;
                    recipe.ingredients.forEach((ing, i) => {
                        const displayAmount = ing.quantity * _detailServings;
                        const amountEl = document.querySelectorAll('.detail-ingredient-item .ing-amount')[i];
                        if (amountEl) amountEl.textContent = displayAmount;
                    });
                    recipe.steps.forEach((s, i) => {
                        if (s.materials && s.materials.length > 0) {
                            const stepCard = document.querySelectorAll('#detailStepsContainer .step-card')[i];
                            if (stepCard) {
                                const matsContainer = stepCard.querySelector('.step-materials-display')?.parentElement;
                                if (matsContainer) {
                                    const matsHTML = renderStepMaterials(s.materials, recipe);
                                    if (matsHTML) {
                                        const oldSpans = matsContainer.querySelectorAll('.step-materials-display');
                                        const completedStates = Array.from(oldSpans).map(sp => sp.classList.contains('completed'));
                                        matsContainer.innerHTML = matsHTML;
                                        const newSpans = matsContainer.querySelectorAll('.step-materials-display');
                                        newSpans.forEach((sp, idx) => {
                                            if (completedStates[idx]) sp.classList.add('completed');
                                        });
                                    }
                                }
                            }
                        }
                    });
                }
            };

            // 全部使用 - 保持位置
            let _multiSelectState = null;
            window.useMaterialByCategory = function(recipeId, category, quantity, unit, servings) {
                const need = quantity * servings;
                const items = materials.filter(m => m.category === category);
                const available = items.filter(item => getItemRemaining(item) > 0);
                if (available.length === 0) { showToast('⚠️ 没有「' + category + '」类库存', 'error'); return; }
                if (available.length === 1) {
                    const item = available[0];
                    const remaining = getItemRemaining(item);
                    const remainingInTarget = convertToUnit(remaining, item.unit, unit, item.name);
                    if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
                    const actualUse = Math.min(need, remainingInTarget);
                    const actualUseOriginal = convertToUnit(actualUse, unit, item.unit, item.name);
                    const recipe = recipes.find(r => r.id === recipeId);
                    const recipeName = recipe ? recipe.name : '直接使用';
                    addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, recipeId);
                    const msg = actualUse < need ? '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」（库存不足，已全部使用）' : '✅ 使用了 ' + actualUse + ' ' + unit + ' 的「' + item.name + '」';
                    showToast(msg, 'success', true);
                    renderAll();
                    if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
                    return;
                }
                _multiSelectState = { category, remainingNeed: need, unit, recipeId, excludeIds: [], recipeName: '' };
                showMultiSelectForRemaining();
            };

            function showMultiSelectForRemaining() {
                if (!_multiSelectState) return;
                const s = _multiSelectState;
                const need = s.remainingNeed;
                if (need <= 0) {
                    const recipe = recipes.find(r => r.id === s.recipeId);
                    const recipeName = recipe ? recipe.name : '直接使用';
                    showToast('✅「' + s.category + '」已使用完毕', 'success', true);
                    _multiSelectState = null;
                    renderAll();
                    if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
                    return;
                }
                const items = materials.filter(m => m.category === s.category);
                const available = items.filter(item => getItemRemaining(item) > 0 && !s.excludeIds.includes(item.id));
                if (available.length === 0) {
                    const recipe = recipes.find(r => r.id === s.recipeId);
                    const recipeName = recipe ? recipe.name : '直接使用';
                    showToast('⚠️「' + s.category + '」已无可选商品，还差 ' + need + s.unit, 'error', true);
                    _multiSelectState = null;
                    renderAll();
                    if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
                    return;
                }
                if (available.length === 1) {
                    const item = available[0];
                    const remaining = getItemRemaining(item);
                    const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
                    if (remainingInTarget <= 0) { s.excludeIds.push(item.id); showMultiSelectForRemaining(); return; }
                    const actualUse = Math.min(s.remainingNeed, remainingInTarget);
                    const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
                    const recipe = recipes.find(r => r.id === s.recipeId);
                    const recipeName = recipe ? recipe.name : '直接使用';
                    addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId);
                    s.remainingNeed -= actualUse;
                    s.excludeIds.push(item.id);
                    if (s.remainingNeed > 0 && remainingInTarget <= actualUse) {
                        showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
                        showMultiSelectForRemaining();
                    } else {
                        const msg = s.remainingNeed > 0 ? '✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit : '✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，金额 ¥' + (actualUse * getUnitPrice(item)).toFixed(2);
                        showToast(msg, 'success');
                        _multiSelectState = null;
                        renderAll();
                        if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
                    }
                    return;
                }
                let usedText = (s.excludeIds.length > 0) ? `<br><span style="color:var(--text-muted);font-size:0.9rem;">已选商品扣减后，还需 <strong>${need} ${s.unit}</strong></span>` : '';
                let html = `<button class="close-btn" onclick="closeMultiSelectRemaining()">✕</button><h2>选择商品</h2><div style="margin-bottom:12px;font-size:0.9rem;color:var(--text-light);line-height:1.6;">需要 <strong>${need} ${s.unit}</strong> 的 <strong>${s.category}</strong>，请选择使用哪个商品：${usedText}</div><div style="max-height:400px;overflow-y:auto;">`;
                available.forEach(item => {
                    const rem = getItemRemaining(item);
                    const remInTarget = convertToUnit(rem, item.unit, s.unit, item.name);
                    const canUse = remInTarget >= need;
                    html += `<div class="item-select-card" style="background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin:6px 0;cursor:pointer;transition:var(--transition);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;" onclick="selectItemForRemaining('${item.id}')"><div class="item-info"><span class="item-name">${item.name} ${item.brand ? '· '+item.brand : ''}</span><span class="item-detail">${item.specification || ''} ${item.price ? '· ¥'+item.price : ''} ${item.openingDate ? '· 开封 '+item.openingDate : ''}</span></div><div class="item-stock">剩余 ${rem} ${item.unit} (约 ${remInTarget.toFixed(1)} ${s.unit})</div>${canUse ? '<span class="item-badge" style="background:var(--success);color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">可用</span>' : '<span class="item-badge" style="background:#b87820;color:#fff;padding:2px 8px;border-radius:12px;font-size:0.6rem;font-weight:600;">部分</span>'}</div>`;
                });
                html += `</div><div class="modal-actions"><button class="btn btn-ghost" onclick="finishMultiSelectRemaining()">完成选择</button></div>`;
                openModal(html, false);
            }

            window.selectItemForRemaining = function(itemId) {
                if (!_multiSelectState) return;
                const s = _multiSelectState;
                const item = findMaterialById(itemId);
                if (!item) { showToast('商品不存在', 'error'); return; }
                const remaining = getItemRemaining(item);
                if (remaining <= 0) { showToast('⚠️ 该商品已无库存', 'error'); return; }
                const remainingInTarget = convertToUnit(remaining, item.unit, s.unit, item.name);
                if (remainingInTarget <= 0) { showToast('该商品无可用库存', 'error'); return; }
                const actualUse = Math.min(s.remainingNeed, remainingInTarget);
                const actualUseOriginal = convertToUnit(actualUse, s.unit, item.unit, item.name);
                const recipe = recipes.find(r => r.id === s.recipeId);
                const recipeName = recipe ? recipe.name : '直接使用';
                addUsageLog(item.id, actualUseOriginal, item.unit, recipeName, s.recipeId);
                s.remainingNeed -= actualUse;
                s.excludeIds.push(item.id);
                if (s.remainingNeed <= 0) {
                    showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，需求已满足', 'success', true);
                    _multiSelectState = null;
                    renderAll();
                    if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);
                } else {
                    showToast('✅ 使用了 ' + actualUse + s.unit + '「' + item.name + '」，还差 ' + s.remainingNeed + s.unit, 'success');
                    showMultiSelectForRemaining();
                }

                if (_multiSelectState && _multiSelectState.remainingNeed > 0) showToast('⚠️ 已取消选择，还差 ' + _multiSelectState.remainingNeed + _multiSelectState.unit + '未使用', 'error', true);

            window.finishMultiSelectRemaining = function() {

                _multiSelectState = null; renderAll(); if (_detailRecipeId) setTimeout(() => viewRecipeDetail(_detailRecipeId, true), 100);

            let _allUseQueue = [], _allUseResults = [], _allUseSkipped = [], _allUseRecipeId = null, _allUseRecipeName = '';
            function saveAndRestoreDetailScroll() {
                const modal = document.querySelector('#modalOverlay .modal');
